# Casos fictícios de áudio da s5-entrada-audio (tarefa 1.2). Textos escritos pela equipe (design, 24/11).
# Nenhuma voz ou relato real: os arquivos são de voz sintética offline (ver LEIAME.md).
# palavras_chave: comparadas com a transcrição normalizada por app.risco.normalizar (minúsculas, sem acento).
# agente_esperado: null quando o design não define o agente do caso.
versao: 1
casos:
  - id: A1
    arquivo: a1.webm
    formato: webm
    texto: "Ele pode tirar meus filhos de mim?"
    palavras_chave: ["tirar", "filhos"]
    risco_esperado: false
    agente_esperado: juridico

  - id: A2
    arquivo: a2.mp4
    formato: mp4
    texto: "Tenho direito ao Bolsa Família?"
    palavras_chave: ["bolsa familia"]
    risco_esperado: false
    agente_esperado: beneficios

