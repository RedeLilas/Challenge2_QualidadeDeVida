[project]
name = "rede-lilas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "av>=15,<19",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    # Direta só para o [tool.uv.sources] valer (ele não se aplica a dependências indiretas).
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "quickjs>=1.19.4",
]

# Torch só para CPU no Linux (s5-deploy, tarefa 2.1): o servidor não tem placa de vídeo, e o torch
# padrão do PyPI no Linux traz o CUDA (pacotes nvidia-* e triton, vários GB). O torch entra pelo
# sentence-transformers. macOS e Windows continuam com o torch do PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Os testes com o Whisper de verdade baixam o modelo (~0,5 GB): rodar com `uv run pytest -m whisper`.
addopts = "-m 'not whisper'"
markers = ["whisper: usa o modelo Whisper de verdade (fora da suíte padrão)"]
