  A08:
    pergunta: O ex-companheiro de uma vizinha vivia humilhando, manipulando e fazendo chantagem para controlar a roupa que ela vestia, com quem ela conversava e tudo o que ela decidia fazer, deixando a saúde mental dela muito abalada, e ainda fez montagens com inteligência artificial mudando a voz e o rosto dela. Essa atitude é crime, e ter usado inteligência artificial muda a pena?
    resposta_esperada: Sim. Causar dano emocional à mulher que a prejudique e perturbe seu pleno desenvolvimento ou que vise degradar ou controlar suas ações, comportamentos, crenças e decisões — mediante ameaça, constrangimento, humilhação, manipulação, isolamento, chantagem, ridicularização ou limitação do direito de ir e vir — é crime punido com reclusão de 6 meses a 2 anos e multa, se a conduta não constitui crime mais grave. A pena é aumentada de metade se o crime é cometido mediante uso de inteligência artificial ou de qualquer outro recurso tecnológico que altere imagem ou som da vítima.
    pontos_obrigatorios:
    - Causar dano emocional à mulher para degradar ou controlar suas ações, comportamentos e decisões é crime punido com reclusão de 6 meses a 2 anos e multa, se não constituir crime mais grave.
    - A pena é aumentada de metade quando há uso de inteligência artificial ou outro recurso tecnológico que altere imagem ou som da vítima.
    resposta: 'Sim, a lei prevê crime para esse tipo de conduta. Causar dano emocional à mulher, com humilhação, manipulação, chantagem ou controle das ações e decisões, que prejudique a saúde psicológica dela, é crime (Código Penal, art. 147-B).


      Sobre a inteligência artificial: a pena é aumentada de metade quando o crime é cometido com uso de inteligência artificial ou outro recurso tecnológico que altere imagem ou som da vítima (Código Penal, art. 147-B, parágrafo único).


      Quem decide a pena é o juiz. A lei prevê essas consequências, mas não há resultado garantido.


      Se ela estiver em perigo agora, ligue 190.'
    artigos:
      Código Penal, art. 147-B: 'Art. 147-B. Causar dano emocional à mulher que a prejudique e perturbe seu pleno desenvolvimento ou que vise a degradar ou a controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, chantagem, ridicularização, limitação do direito de ir e vir ou qualquer outro meio que cause prejuízo à sua saúde psicológica e autodeterminação: Pena - reclusão, de 6 (seis) meses a 2 (dois) anos, e multa, se a conduta não constitui crime mais grave.

        Parágrafo único. A pena é aumentada de metade se o crime é cometido mediante uso de inteligência artificial ou de qualquer outro recurso tecnológico que altere imagem ou som da vítima.'
