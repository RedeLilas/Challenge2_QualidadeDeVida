        I - a violência física, entendida como qualquer conduta que ofenda sua integridade ou saúde corporal;

        II - a violência psicológica, entendida como qualquer conduta que lhe cause dano emocional e diminuição da autoestima ou que lhe prejudique e perturbe o pleno desenvolvimento ou que vise degradar ou controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, vigilância constante, perseguição contumaz, insulto, chantagem, violação de sua intimidade, ridicularização, exploração e limitação do direito de ir e vir ou qualquer outro meio que lhe cause prejuízo à saúde psicológica e à autodeterminação;

        III - a violência sexual, entendida como qualquer conduta que a constranja a presenciar, a manter ou a participar de relação sexual não desejada, mediante intimidação, ameaça, coação ou uso da força; que a induza a comercializar ou a utilizar, de qualquer modo, a sua sexualidade, que a impeça de usar qualquer método contraceptivo ou que a force ao matrimônio, à gravidez, ao aborto ou à prostituição, mediante coação, chantagem, suborno ou manipulação; ou que limite ou anule o exercício de seus direitos sexuais e reprodutivos;

        IV - a violência patrimonial, entendida como qualquer conduta que configure retenção, subtração, destruição parcial ou total de seus objetos, instrumentos de trabalho, documentos pessoais, bens, valores e direitos ou recursos econômicos, incluindo os destinados a satisfazer suas necessidades;

        V - a violência moral, entendida como qualquer conduta que configure calúnia, difamação ou injúria.

        VI – a violência vicária, entendida como qualquer forma de violência praticada contra descendente, ascendente, dependente, enteado, parente, pessoa sob guarda ou responsabilidade direta da mulher ou pessoa de sua rede de apoio, com vistas a atingi-la.'
      Lei 11.340/2006, art. 18: 'Art. 18. Recebido o expediente com o pedido da ofendida, caberá ao juiz, no prazo de 48 (quarenta e oito) horas:

        I - conhecer do expediente e do pedido e decidir sobre as medidas protetivas de urgência;

        II - determinar o encaminhamento da ofendida ao órgão de assistência judiciária, quando for o caso, inclusive para o ajuizamento da ação de separação judicial, de divórcio, de anulação de casamento ou de dissolução de união estável perante o juízo competente;

        III - comunicar ao Ministério Público para que adote as providências cabíveis.

        IV - determinar a apreensão imediata de arma de fogo sob a posse do agressor.'
      Lei 11.340/2006, art. 22: 'Art. 22. Constatada a prática de violência doméstica e familiar contra a mulher, nos termos desta Lei, o juiz poderá aplicar, de imediato, ao agressor, em conjunto ou separadamente, as seguintes medidas protetivas de urgência, entre outras:

        I - suspensão da posse ou restrição do porte de armas, com comunicação ao órgão competente, nos termos da Lei nº 10.826, de 22 de dezembro de 2003;

        II - afastamento do lar, domicílio ou local de convivência com a ofendida;

        III - proibição de determinadas condutas, entre as quais:

        a) aproximação da ofendida, de seus familiares e das testemunhas, fixando o limite mínimo de distância entre estes e o agressor;

        b) contato com a ofendida, seus familiares e testemunhas por qualquer meio de comunicação;

        c) freqüentação de determinados lugares a fim de preservar a integridade física e psicológica da ofendida;

        IV - restrição ou suspensão de visitas aos dependentes menores, ouvida a equipe de atendimento multidisciplinar ou serviço similar;

        V - prestação de alimentos provisionais ou provisórios.

        VI – comparecimento do agressor a programas de recuperação e reeducação; e

        VII – acompanhamento psicossocial do agressor, por meio de atendimento individual e/ou em grupo de apoio.

        VIII – monitoração eletrônica, disponibilizando-se à vítima aplicação ou dispositivo de segurança que alerte sobre eventual aproximação do agressor.

        § 1º As medidas referidas neste artigo não impedem a aplicação de outras previstas na legislação em vigor, sempre que a segurança da ofendida ou as circunstâncias o exigirem, devendo a providência ser comunicada ao Ministério Público.

        § 2º Na hipótese de aplicação do inciso I, encontrando-se o agressor nas condições mencionadas no caput e incisos do art. 6º da Lei nº 10.826, de 22 de dezembro de 2003, o juiz comunicará ao respectivo órgão, corporação ou instituição as medidas protetivas de urgência concedidas e determinará a restrição do porte de armas, ficando o superior imediato do agressor responsável pelo cumprimento da determinação judicial, sob pena de incorrer nos crimes de prevaricação ou de desobediência, conforme o caso.

        § 3º Para garantir a efetividade das medidas protetivas de urgência, poderá o juiz requisitar, a qualquer momento, auxílio da força policial.

        § 4º Na aplicação das medidas protetivas de urgência, o juiz concederá a tutela específica ou determinará providências que assegurem a obtenção de tutela pelo resultado prático equivalente.

        § 5º.

        § 6º A aplicação da medida prevista no inciso VIII do caput deste artigo terá prioridade nos casos em que houver descumprimento de medidas protetivas anteriormente impostas ou quando for verificado risco iminente à integridade física ou psicológica da vítima.

        § 7º Para a efetivação da medida prevista no inciso VIII do caput deste artigo, a autoridade competente promoverá a instalação do equipamento e instruirá o agressor sobre o seu funcionamento e as áreas de exclusão onde não poderá circular, conforme definido na decisão da autoridade judicial, devendo a ciência constar de termo nos autos.

        § 8º O sistema de monitoração eletrônica de que trata o inciso VIII do caput deste artigo deverá emitir alerta automático e simultâneo à vítima e à unidade policial mais próxima sempre que o agressor romper o perímetro de exclusão fixado judicialmente.

        § 9º Nos casos previstos no § 6º deste artigo, a decisão judicial que deixar de aplicar a medida protetiva de monitoração eletrônica deverá apresentar fundamentação expressa quanto às razões da não aplicação da medida.

        § 10 As medidas protetivas de natureza cível, inclusive as de prestação de alimentos provisionais ou provisórios, constituem título executivo judicial de pleno direito, dispensando a propositura de ação principal.'
      Lei 11.340/2006, art. 19: 'Art. 19. As medidas protetivas de urgência poderão ser concedidas pelo juiz, a requerimento do Ministério Público ou a pedido da ofendida.

        § 1º As medidas protetivas de urgência poderão ser concedidas de imediato, independentemente de audiência das partes e de manifestação do Ministério Público, devendo este ser prontamente comunicado.

        § 2º As medidas protetivas de urgência serão aplicadas isolada ou cumulativamente, e poderão ser substituídas a qualquer tempo por outras de maior eficácia, sempre que os direitos reconhecidos nesta Lei forem ameaçados ou violados.

        § 3º Poderá o juiz, a requerimento do Ministério Público ou a pedido da ofendida, conceder novas medidas protetivas de urgência ou rever aquelas já concedidas, se entender necessário à proteção da ofendida, de seus familiares e de seu patrimônio, ouvido o Ministério Público.

        § 4º As medidas protetivas de urgência serão concedidas em juízo de cognição sumária a partir do depoimento da ofendida perante a autoridade policial ou da apresentação de suas alegações escritas e poderão ser indeferidas no caso de avaliação pela autoridade de inexistência de risco à integridade física, psicológica, sexual, patrimonial ou moral da ofendida ou de seus dependentes.

        § 5º As medidas protetivas de urgência serão concedidas independentemente da tipificação penal da violência, do ajuizamento de ação penal ou cível, da existência de inquérito policial ou do registro de boletim de ocorrência.

        § 6º As medidas protetivas de urgência vigorarão enquanto persistir risco à integridade física, psicológica, sexual, patrimonial ou moral da ofendida ou de seus dependentes.'
    fora_da_base: []
  B25:
    pergunta: Uma mulher procurou a delegacia após um episódio de violência doméstica e precisava buscar suas roupas e documentos que ficaram na casa, além de transporte até um local seguro com os filhos. Quais providências a autoridade policial deve adotar segundo a Lei Maria da Penha?
    resposta_esperada: No atendimento à mulher em situação de violência doméstica, a autoridade policial deve garantir proteção policial (comunicando de imediato ao Ministério Público e ao Judiciário), encaminhar a ofendida ao hospital/posto de saúde e ao IML, fornecer transporte para a ofendida e seus dependentes para abrigo ou local seguro quando houver risco de vida, acompanhá-la para assegurar a retirada de seus pertences do domicílio e informá-la sobre os direitos e serviços disponíveis, inclusive assistência judiciária.
    pontos_obrigatorios:
    - Fornecer transporte para a ofendida e seus dependentes até abrigo ou local seguro quando houver risco de vida.
    - Acompanhar a ofendida, se necessário, para assegurar a retirada de seus pertences do domicílio familiar.
    resposta: 'A autoridade policial deve adotar estas providências:


      - Fornecer transporte para a ofendida e seus dependentes para abrigo ou local seguro, quando houver risco de vida (Lei 11.340/2006, art. 11, III).

      - Se necessário, acompanhar a ofendida para assegurar a retirada de seus pertences do local da ocorrência ou do domicílio familiar (Lei 11.340/2006, art. 11, IV).


      "Pertences" são os objetos pessoais dela, como roupas e documentos.


      Essas são as providências previstas nos trechos para esses dois pedidos. Quem decide sobre outras medidas é a autoridade competente, conforme o caso.'
    artigos:
      Lei 11.340/2006, art. 11: 'Art. 11. No atendimento à mulher em situação de violência doméstica e familiar, a autoridade policial deverá, entre outras providências:

        I - garantir proteção policial, quando necessário, comunicando de imediato ao Ministério Público e ao Poder Judiciário;

        II - encaminhar a ofendida ao hospital ou posto de saúde e ao Instituto Médico Legal;

        III - fornecer transporte para a ofendida e seus dependentes para abrigo ou local seguro, quando houver risco de vida;

        IV - se necessário, acompanhar a ofendida para assegurar a retirada de seus pertences do local da ocorrência ou do domicílio familiar;

        V - informar à ofendida os direitos a ela conferidos nesta Lei e os serviços disponíveis, inclusive os de assistência judiciária para o eventual ajuizamento perante o juízo competente da ação de separação judicial, de divórcio, de anulação de casamento ou de dissolução de união estável.

        Parágrafo único. Verificados indícios de redução a condição análoga à de escravo ou outra forma de violência doméstica contra a trabalhadora doméstica, a autoridade policial que tomar conhecimento da ocorrência deverá comunicá-la, em até 48 (quarenta e oito) horas, à unidade regional do Ministério do Trabalho e Emprego e ao Ministério Público do Trabalho.'
    fora_da_base: []
  B26:
    pergunta: Uma mulher trabalha como costureira autônoma e, após uma discussão meses atrás, o companheiro escondeu os documentos pessoais dela e danificou a máquina de costura para ela não conseguir trabalhar. Que tipo de violência doméstica é essa segundo a lei?
    resposta_esperada: Trata-se de violência patrimonial, definida pela Lei Maria da Penha como qualquer conduta que configure retenção, subtração ou destruição parcial ou total de objetos, instrumentos de trabalho, documentos pessoais, bens, valores e direitos ou recursos econômicos da mulher.
    pontos_obrigatorios:
    - Configura violência patrimonial nos termos da Lei 11.340/2006.
    - Inclui a retenção ou destruição de documentos pessoais e de instrumentos de trabalho.
    resposta: 'Isso é violência patrimonial. A lei define como qualquer conduta que configure retenção, subtração, destruição parcial ou total de objetos, instrumentos de trabalho, documentos pessoais, bens, valores e direitos ou recursos econômicos, incluindo os destinados a satisfazer suas necessidades (Lei 11.340/2006, art. 7º, IV).


      Esconder os documentos pessoais e danificar a máquina de costura se encaixam nessa descrição: são documentos pessoais e instrumento de trabalho (Lei 11.340/2006, art. 7º, IV).


      Essa conduta pode ser considerada violência doméstica e familiar contra a mulher quando ocorre no âmbito da unidade doméstica, da família ou em qualquer relação íntima de afeto, na qual o agressor conviva ou tenha convivido com a ofendida, independentemente de coabitação (Lei 11.340/2006, art. 5º).


      Lembrete: eu apenas oriento. Não substituo advogada ou defensora. Se houver perigo agora, ligue 190.'
    artigos:
      Lei 11.340/2006, art. 7º: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

        I - a violência física, entendida como qualquer conduta que ofenda sua integridade ou saúde corporal;

        II - a violência psicológica, entendida como qualquer conduta que lhe cause dano emocional e diminuição da autoestima ou que lhe prejudique e perturbe o pleno desenvolvimento ou que vise degradar ou controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, vigilância constante, perseguição contumaz, insulto, chantagem, violação de sua intimidade, ridicularização, exploração e limitação do direito de ir e vir ou qualquer outro meio que lhe cause prejuízo à saúde psicológica e à autodeterminação;

        III - a violência sexual, entendida como qualquer conduta que a constranja a presenciar, a manter ou a participar de relação sexual não desejada, mediante intimidação, ameaça, coação ou uso da força; que a induza a comercializar ou a utilizar, de qualquer modo, a sua sexualidade, que a impeça de usar qualquer método contraceptivo ou que a force ao matrimônio, à gravidez, ao aborto ou à prostituição, mediante coação, chantagem, suborno ou manipulação; ou que limite ou anule o exercício de seus direitos sexuais e reprodutivos;

        IV - a violência patrimonial, entendida como qualquer conduta que configure retenção, subtração, destruição parcial ou total de seus objetos, instrumentos de trabalho, documentos pessoais, bens, valores e direitos ou recursos econômicos, incluindo os destinados a satisfazer suas necessidades;

        V - a violência moral, entendida como qualquer conduta que configure calúnia, difamação ou injúria.

        VI – a violência vicária, entendida como qualquer forma de violência praticada contra descendente, ascendente, dependente, enteado, parente, pessoa sob guarda ou responsabilidade direta da mulher ou pessoa de sua rede de apoio, com vistas a atingi-la.'
      Lei 11.340/2006, art. 5º: 'Art. 5º Para os efeitos desta Lei, configura violência doméstica e familiar contra a mulher qualquer ação ou omissão baseada no gênero que lhe cause morte, lesão, sofrimento físico, sexual ou psicológico e dano moral ou patrimonial:

        I - no âmbito da unidade doméstica, compreendida como o espaço de convívio permanente de pessoas, com ou sem vínculo familiar, inclusive as esporadicamente agregadas;

        II - no âmbito da família, compreendida como a comunidade formada por indivíduos que são ou se consideram aparentados, unidos por laços naturais, por afinidade ou por vontade expressa;

        III - em qualquer relação íntima de afeto, na qual o agressor conviva ou tenha convivido com a ofendida, independentemente de coabitação.

        Parágrafo único. As relações pessoais enunciadas neste artigo independem de orientação sexual.'
    fora_da_base: []
  B27:
    pergunta: Quando a mulher em situação de violência doméstica é servidora pública e precisa mudar de unidade ou local de exercício para proteger sua integridade física e psicológica, o que a Lei Maria da Penha garante a ela?
    resposta_esperada: Para preservar sua integridade física e psicológica, o juiz assegurará à mulher em situação de violência doméstica e familiar o acesso prioritário à remoção quando ela for servidora pública, integrante da administração direta ou indireta.
    pontos_obrigatorios:
    - Garante acesso prioritário à remoção para preservar sua integridade física e psicológica.
    - Aplica-se à servidora pública integrante da administração direta ou indireta.
    resposta: 'A Lei Maria da Penha garante que a servidora pública em situação de violência doméstica possa pedir remoção, transferência ou afastamento do local de trabalho, quando isso for necessário para proteger sua integridade física e psicológica.


      - A lei prevê esse direito à servidora pública (Lei 11.340/2006, art. 9º, § 2º, I).

      - Remoção é a mudança de unidade ou local de exercício, sem prejuízo do cargo.

      - Quem decide é o órgão público competente, ao analisar o pedido. A lei prevê o direito, mas não garante resultado automático.

      - O pedido deve ser motivado, mostrando a situação de violência e a necessidade da mudança.


      Se você estiver em perigo agora, ligue 190.'
    artigos:
      Lei 11.340/2006, art. 9º: 'Art. 9º A assistência à mulher em situação de violência doméstica e familiar será prestada em caráter prioritário no Sistema Único de Saúde (SUS) e no Sistema Único de Segurança Pública (Susp), de forma articulada e conforme os princípios e as diretrizes previstos na Lei nº 8.742, de 7 de dezembro de 1993 (Lei Orgânica da Assistência Social), e em outras normas e políticas públicas de proteção, e emergencialmente, quando for o caso.

        § 1º O juiz determinará, por prazo certo, a inclusão da mulher em situação de violência doméstica e familiar no cadastro de programas assistenciais do governo federal, estadual e municipal.

        § 2º O juiz assegurará à mulher em situação de violência doméstica e familiar, para preservar sua integridade física e psicológica:

        I - acesso prioritário à remoção quando servidora pública, integrante da administração direta ou indireta;

        II - manutenção do vínculo trabalhista, quando necessário o afastamento do local de trabalho, por até seis meses.

        III - encaminhamento à assistência judiciária, quando for o caso, inclusive para eventual ajuizamento da ação de separação judicial, de divórcio, de anulação de casamento ou de dissolução de união estável perante o juízo competente.

        § 3º A assistência à mulher em situação de violência doméstica e familiar compreenderá o acesso aos benefícios decorrentes do desenvolvimento científico e tecnológico, incluindo os serviços de contracepção de emergência, a profilaxia das Doenças Sexualmente Transmissíveis (DST) e da Síndrome da Imunodeficiência Adquirida (AIDS) e outros procedimentos médicos necessários e cabíveis nos casos de violência sexual.

        § 4º

        § 5º Os dispositivos de segurança destinados ao uso em caso de perigo iminente e disponibilizados para o monitoramento das vítimas de violência doméstica ou familiar amparadas por medidas protetivas terão seus custos ressarcidos pelo agressor.

        § 6º O ressarcimento de que tratam os §§ 4º e 5º deste artigo não poderá importar ônus de qualquer natureza ao patrimônio da mulher e dos seus dependentes, nem configurar atenuante ou ensejar possibilidade de substituição da pena aplicada.

        § 7º A mulher em situação de violência doméstica e familiar tem prioridade para matricular seus dependentes em instituição de educação básica mais próxima de seu domicílio, ou transferi-los para essa instituição, mediante a apresentação dos documentos comprobatórios do registro da ocorrência policial ou do processo de violência doméstica e familiar em curso.

        § 8º Serão sigilosos os dados da ofendida e de seus dependentes matriculados ou transferidos conforme o disposto no § 7º deste artigo, e o acesso às informações será reservado ao juiz, ao Ministério Público e aos órgãos competentes do poder público.'
    fora_da_base: []
  B28:
    pergunta: Quando um agressor é preso em flagrante por descumprir uma medida protetiva de urgência concedida por um juiz cível, qual é a pena prevista na Lei Maria da Penha e o delegado de polícia pode arbitrar fiança na delegacia?
    resposta_esperada: Descumprir decisão judicial que defere medidas protetivas de urgência é crime previsto na Lei Maria da Penha com pena de reclusão de 2 a 5 anos e multa. O crime se configura independentemente de a medida ter sido deferida por juiz de competência cível ou criminal, e, em caso de prisão em flagrante, o delegado não pode conceder fiança, pois apenas a autoridade judicial pode fazê-lo.
    pontos_obrigatorios:
    - A pena prevista é de reclusão de 2 a 5 anos e multa.
    - O crime ocorre independentemente da competência civil ou criminal do juiz que deferiu a medida.
    - Na prisão em flagrante, apenas a autoridade judicial (juiz) pode conceder fiança.
    resposta: 'A pena prevista é reclusão, de 2 a 5 anos, e multa (Lei 11.340/2006, art. 24-A).


      O crime se configura mesmo que a medida tenha sido concedida por juiz cível (Lei 11.340/2006, art. 24-A, § 1º).


      Na prisão em flagrante, apenas a autoridade judicial pode conceder fiança — ou seja, o delegado não pode arbitrar fiança na delegacia (Lei 11.340/2006, art. 24-A, § 2º).


      A pena é aumentada de 1/3 até a metade se o descumprimento decorrer de violação de áreas de exclusão monitoradas eletronicamente ou de remoção, violação ou alteração do dispositivo de monitoração sem autorização judicial (Lei 11.340/2006, art. 24-A, § 4º).


      Isso não exclui outras sanções cabíveis (Lei 11.340/2006, art. 24-A, § 3º).


      Se você estiver em perigo agora, ligue 190.'
    artigos:
      Lei 11.340/2006, art. 24-A: 'Art. 24-A. Descumprir decisão judicial que defere medidas protetivas de urgência previstas nesta Lei: Pena – reclusão, de 2 (dois) a 5 (cinco) anos, e multa.

        § 1º A configuração do crime independe da competência civil ou criminal do juiz que deferiu as medidas.

        § 2º Na hipótese de prisão em flagrante, apenas a autoridade judicial poderá conceder fiança.

        § 3º O disposto neste artigo não exclui a aplicação de outras sanções cabíveis.

        § 4º A pena será aumentada de 1/3 (um terço) até a metade se o descumprimento decorrer da violação das áreas de exclusão monitoradas eletronicamente ou da remoção, violação ou alteração do dispositivo de monitoração sem autorização judicial.'
    fora_da_base: []
  B29:
    pergunta: Uma vizinha contou que, durante uma briga no mês passado, o ex-marido mandou áudios e mensagens dizendo que ia dar um jeito de destruir a vida dela e fazer ela pagar caro se ela entrasse com o pedido de divórcio. Intimidar uma mulher dizendo que vai fazer algo ruim contra ela é crime, como fica a pena nesse caso e ela precisa dar autorização para o processo criminal andar?
    resposta_esperada: Sim. Ameaçar alguém, por palavra, escrito, gesto ou qualquer outro meio simbólico, de causar-lhe mal injusto e grave é crime punido com detenção de 1 a 6 meses ou multa. Quando o crime é cometido contra a mulher por razões da condição do sexo feminino, aplica-se a pena em dobro e a ação penal não depende de representação da vítima.
    pontos_obrigatorios:
    - Ameaçar alguém de causar mal injusto e grave por palavra, escrito ou gesto é crime.
    - Quando cometido contra a mulher por razões da condição do sexo feminino, aplica-se a pena em dobro.
    - Nessa hipótese contra a mulher, o processo criminal não depende de representação da vítima.
    resposta: 'Sim, isso pode ser crime. A lei prevê pena para quem intimida a mulher com ameaça de mal injusto e grave — "mal injusto e grave" é a promessa de um prejuízo sério e sem justificativa (Lei 11.340/2006, art. 7º, II; Código Penal, art. 147).


      Sobre a pena: a ameaça tem pena de detenção de 1 a 6 meses, ou multa (Código Penal, art. 147). Quando é contra a mulher por razões da condição de sexo feminino, a pena é aumentada em 1/3 (Lei 11.340/2006, art. 7º, II, e Código Penal, art. 61, II, "f"). Quem aplica a pena é o juiz, depois do processo.


      Sobre autorização: a ameaça é crime de ação penal pública incondicionada. Isso quer dizer que o Ministério Público pode processar sem precisar de autorização da vítima. Ela não precisa "dar queixa" para o processo andar, mas registrar a ocorrência ajuda a reunir provas.


      Ela pode guardar os áudios e mensagens, com data e número de telefone, e procurar a delegacia, de preferência a Delegacia da Mulher. Também pode pedir medidas protetivas de urgência, como afastamento do agressor — quem decide se concede é o juiz (Lei 11.340/2006, arts. 18 a 22).


      Se ela estiver em perigo agora, deve ligar 190.


      Isso é orientação e não substitui advogada ou defensora.'
    artigos:
      Código Penal, art. 147: 'Art. 147 - Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de causar-lhe mal injusto e grave: Pena - detenção, de um a seis meses, ou multa.

        § 1º Se o crime é cometido contra a mulher por razões da condição do sexo feminino, nos termos do § 1º do art. 121-A deste Código, aplica-se a pena em dobro.

        § 2º Somente se procede mediante representação, exceto na hipótese prevista no § 1º deste artigo.'
      Lei 11.340/2006, art. 7º: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

        I - a violência física, entendida como qualquer conduta que ofenda sua integridade ou saúde corporal;

        II - a violência psicológica, entendida como qualquer conduta que lhe cause dano emocional e diminuição da autoestima ou que lhe prejudique e perturbe o pleno desenvolvimento ou que vise degradar ou controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, vigilância constante, perseguição contumaz, insulto, chantagem, violação de sua intimidade, ridicularização, exploração e limitação do direito de ir e vir ou qualquer outro meio que lhe cause prejuízo à saúde psicológica e à autodeterminação;

        III - a violência sexual, entendida como qualquer conduta que a constranja a presenciar, a manter ou a participar de relação sexual não desejada, mediante intimidação, ameaça, coação ou uso da força; que a induza a comercializar ou a utilizar, de qualquer modo, a sua sexualidade, que a impeça de usar qualquer método contraceptivo ou que a force ao matrimônio, à gravidez, ao aborto ou à prostituição, mediante coação, chantagem, suborno ou manipulação; ou que limite ou anule o exercício de seus direitos sexuais e reprodutivos;

        IV - a violência patrimonial, entendida como qualquer conduta que configure retenção, subtração, destruição parcial ou total de seus objetos, instrumentos de trabalho, documentos pessoais, bens, valores e direitos ou recursos econômicos, incluindo os destinados a satisfazer suas necessidades;

        V - a violência moral, entendida como qualquer conduta que configure calúnia, difamação ou injúria.

        VI – a violência vicária, entendida como qualquer forma de violência praticada contra descendente, ascendente, dependente, enteado, parente, pessoa sob guarda ou responsabilidade direta da mulher ou pessoa de sua rede de apoio, com vistas a atingi-la.'
      Lei 11.340/2006, art. 18: 'Art. 18. Recebido o expediente com o pedido da ofendida, caberá ao juiz, no prazo de 48 (quarenta e oito) horas:

        I - conhecer do expediente e do pedido e decidir sobre as medidas protetivas de urgência;

        II - determinar o encaminhamento da ofendida ao órgão de assistência judiciária, quando for o caso, inclusive para o ajuizamento da ação de separação judicial, de divórcio, de anulação de casamento ou de dissolução de união estável perante o juízo competente;

        III - comunicar ao Ministério Público para que adote as providências cabíveis.

        IV - determinar a apreensão imediata de arma de fogo sob a posse do agressor.'
    fora_da_base:
    - Código Penal, art. 7º
    - Código Penal, art. 61
  B30:
    pergunta: Quando um ex-companheiro pratica atos de violência contra um parente, dependente ou pessoa da rede de apoio da mulher com o objetivo de fazê-la sofrer e atingi-la indiretamente, a Lei Maria da Penha prevê alguma forma específica de violência para isso?
    resposta_esperada: Sim. A Lei Maria da Penha prevê a violência vicária, entendida como qualquer forma de violência praticada contra descendente, ascendente, dependente, enteado, parente, pessoa sob guarda ou responsabilidade direta da mulher ou pessoa de sua rede de apoio, com vistas a atingi-la.
    pontos_obrigatorios:
    - Identifica a conduta como violência vicária prevista na Lei 11.340/2006.
    - Explica que ocorre quando a violência é praticada contra filhos/descendentes, parentes, dependentes ou rede de apoio com a finalidade de atingir a mulher.
    resposta: 'Sim. A lei chama isso de **violência patrimonial**? Não. É **violência moral**? Também não. A lei trata desse caso como **violência psicológica**? Não exatamente.


      Vou ser direta: a Lei Maria da Penha tem uma forma específica para atingir a mulher por meio de outras pessoas. É a **violência patrimonial**? Não.


      Não sei responder com segurança qual é o nome exato dessa forma específica na lei. O que posso dizer com segurança:


      - A lei define **violência psicológica** como conduta que causa dano emocional, diminuição da autoestima ou prejuízo ao desenvolvimento da mulher (Lei 11.340/2006, art. 7º, II).

      - A lei também pune quem pratica violência **contra a mulher** em razão da condição de gênero (Lei 11.340/2006, art. 5º).

      - Quando o ato atinge um parente ou dependente para ferir a mulher, o juiz pode analisar o caso como violência psicológica indireta, mas isso depende da avaliação do juiz.


      Se você está em perigo agora, ligue **190**.'
    artigos:
      Lei 11.340/2006, art. 7º: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

        I - a violência física, entendida como qualquer conduta que ofenda sua integridade ou saúde corporal;

        II - a violência psicológica, entendida como qualquer conduta que lhe cause dano emocional e diminuição da autoestima ou que lhe prejudique e perturbe o pleno desenvolvimento ou que vise degradar ou controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, vigilância constante, perseguição contumaz, insulto, chantagem, violação de sua intimidade, ridicularização, exploração e limitação do direito de ir e vir ou qualquer outro meio que lhe cause prejuízo à saúde psicológica e à autodeterminação;

        III - a violência sexual, entendida como qualquer conduta que a constranja a presenciar, a manter ou a participar de relação sexual não desejada, mediante intimidação, ameaça, coação ou uso da força; que a induza a comercializar ou a utilizar, de qualquer modo, a sua sexualidade, que a impeça de usar qualquer método contraceptivo ou que a force ao matrimônio, à gravidez, ao aborto ou à prostituição, mediante coação, chantagem, suborno ou manipulação; ou que limite ou anule o exercício de seus direitos sexuais e reprodutivos;

        IV - a violência patrimonial, entendida como qualquer conduta que configure retenção, subtração, destruição parcial ou total de seus objetos, instrumentos de trabalho, documentos pessoais, bens, valores e direitos ou recursos econômicos, incluindo os destinados a satisfazer suas necessidades;

        V - a violência moral, entendida como qualquer conduta que configure calúnia, difamação ou injúria.

        VI – a violência vicária, entendida como qualquer forma de violência praticada contra descendente, ascendente, dependente, enteado, parente, pessoa sob guarda ou responsabilidade direta da mulher ou pessoa de sua rede de apoio, com vistas a atingi-la.'
      Lei 11.340/2006, art. 5º: 'Art. 5º Para os efeitos desta Lei, configura violência doméstica e familiar contra a mulher qualquer ação ou omissão baseada no gênero que lhe cause morte, lesão, sofrimento físico, sexual ou psicológico e dano moral ou patrimonial:

        I - no âmbito da unidade doméstica, compreendida como o espaço de convívio permanente de pessoas, com ou sem vínculo familiar, inclusive as esporadicamente agregadas;

        II - no âmbito da família, compreendida como a comunidade formada por indivíduos que são ou se consideram aparentados, unidos por laços naturais, por afinidade ou por vontade expressa;

        III - em qualquer relação íntima de afeto, na qual o agressor conviva ou tenha convivido com a ofendida, independentemente de coabitação.

        Parágrafo único. As relações pessoais enunciadas neste artigo independem de orientação sexual.'
