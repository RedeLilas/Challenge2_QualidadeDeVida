B:
  B01:
    pergunta: Nos casos de violência doméstica, a pena do agressor pode ser substituída apenas por pagamento de cesta básica ou multa isolada, e a mulher pode ser encarregada de entregar pessoalmente uma intimação judicial para ele?
    resposta_esperada: Não para ambas as perguntas. A Lei Maria da Penha veda expressamente a aplicação de penas de cesta básica ou outras de prestação pecuniária, bem como a substituição de pena que implique o pagamento isolado de multa. Além disso, a ofendida deve ser notificada dos atos processuais relativos ao agressor (especialmente entrada e saída da prisão), mas não pode, em hipótese alguma, entregar intimação ou notificação ao agressor.
    pontos_obrigatorios:
    - É vedada a aplicação de penas de cesta básica ou de prestação pecuniária e o pagamento isolado de multa.
    - A ofendida não pode entregar intimação ou notificação ao agressor.
    resposta: 'Não. A lei não permite essas duas coisas.


      **1. Pena só com cesta básica ou multa isolada**


      A lei não autoriza substituir a pena por apenas pagamento de cesta básica ou multa isolada. O juiz pode substituir a pena privativa de liberdade por outras penas restritivas de direitos, mas com condições (Lei 11.340/2006, art. 17 e Código Penal, art. 44). O pagamento de cesta básica ou multa pode aparecer junto com outras obrigações, nunca sozinho. Quem decide é o juiz.


      **2. A mulher entregar a intimação pessoalmente**


      Isso não é permitido. A intimação é ato oficial. Quem cumpre é o oficial de justiça ou outro servidor autorizado (Código de Processo Penal, arts. 351 a 353). A própria lei proíbe que a mulher seja encarregada de atos assim, para evitar contato com o agressor (Lei 11.340/2006, art. 21, parágrafo único).


      Se você estiver em perigo agora, ligue 190.


      Isso é orientação e não substitui advogada ou defensora.'
    artigos:
      Lei 11.340/2006, art. 21: 'Art. 21. A ofendida deverá ser notificada dos atos processuais relativos ao agressor, especialmente dos pertinentes ao ingresso e à saída da prisão, sem prejuízo da intimação do advogado constituído ou do defensor público.

        Parágrafo único. A ofendida não poderá entregar intimação ou notificação ao agressor.'
    fora_da_base:
    - Código Penal, art. 17
    - Código Penal, art. 44
    - art. 351 (norma não identificada)
  B02:
    pergunta: Uma mulher desabafou com uma vizinha que, meses atrás, o marido segurou ela à força pelo braço e obrigou que ela tivesse relação íntima com ele mesmo ela chorando e pedindo para parar, porque ele dizia que no casamento ela tinha obrigação. Que crime comete quem obriga alguém a ter relação sexual à força desse jeito, e qual é a pena prevista na lei?
    resposta_esperada: Trata-se do crime de estupro, que consiste em constranger alguém, mediante violência ou grave ameaça, a ter conjunção carnal ou a praticar ou permitir que com ele se pratique outro ato libidinoso, com pena de reclusão de 6 a 10 anos.
    pontos_obrigatorios:
    - Forçar alguém, mediante violência ou grave ameaça, a ter relação sexual ou praticar outro ato libidinoso configura o crime de estupro.
    - A pena prevista é de reclusão de 6 a 10 anos.
    resposta: 'Não sei responder com segurança. Os trechos enviados não trazem o crime de estupro nem a pena correspondente. Eles tratam de lesão corporal (Código Penal, art. 129), dano emocional (Código Penal, art. 147-B), perseguição (Código Penal, art. 147-A), injúria (Código Penal, art. 140) e ameaça (Código Penal, art. 147), mas não descrevem relação sexual forçada.


      Se ela estiver em perigo agora, ligue 190. Para orientação sobre esse caso, procure uma advogada, a Defensoria Pública ou a Delegacia da Mulher.'
    artigos:
      Código Penal, art. 129: 'Art. 129. Ofender a integridade corporal ou a saúde de outrem: Pena - detenção, de três meses a um ano.

        § 1º Se resulta:

        I - Incapacidade para as ocupações habituais, por mais de trinta dias;

        II - perigo de vida;

        III - debilidade permanente de membro, sentido ou função;

        IV - aceleração de parto: Pena - reclusão, de um a cinco anos.

        § 2° Se resulta:

        I - Incapacidade permanente para o trabalho;

        II - enfermidade incuravel;

        IV - deformidade permanente;

        V - aborto: Pena - reclusão, de dois a oito anos.

        § 3° Se resulta morte e as circunstâncias evidenciam que o agente não quís o resultado, nem assumiu o risco de produzí-lo: Pena - reclusão, de quatro a doze anos.

        § 3º-A. No crime previsto no § 3º deste artigo, se cometido no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil: Pena - reclusão, de 20 (vinte) a 40 (quarenta) anos.

        § 4° Se o agente comete o crime impelido por motivo de relevante valor social ou moral ou sob o domínio de violenta emoção, logo em seguida a injusta provocação da vítima, o juiz pode reduzir a pena de um sexto a um terço.

        § 5° O juiz, não sendo graves as lesões, pode ainda substituir a pena de detenção pela de multa, de duzentos mil réis a dois contos de réis:

        I - se ocorre qualquer das hipóteses do parágrafo anterior;

        II - se as lesões são recíprocas.

        § 6° Se a lesão é culposa: Pena - detenção, de dois meses a um ano.

        § 7 o Aumenta-se a pena de 1/3 (um terço) se ocorrer qualquer das hipóteses dos §§ 4 o e 6 o do art. 121 deste Código.

        § 8º - Aplica-se à lesão culposa o disposto no § 5º do art. 121.

        § 8º-A. Com exceção do disposto no § 3º-A deste artigo, aumenta-se a pena em 2/3 (dois terços) se a lesão é praticada por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil.

        § 9º Se a lesão for praticada contra ascendente, descendente, irmão, cônjuge ou companheiro, pessoa com relação de trabalho doméstico ou com quem conviva ou tenha convivido, ou, ainda, prevalecendo-se o agente das relações domésticas, de trabalho doméstico, de coabitação ou de hospitalidade: Pena – reclusão, de 2 (dois) a 5 (cinco) anos.

        § 10. Nos casos previstos nos §§ 1 o a 3 o deste artigo, se as circunstâncias são as indicadas no § 9 o deste artigo, aumenta-se a pena em 1/3 (um terço).

        § 11. Na hipótese do § 9 o deste artigo, a pena será aumentada de um terço se o crime for cometido contra pessoa portadora de deficiência.

        § 12. Aumenta-se a pena de:

        I - 1/3 (um terço) a 2/3 (dois terços) se a lesão dolosa for praticada:

        a) contra autoridade ou agente descrito nos arts. 142 e 144 da Constituição Federal ou integrantes do sistema prisional ou da Força Nacional de Segurança Pública, no exercício da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente consanguíneo até terceiro grau, em razão dessa condição;

        b) contra membro do Poder Judiciário, do Ministério Público, da Defensoria Pública ou da Advocacia Pública, de que tratam os arts. 131 e 132 da Constituição Federal, ou oficial de justiça, no exercício da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente, inclusive por afinidade, até o terceiro grau, em razão dessa condição; ou

        c) nas dependências de instituição de ensino;

        II - 2/3 (dois terços) ao dobro se a lesão dolosa for praticada nas dependências de instituição de ensino e:

        a) a vítima for pessoa com deficiência ou com doença que acarrete condição limitante ou de vulnerabilidade física ou mental; ou

        b) o autor for ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro, tutor, curador, preceptor ou empregador da vítima ou por qualquer outro título tiver autoridade sobre ela ou, ainda, for professor ou funcionário da instituição de ensino.

        § 13. Se a lesão é praticada contra a mulher, por razões da condição do sexo feminino, nos termos do § 1º do art. 121-A deste Código: Pena – reclusão, de 2 (dois) a 5 (cinco) anos.'
      Código Penal, art. 147-B: 'Art. 147-B. Causar dano emocional à mulher que a prejudique e perturbe seu pleno desenvolvimento ou que vise a degradar ou a controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, chantagem, ridicularização, limitação do direito de ir e vir ou qualquer outro meio que cause prejuízo à sua saúde psicológica e autodeterminação: Pena - reclusão, de 6 (seis) meses a 2 (dois) anos, e multa, se a conduta não constitui crime mais grave.

        Parágrafo único. A pena é aumentada de metade se o crime é cometido mediante uso de inteligência artificial ou de qualquer outro recurso tecnológico que altere imagem ou som da vítima.'
      Código Penal, art. 147-A: 'Art. 147-A. Perseguir alguém, reiteradamente e por qualquer meio, ameaçando-lhe a integridade física ou psicológica, restringindo-lhe a capacidade de locomoção ou, de qualquer forma, invadindo ou perturbando sua esfera de liberdade ou privacidade. Pena – reclusão, de 6 (seis) meses a 2 (dois) anos, e multa.

        § 1º A pena é aumentada de metade se o crime é cometido:

        I – contra criança, adolescente ou idoso;

        II – contra mulher por razões da condição de sexo feminino, nos termos do § 2º-A do art. 121 deste Código;

        III – mediante concurso de 2 (duas) ou mais pessoas ou com o emprego de arma.

        § 2º As penas deste artigo são aplicáveis sem prejuízo das correspondentes à violência.

        § 3º Somente se procede mediante representação.'
      Código Penal, art. 140: 'Art. 140 - Injuriar alguém, ofendendo-lhe a dignidade ou o decoro: Pena - detenção, de um a seis meses, ou multa.

        § 1º - O juiz pode deixar de aplicar a pena:

        I - quando o ofendido, de forma reprovável, provocou diretamente a injúria;

        II - no caso de retorsão imediata, que consista em outra injúria.

        § 2º - Se a injúria consiste em violência ou vias de fato, que, por sua natureza ou pelo meio empregado, se considerem aviltantes: Pena - detenção, de três meses a um ano, e multa, além da pena correspondente à violência.

        § 3º Se a injúria consiste na utilização de elementos referentes a religião ou à condição de pessoa idosa ou com deficiência: Pena - reclusão, de 1 (um) a 3 (três) anos, e multa.'
      Código Penal, art. 147: 'Art. 147 - Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de causar-lhe mal injusto e grave: Pena - detenção, de um a seis meses, ou multa.

        § 1º Se o crime é cometido contra a mulher por razões da condição do sexo feminino, nos termos do § 1º do art. 121-A deste Código, aplica-se a pena em dobro.

        § 2º Somente se procede mediante representação, exceto na hipótese prevista no § 1º deste artigo.'
    fora_da_base: []
  B03:
    pergunta: Uma amiga saiu de casa com os filhos pequenos porque o ex-marido era agressivo, e agora eles estão brigando na Justiça para decidir com quem as crianças vão ficar, já que os dois não concordam. Mesmo quando o pai pede para dividir a guarda, o juiz ainda é obrigado a dar a guarda compartilhada em um caso em que a mãe e as crianças podem sofrer agressões?
    resposta_esperada: Não. Pelo Código Civil, quando não há acordo entre a mãe e o pai quanto à guarda do filho, a guarda compartilhada deixa de ser aplicada se um dos genitores declarar ao magistrado que não deseja a guarda ou quando houver elementos que evidenciem a probabilidade de risco de violência doméstica ou familiar.
    pontos_obrigatorios:
    - A guarda compartilhada não é aplicada quando houver elementos que evidenciem a probabilidade de risco de violência doméstica ou familiar.
    resposta: 'Não. A lei não obriga o juiz a dar a guarda compartilhada nesse caso.


      Quando não há acordo entre a mãe e o pai, e os dois estão aptos a exercer o poder familiar, a regra é aplicar a guarda compartilhada. Mas há exceção: isso não ocorre quando houver elementos que evidenciem a probabilidade de risco de violência doméstica ou familiar (Código Civil, art. 1.584, § 2º).


      "Poder familiar" é o conjunto de direitos e deveres dos pais em relação aos filhos.


      Quem avalia os elementos e decide é o juiz. A lei prevê a exceção, mas não garante resultado.


      Se ela estiver em perigo agora, ligue 190.


      Isso é orientação e não substitui advogada ou defensora.'
    artigos:
      Código Civil, art. 1.584: 'Art. 1.584. A guarda, unilateral ou compartilhada, poderá ser:.

        I – requerida, por consenso, pelo pai e pela mãe, ou por qualquer deles, em ação autônoma de separação, de divórcio, de dissolução de união estável ou em medida cautelar;.

        II – decretada pelo juiz, em atenção a necessidades específicas do filho, ou em razão da distribuição de tempo necessário ao convívio deste com o pai e com a mãe.

        § 1º Na audiência de conciliação, o juiz informará ao pai e à mãe o significado da guarda compartilhada, a sua importância, a similitude de deveres e direitos atribuídos aos genitores e as sanções pelo descumprimento de suas cláusulas.

        § 2º Quando não houver acordo entre a mãe e o pai quanto à guarda do filho, encontrando-se ambos os genitores aptos a exercer o poder familiar, será aplicada a guarda compartilhada, salvo se um dos genitores declarar ao magistrado que não deseja a guarda da criança ou do adolescente ou quando houver elementos que evidenciem a probabilidade de risco de violência doméstica ou familiar.

        § 3º Para estabelecer as atribuições do pai e da mãe e os períodos de convivência sob guarda compartilhada, o juiz, de ofício ou a requerimento do Ministério Público, poderá basear-se em orientação técnico-profissional ou de equipe interdisciplinar, que deverá visar à divisão equilibrada do tempo com o pai e com a mãe.

        § 4º A alteração não autorizada ou o descumprimento imotivado de cláusula de guarda unilateral ou compartilhada poderá implicar a redução de prerrogativas atribuídas ao seu detentor.

        § 5º Se o juiz verificar que o filho não deve permanecer sob a guarda do pai ou da mãe, deferirá a guarda a pessoa que revele compatibilidade com a natureza da medida, considerados, de preferência, o grau de parentesco e as relações de afinidade e afetividade.

        § 6º Qualquer estabelecimento público ou privado é obrigado a prestar informações a qualquer dos genitores sobre os filhos destes, sob pena de multa de R$ 200,00 (duzentos reais) a R$ 500,00 (quinhentos reais) por dia pelo não atendimento da solicitação.'
    fora_da_base: []
  B04:
    pergunta: tenho direito a auxílio-aluguel se eu sair de casa com meus filhos?
    resposta_esperada: Sim. A Lei Maria da Penha prevê que o juiz pode conceder à ofendida auxílio-aluguel, com valor fixado em função de sua situação de vulnerabilidade social e econômica, por período não superior a 6 meses, além de assegurar o afastamento da ofendida do lar sem prejuízo dos direitos relativos a bens, guarda dos filhos e alimentos.
    pontos_obrigatorios:
    - O juiz pode conceder auxílio-aluguel em função da situação de vulnerabilidade social e econômica da ofendida.
    - O auxílio-aluguel tem prazo máximo de até 6 meses.
    resposta: Se você precisar sair de casa com seus filhos por causa de violência doméstica, o juiz pode autorizar o seu afastamento do lar sem prejuízo dos direitos relativos a bens, guarda dos filhos e alimentos (Lei 11.340/2006, art. 23, III). Além disso, o juiz pode conceder o auxílio-aluguel, com valor fixado de acordo com a sua situação de vulnerabilidade social e econômica, pelo prazo de até 24 meses (Lei 11.340/2006, art. 23, VI).
    artigos:
      Lei 11.340/2006, art. 23: 'Art. 23. Poderá o juiz, quando necessário, sem prejuízo de outras medidas:

        I - encaminhar a ofendida e seus dependentes a programa oficial ou comunitário de proteção ou de atendimento;

        II - determinar a recondução da ofendida e a de seus dependentes ao respectivo domicílio, após afastamento do agressor;

        III - determinar o afastamento da ofendida do lar, sem prejuízo dos direitos relativos a bens, guarda dos filhos e alimentos;

        IV - determinar a separação de corpos.

        V - determinar a matrícula dos dependentes da ofendida em instituição de educação básica mais próxima do seu domicílio, ou a transferência deles para essa instituição, independentemente da existência de vaga.

        VI – conceder à ofendida auxílio-aluguel, com valor fixado em função de sua situação de vulnerabilidade social e econômica, por período não superior a 6 (seis) meses.'
    fora_da_base: []
  B05:
    pergunta: Uma colega de trabalho terminou o namoro no ano passado, mas o ex-namorado passou meses mandando dezenas de mensagens por dia, criando contas falsas nas redes sociais para vigiar a rotina dela e ficando parado na porta do serviço dela. Ficar atrás de alguém desse jeito, sem dar sossego, é crime, e a pena fica maior por ter sido contra uma mulher nessa situação?
    resposta_esperada: Sim. Perseguir alguém reiteradamente e por qualquer meio, ameaçando sua integridade física ou psicológica, restringindo sua capacidade de locomoção ou invadindo e perturbando sua esfera de liberdade ou privacidade é crime previsto no Código Penal, com pena de reclusão de 6 meses a 2 anos e multa. A pena é aumentada de metade quando o crime é cometido contra mulher por razões da condição de sexo feminino.
    pontos_obrigatorios:
    - Perseguir alguém reiteradamente por qualquer meio, invadindo ou perturbando sua liberdade ou privacidade, é crime punido com reclusão de 6 meses a 2 anos e multa.
    - A pena é aumentada de metade quando o crime é cometido contra mulher por razões da condição de sexo feminino.
    resposta: 'Sim, a lei prevê crime nesses casos. E há aumento de pena quando o crime é cometido contra a mulher por razões da condição de sexo feminino.


      **Perseguição (stalking)**

      - É crime perseguir alguém, de forma reiterada, por qualquer meio, invadindo ou perturbando a liberdade ou a privacidade dela (Código Penal, art. 147-A, incluído pela Lei 14.132/2021).

      - "Reiterada" significa que se repete várias vezes, não é um fato isolado.

      - Pena: reclusão de 6 meses a 2 anos, e multa (Código Penal, art. 147-A).


      **Aumento de pena**

      - A pena aumenta em metade se o crime é cometido contra a mulher por razões da condição de sexo feminino (Código Penal, art. 147-A, § 1º, I).

      - Também aumenta se o crime é cometido com uso de arma ou contra criança, adolescente ou idoso (Código Penal, art. 147-A, § 1º).


      **Outros pontos que podem se aplicar**

      - Criar contas falsas para vigiar e mandar mensagens pode se encaixar também em outros crimes, conforme o caso concreto.

      - A Lei Maria da Penha se aplica à violência contra a mulher em razão da condição de sexo feminino, inclusive a violência psicológica (Lei 11.340/2006, art. 5º e art. 7º, II).

      - Violência psicológica é crime: causar dano emocional à mulher que prejudique e perturbe o pleno desenvolvimento dela ou que vise degradar ou controlar suas ações, comportamentos, crenças e decisões (Código Penal, art. 147-B).


      **Quem decide**

      - Quem apura é a polícia, e quem decide sobre processo e pena é o juiz. A lei prevê essas consequências; não há resultado garantido.


      **O que ela pode fazer**

      - Registrar boletim de ocorrência, guardando prints, mensagens e testemunhas.

      - Pedir medidas protetivas de urgência, como afastamento do agressor e proibição de contato (Lei 11.340/2006, arts. 18 a 22).

      - Procurar a Delegacia da Mulher ou a Defensoria Pública.


      Se ela estiver em perigo agora, deve ligar 190.


      Isso é orientação e não substitui advogada ou defensora.'
    artigos:
      Código Penal, art. 147-A: 'Art. 147-A. Perseguir alguém, reiteradamente e por qualquer meio, ameaçando-lhe a integridade física ou psicológica, restringindo-lhe a capacidade de locomoção ou, de qualquer forma, invadindo ou perturbando sua esfera de liberdade ou privacidade. Pena – reclusão, de 6 (seis) meses a 2 (dois) anos, e multa.

        § 1º A pena é aumentada de metade se o crime é cometido:

        I – contra criança, adolescente ou idoso;

        II – contra mulher por razões da condição de sexo feminino, nos termos do § 2º-A do art. 121 deste Código;

        III – mediante concurso de 2 (duas) ou mais pessoas ou com o emprego de arma.

        § 2º As penas deste artigo são aplicáveis sem prejuízo das correspondentes à violência.

        § 3º Somente se procede mediante representação.'
      Lei 11.340/2006, art. 5º: 'Art. 5º Para os efeitos desta Lei, configura violência doméstica e familiar contra a mulher qualquer ação ou omissão baseada no gênero que lhe cause morte, lesão, sofrimento físico, sexual ou psicológico e dano moral ou patrimonial:

        I - no âmbito da unidade doméstica, compreendida como o espaço de convívio permanente de pessoas, com ou sem vínculo familiar, inclusive as esporadicamente agregadas;

        II - no âmbito da família, compreendida como a comunidade formada por indivíduos que são ou se consideram aparentados, unidos por laços naturais, por afinidade ou por vontade expressa;

        III - em qualquer relação íntima de afeto, na qual o agressor conviva ou tenha convivido com a ofendida, independentemente de coabitação.

        Parágrafo único. As relações pessoais enunciadas neste artigo independem de orientação sexual.'
      Lei 11.340/2006, art. 7º: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

        I - a violência física, entendida como qualquer conduta que ofenda sua integridade ou saúde corporal;

        II - a violência psicológica, entendida como qualquer conduta que lhe cause dano emocional e diminuição da autoestima ou que lhe prejudique e perturbe o pleno desenvolvimento ou que vise degradar ou controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, vigilância constante, perseguição contumaz, insulto, chantagem, violação de sua intimidade, ridicularização, exploração e limitação do direito de ir e vir ou qualquer outro meio que lhe cause prejuízo à saúde psicológica e à autodeterminação;

        III - a violência sexual, entendida como qualquer conduta que a constranja a presenciar, a manter ou a participar de relação sexual não desejada, mediante intimidação, ameaça, coação ou uso da força; que a induza a comercializar ou a utilizar, de qualquer modo, a sua sexualidade, que a impeça de usar qualquer método contraceptivo ou que a force ao matrimônio, à gravidez, ao aborto ou à prostituição, mediante coação, chantagem, suborno ou manipulação; ou que limite ou anule o exercício de seus direitos sexuais e reprodutivos;

        IV - a violência patrimonial, entendida como qualquer conduta que configure retenção, subtração, destruição parcial ou total de seus objetos, instrumentos de trabalho, documentos pessoais, bens, valores e direitos ou recursos econômicos, incluindo os destinados a satisfazer suas necessidades;

        V - a violência moral, entendida como qualquer conduta que configure calúnia, difamação ou injúria.

        VI – a violência vicária, entendida como qualquer forma de violência praticada contra descendente, ascendente, dependente, enteado, parente, pessoa sob guarda ou responsabilidade direta da mulher ou pessoa de sua rede de apoio, com vistas a atingi-la.'
      Código Penal, art. 147-B: 'Art. 147-B. Causar dano emocional à mulher que a prejudique e perturbe seu pleno desenvolvimento ou que vise a degradar ou a controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, chantagem, ridicularização, limitação do direito de ir e vir ou qualquer outro meio que cause prejuízo à sua saúde psicológica e autodeterminação: Pena - reclusão, de 6 (seis) meses a 2 (dois) anos, e multa, se a conduta não constitui crime mais grave.

        Parágrafo único. A pena é aumentada de metade se o crime é cometido mediante uso de inteligência artificial ou de qualquer outro recurso tecnológico que altere imagem ou som da vítima.'
      Lei 11.340/2006, art. 18: 'Art. 18. Recebido o expediente com o pedido da ofendida, caberá ao juiz, no prazo de 48 (quarenta e oito) horas:

        I - conhecer do expediente e do pedido e decidir sobre as medidas protetivas de urgência;

        II - determinar o encaminhamento da ofendida ao órgão de assistência judiciária, quando for o caso, inclusive para o ajuizamento da ação de separação judicial, de divórcio, de anulação de casamento ou de dissolução de união estável perante o juízo competente;

        III - comunicar ao Ministério Público para que adote as providências cabíveis.

        IV - determinar a apreensão imediata de arma de fogo sob a posse do agressor.'
