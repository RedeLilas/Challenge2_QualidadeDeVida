  A11:
    pergunta: Uma prima usa cadeira de rodas por causa de uma deficiência física e, meses atrás, levou empurrões e socos do companheiro dentro de casa, ficando toda machucada. Qual é a pena para quem agride e machuca a companheira dentro de casa, e a pena aumenta quando a mulher agredida tem deficiência?
    resposta_esperada: A lesão corporal praticada contra cônjuge ou companheiro no âmbito das relações domésticas ou de coabitação, ou praticada contra a mulher por razões da condição do sexo feminino, tem pena de reclusão de 2 a 5 anos. Quando a lesão em contexto doméstico é cometida contra pessoa portadora de deficiência, a pena é aumentada de 1/3.
    pontos_obrigatorios:
    - A pena para a lesão corporal em contexto doméstico ou contra a mulher por razões da condição do sexo feminino é de reclusão de 2 a 5 anos.
    - A pena é aumentada de 1/3 quando o crime em contexto doméstico é cometido contra pessoa com deficiência.
    resposta: 'Não sei responder com segurança a essa pergunta com base apenas nos trechos enviados.


      Os trechos tratam da lesão corporal em contexto doméstico e do aumento de pena quando a vítima tem deficiência, mas há versões diferentes do mesmo dispositivo (Código Penal, art. 129, § 9º) com penas distintas, e não é possível definir com segurança qual se aplica ao caso. Além disso, os trechos não esclarecem se o aumento por deficiência vale para toda lesão doméstica ou só em hipóteses específicas.


      Para orientação sobre o caso concreto, procure uma advogada ou a Defensoria Pública. Se houver perigo agora, ligue 190.'
