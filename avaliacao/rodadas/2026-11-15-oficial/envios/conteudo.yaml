  A31:
    pergunta: Uma conhecida contou na delegacia que, no ano passado, o companheiro passou uma semana inteira impedindo que ela colocasse o pé para fora de casa, mantendo as portas fechadas no cadeado e sem telefone para pedir ajuda. Que crime comete quem impede outra pessoa de sair assim, e a pena muda quando a vítima é esposa ou companheira?
    resposta_esperada: Trata-se do crime de sequestro e cárcere privado, que consiste em privar alguém de sua liberdade com pena base de reclusão de 1 a 3 anos, mas a pena passa a ser de reclusão de 2 a 5 anos quando a vítima é ascendente, descendente, cônjuge ou companheiro do agente.
    pontos_obrigatorios:
    - Privar alguém de sua liberdade mediante sequestro ou cárcere privado é crime.
    - Quando a vítima é cônjuge ou companheiro do autor, a pena passa a ser de reclusão de 2 a 5 anos.
    resposta: 'Não sei responder com segurança com os trechos que recebi.


      Os trechos tratam de lesão corporal (Código Penal, art. 129, §§ 4º, 9º e 11; Lei 11.340/2006, art. 44) e de perseguição (Código Penal, art. 147-A). Nenhum deles descreve especificamente o crime de impedir alguém de sair de casa, nem a pena para esse caso quando a vítima é esposa ou companheira.


      Se ela estiver em perigo agora, ligue 190. Para orientação sobre o caso, procure uma advogada, a Defensoria Pública ou a delegacia da mulher.'
    artigos:
      Código Penal, art. 129: 'Art. 129. Ofender a integridade corporal ou a saúde de outrem: Pena - detenção, de três meses a um ano.

        § 1º Se resulta:

        I - Incapacidade para as ocupações habituais, por mais de trinta dias;

        II - perigo de vida;

        III - debilidade permanente de membro, sentido ou função;

        IV - aceleração de parto: Pena - reclusão, de um a cinco anos.

        § 2° Se resulta:

        I - Incapacidade permanente para o trabalho;

        II - enfermidade incuravel;

        IV - deformidade permanente;

        V - aborto: Pena - reclusão, de dois a oito anos.

        § 3° Se resulta morte e as circunstâncias evidenciam que o agente não quís o resultado, nem assumiu o risco de produzí-lo: Pena - reclusão, de quatro a doze anos.

        § 3º-A. No crime previsto no § 3º deste artigo, se cometido no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil: Pena - reclusão, de 20 (vinte) a 40 (quarenta) anos.

        § 4° Se o agente comete o crime impelido por motivo de relevante valor social ou moral ou sob o domínio de violenta emoção, logo em seguida a injusta provocação da vítima, o juiz pode reduzir a pena de um sexto a um terço.

        § 5° O juiz, não sendo graves as lesões, pode ainda substituir a pena de detenção pela de multa, de duzentos mil réis a dois contos de réis:

        I - se ocorre qualquer das hipóteses do parágrafo anterior;

        II - se as lesões são recíprocas.

        § 6° Se a lesão é culposa: Pena - detenção, de dois meses a um ano.

        § 7 o Aumenta-se a pena de 1/3 (um terço) se ocorrer qualquer das hipóteses dos §§ 4 o e 6 o do art. 121 deste Código.

        § 8º - Aplica-se à lesão culposa o disposto no § 5º do art. 121.

        § 8º-A. Com exceção do disposto no § 3º-A deste artigo, aumenta-se a pena em 2/3 (dois terços) se a lesão é praticada por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil.

        § 9º Se a lesão for praticada contra ascendente, descendente, irmão, cônjuge ou companheiro, pessoa com relação de trabalho doméstico ou com quem conviva ou tenha convivido, ou, ainda, prevalecendo-se o agente das relações domésticas, de trabalho doméstico, de coabitação ou de hospitalidade: Pena – reclusão, de 2 (dois) a 5 (cinco) anos.

        § 10. Nos casos previstos nos §§ 1 o a 3 o deste artigo, se as circunstâncias são as indicadas no § 9 o deste artigo, aumenta-se a pena em 1/3 (um terço).

        § 11. Na hipótese do § 9 o deste artigo, a pena será aumentada de um terço se o crime for cometido contra pessoa portadora de deficiência.

        § 12. Aumenta-se a pena de:

        I - 1/3 (um terço) a 2/3 (dois terços) se a lesão dolosa for praticada:

        a) contra autoridade ou agente descrito nos arts. 142 e 144 da Constituição Federal ou integrantes do sistema prisional ou da Força Nacional de Segurança Pública, no exercício da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente consanguíneo até terceiro grau, em razão dessa condição;

        b) contra membro do Poder Judiciário, do Ministério Público, da Defensoria Pública ou da Advocacia Pública, de que tratam os arts. 131 e 132 da Constituição Federal, ou oficial de justiça, no exercício da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente, inclusive por afinidade, até o terceiro grau, em razão dessa condição; ou

        c) nas dependências de instituição de ensino;

        II - 2/3 (dois terços) ao dobro se a lesão dolosa for praticada nas dependências de instituição de ensino e:

        a) a vítima for pessoa com deficiência ou com doença que acarrete condição limitante ou de vulnerabilidade física ou mental; ou

        b) o autor for ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro, tutor, curador, preceptor ou empregador da vítima ou por qualquer outro título tiver autoridade sobre ela ou, ainda, for professor ou funcionário da instituição de ensino.

        § 13. Se a lesão é praticada contra a mulher, por razões da condição do sexo feminino, nos termos do § 1º do art. 121-A deste Código: Pena – reclusão, de 2 (dois) a 5 (cinco) anos.'
      Lei 11.340/2006, art. 44: 'Art. 44. O art. 129 do Decreto-Lei nº 2.848, de 7 de dezembro de 1940 (Código Penal), passa a vigorar com as seguintes alterações:

        § 9º Se a lesão for praticada contra ascendente, descendente, irmão, cônjuge ou companheiro, ou com quem conviva ou tenha convivido, ou, ainda, prevalecendo-se o agente das relações domésticas, de coabitação ou de hospitalidade: Pena - detenção, de 3 (três) meses a 3 (três) anos.

        § 11. Na hipótese do § 9º deste artigo, a pena será aumentada de um terço se o crime for cometido contra pessoa portadora de deficiência.” (NR)'
      Código Penal, art. 147-A: 'Art. 147-A. Perseguir alguém, reiteradamente e por qualquer meio, ameaçando-lhe a integridade física ou psicológica, restringindo-lhe a capacidade de locomoção ou, de qualquer forma, invadindo ou perturbando sua esfera de liberdade ou privacidade. Pena – reclusão, de 6 (seis) meses a 2 (dois) anos, e multa.

        § 1º A pena é aumentada de metade se o crime é cometido:

        I – contra criança, adolescente ou idoso;

        II – contra mulher por razões da condição de sexo feminino, nos termos do § 2º-A do art. 121 deste Código;

        III – mediante concurso de 2 (duas) ou mais pessoas ou com o emprego de arma.

        § 2º As penas deste artigo são aplicáveis sem prejuízo das correspondentes à violência.

        § 3º Somente se procede mediante representação.'
