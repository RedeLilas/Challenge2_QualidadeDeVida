  B17:
    pergunta: O ex-companheiro de uma vizinha proibia que ela visitasse a própria família, vigiava todas as conversas do celular dela e dizia que ela não tinha capacidade de tomar decisões sozinha. Mesmo sem agressão física, esse controle e isolamento entram na Lei Maria da Penha?
    resposta_esperada: Sim. Essas condutas configuram violência psicológica prevista na Lei Maria da Penha, que abrange qualquer conduta que cause dano emocional, diminuição da autoestima ou que vise controlar ações, comportamentos e decisões da mulher mediante isolamento, vigilância constante, manipulação ou limitação do direito de ir e vir.
    pontos_obrigatorios:
    - Configura violência psicológica prevista na Lei 11.340/2006.
    - Abrange condutas de controle, isolamento, vigilância constante ou limitação do direito de ir e vir, mesmo sem agressão física.
    resposta: 'Sim, entram. A Lei Maria da Penha trata de violência psicológica e de violência moral, não só da física.


      O que você descreveu se encaixa em:


      - **Violência psicológica**: conduta que causa dano emocional, diminui a autoestima ou prejudica o desenvolvimento da mulher. Exemplos: humilhação, vigilância constante, isolamento, controle de decisões (Lei 11.340/2006, art. 7º, II).

      - **Violência moral**: conduta que ofende a honra, como calúnia, difamação e injúria (Lei 11.340/2006, art. 7º, V).

      - **Violência patrimonial**: quando há controle de bens, documentos ou recursos (Lei 11.340/2006, art. 7º, IV).


      "Violência psicológica" é o dano emocional causado por palavras ou atitudes de controle. "Isolamento" é impedir o contato da mulher com família e amigos.


      A lei prevê medidas protetivas de urgência, como afastamento do agressor e proibição de contato (Lei 11.340/2006, arts. 18 a 22). Quem decide se concede é o juiz.


      A vizinha pode procurar a Delegacia da Mulher ou a Defensoria Pública. Se houver perigo agora, ligue 190.


      Isso é orientação e não substitui advogada ou defensora.'
