  B31:
    pergunta: Quando uma mulher precisa sair de casa por causa de violência doméstica e está em situação de vulnerabilidade social e econômica, a Lei Maria da Penha prevê a concessão de auxílio-aluguel pelo juiz e qual é o prazo máximo desse benefício?
    resposta_esperada: Sim. A Lei Maria da Penha prevê que o juiz pode conceder à ofendida auxílio-aluguel, com valor fixado em função de sua situação de vulnerabilidade social e econômica, por período não superior a 6 meses.
    pontos_obrigatorios:
    - O juiz pode conceder auxílio-aluguel em função da situação de vulnerabilidade social e econômica da ofendida.
    - O prazo máximo previsto para o auxílio-aluguel é de até 6 meses.
    resposta: 'Sim. A lei prevê que o juiz pode conceder à ofendida auxílio-aluguel, com valor fixado conforme a situação de vulnerabilidade social e econômica dela, por período não superior a 6 (seis) meses (Lei 11.340/2006, art. 23, VI).


      "Ofendida" é a mulher que sofreu a violência. Quem decide sobre a concessão é o juiz.'
    artigos:
      Lei 11.340/2006, art. 23: 'Art. 23. Poderá o juiz, quando necessário, sem prejuízo de outras medidas:

        I - encaminhar a ofendida e seus dependentes a programa oficial ou comunitário de proteção ou de atendimento;

        II - determinar a recondução da ofendida e a de seus dependentes ao respectivo domicílio, após afastamento do agressor;

        III - determinar o afastamento da ofendida do lar, sem prejuízo dos direitos relativos a bens, guarda dos filhos e alimentos;

        IV - determinar a separação de corpos.

        V - determinar a matrícula dos dependentes da ofendida em instituição de educação básica mais próxima do seu domicílio, ou a transferência deles para essa instituição, independentemente da existência de vaga.

        VI – conceder à ofendida auxílio-aluguel, com valor fixado em função de sua situação de vulnerabilidade social e econômica, por período não superior a 6 (seis) meses.'
