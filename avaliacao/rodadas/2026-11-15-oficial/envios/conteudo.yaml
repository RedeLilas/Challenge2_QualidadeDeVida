  A14:
    pergunta: Uma colega de trabalho terminou o namoro no ano passado, mas o ex-namorado passou meses mandando dezenas de mensagens por dia, criando contas falsas nas redes sociais para vigiar a rotina dela e ficando parado na porta do serviço dela. Ficar atrás de alguém desse jeito, sem dar sossego, é crime, e a pena fica maior por ter sido contra uma mulher nessa situação?
    resposta_esperada: Sim. Perseguir alguém reiteradamente e por qualquer meio, ameaçando sua integridade física ou psicológica, restringindo sua capacidade de locomoção ou invadindo e perturbando sua esfera de liberdade ou privacidade é crime previsto no Código Penal, com pena de reclusão de 6 meses a 2 anos e multa. A pena é aumentada de metade quando o crime é cometido contra mulher por razões da condição de sexo feminino.
    pontos_obrigatorios:
    - Perseguir alguém reiteradamente por qualquer meio, invadindo ou perturbando sua liberdade ou privacidade, é crime punido com reclusão de 6 meses a 2 anos e multa.
    - A pena é aumentada de metade quando o crime é cometido contra mulher por razões da condição de sexo feminino.
    resposta: 'Sim. A lei prevê crime para quem persegue alguém de forma repetida, por qualquer meio, ameaçando a integridade física ou psicológica, restringindo a locomoção ou invadindo ou perturbando a liberdade ou privacidade (Código Penal, art. 147-A).


      A pena é de reclusão de 6 meses a 2 anos, e multa (Código Penal, art. 147-A).


      A pena é aumentada de metade se o crime é cometido contra mulher por razões da condição de sexo feminino (Código Penal, art. 147-A, § 1º, II).


      A lei também prevê que só se procede mediante representação (Código Penal, art. 147-A, § 3º). "Representação" é a manifestação da vontade da vítima para que o caso seja investigado e processado.


      Quem decide sobre o processo e a pena é o juiz. A orientação não substitui advogada ou defensora.


      Se ela estiver em perigo agora, deve ligar 190.'
    artigos:
      Código Penal, art. 147-A: 'Art. 147-A. Perseguir alguém, reiteradamente e por qualquer meio, ameaçando-lhe a integridade física ou psicológica, restringindo-lhe a capacidade de locomoção ou, de qualquer forma, invadindo ou perturbando sua esfera de liberdade ou privacidade. Pena – reclusão, de 6 (seis) meses a 2 (dois) anos, e multa.

        § 1º A pena é aumentada de metade se o crime é cometido:

        I – contra criança, adolescente ou idoso;

        II – contra mulher por razões da condição de sexo feminino, nos termos do § 2º-A do art. 121 deste Código;

        III – mediante concurso de 2 (duas) ou mais pessoas ou com o emprego de arma.

        § 2º As penas deste artigo são aplicáveis sem prejuízo das correspondentes à violência.

        § 3º Somente se procede mediante representação.'
