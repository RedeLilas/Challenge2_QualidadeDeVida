  B11:
    pergunta: o que acontece se ele descumprir a medida protetiva?
    resposta_esperada: Descumprir decisão judicial que defere medidas protetivas de urgência previstas na Lei Maria da Penha é crime punido com pena de reclusão de 2 a 5 anos e multa, independentemente da competência civil ou criminal do juiz que deferiu as medidas. Em caso de prisão em flagrante, apenas a autoridade judicial pode conceder fiança.
    pontos_obrigatorios:
    - Descumprir decisão judicial que concede medida protetiva de urgência é crime punido com reclusão de 2 a 5 anos e multa.
    - Em caso de prisão em flagrante por esse crime, apenas o juiz pode conceder fiança.
    resposta: Descumprir decisão judicial que concede medida protetiva de urgência é crime punido com reclusão de 2 a 5 anos e multa, mas o crime só se configura quando a medida foi determinada por um juiz criminal, não valendo para decisões de juiz cível (Lei 11.340/2006, art. 24-A, § 1º). Caso o agressor seja preso em flagrante, o próprio delegado de polícia pode conceder fiança na delegacia para que ele responda em liberdade, sem precisar de decisão do juiz (Lei 11.340/2006, art. 24-A, § 2º).
    artigos:
      Lei 11.340/2006, art. 24-A: 'Art. 24-A. Descumprir decisão judicial que defere medidas protetivas de urgência previstas nesta Lei: Pena – reclusão, de 2 (dois) a 5 (cinco) anos, e multa.

        § 1º A configuração do crime independe da competência civil ou criminal do juiz que deferiu as medidas.

        § 2º Na hipótese de prisão em flagrante, apenas a autoridade judicial poderá conceder fiança.

        § 3º O disposto neste artigo não exclui a aplicação de outras sanções cabíveis.

        § 4º A pena será aumentada de 1/3 (um terço) até a metade se o descumprimento decorrer da violação das áreas de exclusão monitoradas eletronicamente ou da remoção, violação ou alteração do dispositivo de monitoração sem autorização judicial.'
    fora_da_base: []
  B12:
    pergunta: Uma mulher que sofreu violência doméstica quer entrar com pedido de divórcio ou dissolução de união estável no próprio Juizado de Violência Doméstica e Familiar contra a Mulher. Ela pode fazer isso lá, inclusive para resolver a partilha dos bens do casal?
    resposta_esperada: A ofendida tem a opção de propor a ação de divórcio ou de dissolução de união estável no próprio Juizado de Violência Doméstica e Familiar contra a Mulher, mas a pretensão relacionada à partilha de bens é excluída da competência desse Juizado.
    pontos_obrigatorios:
    - A ofendida pode optar por propor a ação de divórcio ou dissolução de união estável no Juizado de Violência Doméstica e Familiar contra a Mulher.
    - A partilha de bens fica excluída da competência do Juizado de Violência Doméstica.
    resposta: 'Sobre o divórcio ou a dissolução da união estável: sim, a lei prevê essa opção. A ofendida pode propor a ação no Juizado de Violência Doméstica e Familiar contra a Mulher (Lei 11.340/2006, art. 14-A).


      Sobre a partilha de bens: não. A partilha fica fora da competência desses Juizados (Lei 11.340/2006, art. 14-A, § 1º). "Partilha de bens" é a divisão dos bens do casal.


      Quem decide o caso é o juiz. A lei prevê a possibilidade; não há resultado garantido.


      Se houver violência depois de a ação de divórcio já ter sido iniciada, essa ação tem preferência no juízo onde estiver (Lei 11.340/2006, art. 14-A, § 2º).


      Isso é orientação e não substitui advogada ou defensora. Se você estiver em perigo agora, ligue 190.'
    artigos:
      Lei 11.340/2006, art. 14-A: 'Art. 14-A. A ofendida tem a opção de propor ação de divórcio ou de dissolução de união estável no Juizado de Violência Doméstica e Familiar contra a Mulher.

        § 1º Exclui-se da competência dos Juizados de Violência Doméstica e Familiar contra a Mulher a pretensão relacionada à partilha de bens.

        § 2º Iniciada a situação de violência doméstica e familiar após o ajuizamento da ação de divórcio ou de dissolução de união estável, a ação terá preferência no juízo onde estiver.'
    fora_da_base: []
  B13:
    pergunta: Uma conhecida contou na delegacia que, no ano passado, o companheiro passou uma semana inteira impedindo que ela colocasse o pé para fora de casa, mantendo as portas fechadas no cadeado e sem telefone para pedir ajuda. Que crime comete quem impede outra pessoa de sair assim, e a pena muda quando a vítima é esposa ou companheira?
    resposta_esperada: Trata-se do crime de sequestro e cárcere privado, que consiste em privar alguém de sua liberdade com pena base de reclusão de 1 a 3 anos, mas a pena passa a ser de reclusão de 2 a 5 anos quando a vítima é ascendente, descendente, cônjuge ou companheiro do agente.
    pontos_obrigatorios:
    - Privar alguém de sua liberdade mediante sequestro ou cárcere privado é crime.
    - Quando a vítima é cônjuge ou companheiro do autor, a pena passa a ser de reclusão de 2 a 5 anos.
    resposta: 'Isso é cárcere privado. É manter alguém preso ou impedido de ir e vir, mesmo dentro de casa (Código Penal, art. 148).


      A lei prevê pena de reclusão de 1 a 3 anos para o cárcere privado (Código Penal, art. 148, caput).


      A pena aumenta, e o juiz pode aplicar de 2 a 5 anos, quando o crime é cometido contra cônjuge, companheiro ou pessoa com quem se convive (Código Penal, art. 148, § 1º, inciso I).


      Se a vítima é mulher e o crime é por razões da condição de sexo feminino, também pode se enquadrar na Lei Maria da Penha. A lei lista a violência patrimonial e a violência moral, e trata a violência física e psicológica como formas de violência doméstica (Lei 11.340/2006, art. 7º). O cárcere privado é violência física e psicológica.


      Quem decide se houve crime, qual artigo se aplica e qual pena é o juiz, depois de ouvir o Ministério Público e a defesa. A delegacia registra o fato; não define a pena.


      Se ela ainda estiver em perigo agora, ligue 190. Para orientação e medidas de proteção, procure a Delegacia da Mulher ou a Defensoria Pública. Isso não substitui advogada ou defensora.'
    artigos:
      Código Penal, art. 148: 'Art. 148 - Privar alguém de sua liberdade, mediante seqüestro ou cárcere privado: Pena - reclusão, de um a três anos.

        § 1º - A pena é de reclusão, de dois a cinco anos:

        I – se a vítima é ascendente, descendente, cônjuge ou companheiro do agente ou maior de 60 (sessenta) anos;

        II - se o crime é praticado mediante internação da vítima em casa de saúde ou hospital;

        III - se a privação da liberdade dura mais de quinze dias.

        IV – se o crime é praticado contra menor de 18 (dezoito) anos;

        V – se o crime é praticado com fins libidinosos.

        § 2º - Se resulta à vítima, em razão de maus-tratos ou da natureza da detenção, grave sofrimento físico ou moral: Pena - reclusão, de dois a oito anos.

        § 3º Se cometido por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil: Pena - reclusão, de 12 (doze) a 20 (vinte) anos.'
      Lei 11.340/2006, art. 7º: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

        I - a violência física, entendida como qualquer conduta que ofenda sua integridade ou saúde corporal;

        II - a violência psicológica, entendida como qualquer conduta que lhe cause dano emocional e diminuição da autoestima ou que lhe prejudique e perturbe o pleno desenvolvimento ou que vise degradar ou controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, vigilância constante, perseguição contumaz, insulto, chantagem, violação de sua intimidade, ridicularização, exploração e limitação do direito de ir e vir ou qualquer outro meio que lhe cause prejuízo à saúde psicológica e à autodeterminação;

        III - a violência sexual, entendida como qualquer conduta que a constranja a presenciar, a manter ou a participar de relação sexual não desejada, mediante intimidação, ameaça, coação ou uso da força; que a induza a comercializar ou a utilizar, de qualquer modo, a sua sexualidade, que a impeça de usar qualquer método contraceptivo ou que a force ao matrimônio, à gravidez, ao aborto ou à prostituição, mediante coação, chantagem, suborno ou manipulação; ou que limite ou anule o exercício de seus direitos sexuais e reprodutivos;

        IV - a violência patrimonial, entendida como qualquer conduta que configure retenção, subtração, destruição parcial ou total de seus objetos, instrumentos de trabalho, documentos pessoais, bens, valores e direitos ou recursos econômicos, incluindo os destinados a satisfazer suas necessidades;

        V - a violência moral, entendida como qualquer conduta que configure calúnia, difamação ou injúria.

        VI – a violência vicária, entendida como qualquer forma de violência praticada contra descendente, ascendente, dependente, enteado, parente, pessoa sob guarda ou responsabilidade direta da mulher ou pessoa de sua rede de apoio, com vistas a atingi-la.'
    fora_da_base: []
  B14:
    pergunta: Se uma mulher casada assinou no passado uma procuração em nome do marido e receia que ele venda bens do casal ou fique com objetos que ele retirou dela, que medidas protetivas patrimoniais o juiz pode determinar liminarmente?
    resposta_esperada: Para a proteção patrimonial dos bens da sociedade conjugal ou de propriedade particular da mulher, o juiz pode determinar liminarmente a restituição de bens indevidamente subtraídos pelo agressor, a proibição temporária para celebrar atos e contratos de compra, venda e locação de propriedade em comum (salvo expressa autorização judicial), a suspensão das procurações conferidas pela ofendida ao agressor e a prestação de caução provisória por perdas e danos materiais, oficiando ao cartório competente.
    pontos_obrigatorios:
    - Restituição de bens indevidamente subtraídos e proibição temporária de compra, venda e locação de propriedade em comum sem autorização judicial.
    - Suspensão das procurações conferidas pela ofendida ao agressor.
    resposta: 'Não sei responder com segurança se a procuração antiga permite esse tipo de pedido. Mas posso explicar o que a lei prevê sobre medidas patrimoniais.


      Primeiro, dois termos simples:

      - Medida protetiva: decisão urgente do juiz para proteger a mulher.

      - Liminar: decisão dada logo no início do processo, antes de ouvir a outra parte.


      O que a lei prevê (Lei 11.340/2006, art. 22):

      - O juiz pode conceder, de imediato, medidas protetivas de urgência.

      - Entre elas, pode proibir o agressor de vender, alugar ou transferir bens do casal (art. 22, inciso IV).

      - Também pode determinar a separação de corpos (art. 22, inciso II) e o afastamento do agressor do lar (art. 22, inciso II).

      - Pode ainda fixar alimentos provisórios, se houver dependência econômica (art. 22, inciso V).


      Sobre bens e objetos:

      - A lei prevê que o juiz pode proibir a transferência de bens do casal (art. 22, IV).

      - Sobre objetos pessoais retirados, a lei não traz medida específica. O juiz pode analisar caso a caso.

      - Quem decide é o juiz, ao receber o pedido.


      Sobre a procuração:

      - A lei não trata de revogação de procuração como medida protetiva.

      - Não sei responder com segurança se o juiz pode suspender essa procuração nesse pedido.


      O que fazer:

      - Você pode pedir as medidas protetivas na delegacia ou no Ministério Público (Lei 11.340/2006, art. 18 e art. 19).

      - O juiz decide em até 48 horas sobre o pedido de urgência (Lei 11.340/2006, art. 18).

      - Procure uma advogada ou a Defensoria Pública para tratar da procuração e dos bens.


      Se você estiver em perigo agora, ligue 190.'
    artigos:
      Lei 11.340/2006, art. 22: 'Art. 22. Constatada a prática de violência doméstica e familiar contra a mulher, nos termos desta Lei, o juiz poderá aplicar, de imediato, ao agressor, em conjunto ou separadamente, as seguintes medidas protetivas de urgência, entre outras:

        I - suspensão da posse ou restrição do porte de armas, com comunicação ao órgão competente, nos termos da Lei nº 10.826, de 22 de dezembro de 2003;

        II - afastamento do lar, domicílio ou local de convivência com a ofendida;

        III - proibição de determinadas condutas, entre as quais:

        a) aproximação da ofendida, de seus familiares e das testemunhas, fixando o limite mínimo de distância entre estes e o agressor;

        b) contato com a ofendida, seus familiares e testemunhas por qualquer meio de comunicação;

        c) freqüentação de determinados lugares a fim de preservar a integridade física e psicológica da ofendida;

        IV - restrição ou suspensão de visitas aos dependentes menores, ouvida a equipe de atendimento multidisciplinar ou serviço similar;

        V - prestação de alimentos provisionais ou provisórios.

        VI – comparecimento do agressor a programas de recuperação e reeducação; e

        VII – acompanhamento psicossocial do agressor, por meio de atendimento individual e/ou em grupo de apoio.

        VIII – monitoração eletrônica, disponibilizando-se à vítima aplicação ou dispositivo de segurança que alerte sobre eventual aproximação do agressor.

        § 1º As medidas referidas neste artigo não impedem a aplicação de outras previstas na legislação em vigor, sempre que a segurança da ofendida ou as circunstâncias o exigirem, devendo a providência ser comunicada ao Ministério Público.

        § 2º Na hipótese de aplicação do inciso I, encontrando-se o agressor nas condições mencionadas no caput e incisos do art. 6º da Lei nº 10.826, de 22 de dezembro de 2003, o juiz comunicará ao respectivo órgão, corporação ou instituição as medidas protetivas de urgência concedidas e determinará a restrição do porte de armas, ficando o superior imediato do agressor responsável pelo cumprimento da determinação judicial, sob pena de incorrer nos crimes de prevaricação ou de desobediência, conforme o caso.

        § 3º Para garantir a efetividade das medidas protetivas de urgência, poderá o juiz requisitar, a qualquer momento, auxílio da força policial.

        § 4º Na aplicação das medidas protetivas de urgência, o juiz concederá a tutela específica ou determinará providências que assegurem a obtenção de tutela pelo resultado prático equivalente.

        § 5º.

        § 6º A aplicação da medida prevista no inciso VIII do caput deste artigo terá prioridade nos casos em que houver descumprimento de medidas protetivas anteriormente impostas ou quando for verificado risco iminente à integridade física ou psicológica da vítima.

        § 7º Para a efetivação da medida prevista no inciso VIII do caput deste artigo, a autoridade competente promoverá a instalação do equipamento e instruirá o agressor sobre o seu funcionamento e as áreas de exclusão onde não poderá circular, conforme definido na decisão da autoridade judicial, devendo a ciência constar de termo nos autos.

        § 8º O sistema de monitoração eletrônica de que trata o inciso VIII do caput deste artigo deverá emitir alerta automático e simultâneo à vítima e à unidade policial mais próxima sempre que o agressor romper o perímetro de exclusão fixado judicialmente.

        § 9º Nos casos previstos no § 6º deste artigo, a decisão judicial que deixar de aplicar a medida protetiva de monitoração eletrônica deverá apresentar fundamentação expressa quanto às razões da não aplicação da medida.

        § 10 As medidas protetivas de natureza cível, inclusive as de prestação de alimentos provisionais ou provisórios, constituem título executivo judicial de pleno direito, dispensando a propositura de ação principal.'
      Lei 11.340/2006, art. 18: 'Art. 18. Recebido o expediente com o pedido da ofendida, caberá ao juiz, no prazo de 48 (quarenta e oito) horas:

        I - conhecer do expediente e do pedido e decidir sobre as medidas protetivas de urgência;

        II - determinar o encaminhamento da ofendida ao órgão de assistência judiciária, quando for o caso, inclusive para o ajuizamento da ação de separação judicial, de divórcio, de anulação de casamento ou de dissolução de união estável perante o juízo competente;

        III - comunicar ao Ministério Público para que adote as providências cabíveis.

        IV - determinar a apreensão imediata de arma de fogo sob a posse do agressor.'
      Lei 11.340/2006, art. 19: 'Art. 19. As medidas protetivas de urgência poderão ser concedidas pelo juiz, a requerimento do Ministério Público ou a pedido da ofendida.

        § 1º As medidas protetivas de urgência poderão ser concedidas de imediato, independentemente de audiência das partes e de manifestação do Ministério Público, devendo este ser prontamente comunicado.

        § 2º As medidas protetivas de urgência serão aplicadas isolada ou cumulativamente, e poderão ser substituídas a qualquer tempo por outras de maior eficácia, sempre que os direitos reconhecidos nesta Lei forem ameaçados ou violados.

        § 3º Poderá o juiz, a requerimento do Ministério Público ou a pedido da ofendida, conceder novas medidas protetivas de urgência ou rever aquelas já concedidas, se entender necessário à proteção da ofendida, de seus familiares e de seu patrimônio, ouvido o Ministério Público.

        § 4º As medidas protetivas de urgência serão concedidas em juízo de cognição sumária a partir do depoimento da ofendida perante a autoridade policial ou da apresentação de suas alegações escritas e poderão ser indeferidas no caso de avaliação pela autoridade de inexistência de risco à integridade física, psicológica, sexual, patrimonial ou moral da ofendida ou de seus dependentes.

        § 5º As medidas protetivas de urgência serão concedidas independentemente da tipificação penal da violência, do ajuizamento de ação penal ou cível, da existência de inquérito policial ou do registro de boletim de ocorrência.

        § 6º As medidas protetivas de urgência vigorarão enquanto persistir risco à integridade física, psicológica, sexual, patrimonial ou moral da ofendida ou de seus dependentes.'
    fora_da_base:
    - art. 22 (norma não identificada)
  B15:
    pergunta: O ex-companheiro de uma vizinha vivia humilhando, manipulando e fazendo chantagem para controlar a roupa que ela vestia, com quem ela conversava e tudo o que ela decidia fazer, deixando a saúde mental dela muito abalada, e ainda fez montagens com inteligência artificial mudando a voz e o rosto dela. Essa atitude é crime, e ter usado inteligência artificial muda a pena?
    resposta_esperada: Sim. Causar dano emocional à mulher que a prejudique e perturbe seu pleno desenvolvimento ou que vise degradar ou controlar suas ações, comportamentos, crenças e decisões — mediante ameaça, constrangimento, humilhação, manipulação, isolamento, chantagem, ridicularização ou limitação do direito de ir e vir — é crime punido com reclusão de 6 meses a 2 anos e multa, se a conduta não constitui crime mais grave. A pena é aumentada de metade se o crime é cometido mediante uso de inteligência artificial ou de qualquer outro recurso tecnológico que altere imagem ou som da vítima.
    pontos_obrigatorios:
    - Causar dano emocional à mulher para degradar ou controlar suas ações, comportamentos e decisões é crime punido com reclusão de 6 meses a 2 anos e multa, se não constituir crime mais grave.
    - A pena é aumentada de metade quando há uso de inteligência artificial ou outro recurso tecnológico que altere imagem ou som da vítima.
    resposta: 'Sim, pode ser crime. E o uso de inteligência artificial pode agravar a situação.


      **1. Violência psicológica é crime.**

      Humilhar, manipular e chantagear para controlar a roupa, as conversas e as decisões dela é violência psicológica. A lei define violência psicológica como qualquer conduta que cause dano emocional, diminua a autoestima ou prejudique o desenvolvimento da mulher (Lei 11.340/2006, art. 7º, II). Isso também é crime específico, com pena de reclusão de 6 meses a 2 anos e multa (Código Penal, art. 147-B).


      **2. Chantagem e controle também entram.**

      Constranger alguém, com violência ou ameaça, a fazer ou não fazer algo é constrangimento ilegal (Código Penal, art. 146). Ameaçar para obter vantagem ou impor comportamento é crime (Código Penal, art. 147). O conjunto pode configurar violência patrimonial, sexual ou moral, conforme o caso (Lei 11.340/2006, art. 7º).


      **3. Montagens com IA mudando voz e rosto.**

      Criar ou divulgar conteúdo falso com a imagem ou a voz dela pode ser:

      - **Crime de perseguição (stalking)**, se houver repetição e invasão da vida dela (Código Penal, art. 147-A).

      - **Crime de divulgação de conteúdo íntimo falso**, quando o material é usado para humilhar ou expor (Código Penal, art. 218-C, que trata de conteúdo sexual; se não for sexual, pode ser difamação ou injúria — Código Penal, arts. 139 e 140).

      - **Violência psicológica e moral**, dentro da Lei Maria da Penha (Lei 11.340/2006, art. 7º, II e V).


      **4. A IA muda a pena?**

      A lei brasileira ainda não tem um artigo específico só para "deepfake" (vídeo ou áudio falso feito com IA). Mas o uso de IA pode ser considerado **agravante** ou **circunstância que aumenta a pena**, porque mostra meio cruel, dissimulado ou que dificulta a defesa da vítima (Código Penal, art. 61, II, "c" e "d"). O juiz analisa caso a caso. Não há garantia de pena maior: quem decide é o juiz.


      **5. O que a vizinha pode fazer.**

      - Registrar boletim de ocorrência, guardando prints, áudios e as montagens.

      - Pedir medida protetiva de urgência, que o juiz pode conceder para afastar o agressor e proibir contato (Lei 11.340/2006, arts. 18 a 22).

      - Procurar a Defensoria Pública ou uma advogada. A orientação aqui não substitui esse acompanhamento.


      **Se houver perigo agora, ligue 190.**'
    artigos:
      Lei 11.340/2006, art. 7º: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

        I - a violência física, entendida como qualquer conduta que ofenda sua integridade ou saúde corporal;

        II - a violência psicológica, entendida como qualquer conduta que lhe cause dano emocional e diminuição da autoestima ou que lhe prejudique e perturbe o pleno desenvolvimento ou que vise degradar ou controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, vigilância constante, perseguição contumaz, insulto, chantagem, violação de sua intimidade, ridicularização, exploração e limitação do direito de ir e vir ou qualquer outro meio que lhe cause prejuízo à saúde psicológica e à autodeterminação;

        III - a violência sexual, entendida como qualquer conduta que a constranja a presenciar, a manter ou a participar de relação sexual não desejada, mediante intimidação, ameaça, coação ou uso da força; que a induza a comercializar ou a utilizar, de qualquer modo, a sua sexualidade, que a impeça de usar qualquer método contraceptivo ou que a force ao matrimônio, à gravidez, ao aborto ou à prostituição, mediante coação, chantagem, suborno ou manipulação; ou que limite ou anule o exercício de seus direitos sexuais e reprodutivos;

        IV - a violência patrimonial, entendida como qualquer conduta que configure retenção, subtração, destruição parcial ou total de seus objetos, instrumentos de trabalho, documentos pessoais, bens, valores e direitos ou recursos econômicos, incluindo os destinados a satisfazer suas necessidades;

        V - a violência moral, entendida como qualquer conduta que configure calúnia, difamação ou injúria.

        VI – a violência vicária, entendida como qualquer forma de violência praticada contra descendente, ascendente, dependente, enteado, parente, pessoa sob guarda ou responsabilidade direta da mulher ou pessoa de sua rede de apoio, com vistas a atingi-la.'
      Código Penal, art. 147-B: 'Art. 147-B. Causar dano emocional à mulher que a prejudique e perturbe seu pleno desenvolvimento ou que vise a degradar ou a controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, chantagem, ridicularização, limitação do direito de ir e vir ou qualquer outro meio que cause prejuízo à sua saúde psicológica e autodeterminação: Pena - reclusão, de 6 (seis) meses a 2 (dois) anos, e multa, se a conduta não constitui crime mais grave.

        Parágrafo único. A pena é aumentada de metade se o crime é cometido mediante uso de inteligência artificial ou de qualquer outro recurso tecnológico que altere imagem ou som da vítima.'
      Código Penal, art. 147: 'Art. 147 - Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de causar-lhe mal injusto e grave: Pena - detenção, de um a seis meses, ou multa.

        § 1º Se o crime é cometido contra a mulher por razões da condição do sexo feminino, nos termos do § 1º do art. 121-A deste Código, aplica-se a pena em dobro.

        § 2º Somente se procede mediante representação, exceto na hipótese prevista no § 1º deste artigo.'
      Código Penal, art. 147-A: 'Art. 147-A. Perseguir alguém, reiteradamente e por qualquer meio, ameaçando-lhe a integridade física ou psicológica, restringindo-lhe a capacidade de locomoção ou, de qualquer forma, invadindo ou perturbando sua esfera de liberdade ou privacidade. Pena – reclusão, de 6 (seis) meses a 2 (dois) anos, e multa.

        § 1º A pena é aumentada de metade se o crime é cometido:

        I – contra criança, adolescente ou idoso;

        II – contra mulher por razões da condição de sexo feminino, nos termos do § 2º-A do art. 121 deste Código;

        III – mediante concurso de 2 (duas) ou mais pessoas ou com o emprego de arma.

        § 2º As penas deste artigo são aplicáveis sem prejuízo das correspondentes à violência.

        § 3º Somente se procede mediante representação.'
      Código Penal, art. 218-C: 'Art. 218-C. Oferecer, trocar, disponibilizar, transmitir, vender ou expor à venda, distribuir, publicar ou divulgar, por qualquer meio - inclusive por meio de comunicação de massa ou sistema de informática ou telemática -, fotografia, vídeo ou outro registro audiovisual que contenha cena de estupro ou de estupro de vulnerável ou que faça apologia ou induza a sua prática, ou, sem o consentimento da vítima, cena de sexo, nudez ou pornografia: Pena – reclusão, de 4 (quatro) a 10 (dez) anos, e multa, se o fato não constitui crime mais grave.

        § 1º A pena é aumentada de 1/3 (um terço) a 2/3 (dois terços) se o crime é praticado por agente que mantém ou tenha mantido relação íntima de afeto com a vítima ou com o fim de vingança ou humilhação.

        § 2º Não há crime quando o agente pratica as condutas descritas no caput deste artigo em publicação de natureza jornalística, científica, cultural ou acadêmica com a adoção de recurso que impossibilite a identificação da vítima, ressalvada sua prévia autorização, caso seja maior de 18 (dezoito) anos.'
      Código Penal, art. 139: 'Art. 139 - Difamar alguém, imputando-lhe fato ofensivo à sua reputação: Pena - detenção, de três meses a um ano, e multa.

        Parágrafo único - A exceção da verdade somente se admite se o ofendido é funcionário público e a ofensa é relativa ao exercício de suas funções.'
      Código Penal, art. 140: 'Art. 140 - Injuriar alguém, ofendendo-lhe a dignidade ou o decoro: Pena - detenção, de um a seis meses, ou multa.

        § 1º - O juiz pode deixar de aplicar a pena:

        I - quando o ofendido, de forma reprovável, provocou diretamente a injúria;

        II - no caso de retorsão imediata, que consista em outra injúria.

        § 2º - Se a injúria consiste em violência ou vias de fato, que, por sua natureza ou pelo meio empregado, se considerem aviltantes: Pena - detenção, de três meses a um ano, e multa, além da pena correspondente à violência.

        § 3º Se a injúria consiste na utilização de elementos referentes a religião ou à condição de pessoa idosa ou com deficiência: Pena - reclusão, de 1 (um) a 3 (três) anos, e multa.'
      Lei 11.340/2006, art. 18: 'Art. 18. Recebido o expediente com o pedido da ofendida, caberá ao juiz, no prazo de 48 (quarenta e oito) horas:

        I - conhecer do expediente e do pedido e decidir sobre as medidas protetivas de urgência;

        II - determinar o encaminhamento da ofendida ao órgão de assistência judiciária, quando for o caso, inclusive para o ajuizamento da ação de separação judicial, de divórcio, de anulação de casamento ou de dissolução de união estável perante o juízo competente;

        III - comunicar ao Ministério Público para que adote as providências cabíveis.

        IV - determinar a apreensão imediata de arma de fogo sob a posse do agressor.'
    fora_da_base:
    - Código Penal, art. 146
    - Código Penal, art. 61
  B16:
    pergunta: Uma mulher precisa necessariamente ter um inquérito policial aberto ou um processo criminal em andamento para conseguir uma medida protetiva de urgência, e por quanto tempo essa medida continua valendo?
    resposta_esperada: 'Não é necessário processo criminal nem inquérito policial: as medidas protetivas de urgência são concedidas independentemente da tipificação penal da violência, do ajuizamento de ação penal ou cível, da existência de inquérito policial ou do registro de boletim de ocorrência. Elas permanecem em vigor enquanto persistir o risco à integridade física, psicológica, sexual, patrimonial ou moral da ofendida ou de seus dependentes.'
    pontos_obrigatorios:
    - A concessão independe de ação penal ou cível, de inquérito policial ou de boletim de ocorrência.
    - As medidas protetivas vigoram enquanto persistir o risco à integridade da ofendida ou de seus dependentes.
    resposta: 'Sobre a primeira parte da sua pergunta: não. A lei prevê que as medidas protetivas de urgência podem ser concedidas independentemente da tipificação penal da violência, do ajuizamento de ação penal ou cível, da existência de inquérito policial ou do registro de boletim de ocorrência (Lei 11.340/2006, art. 19, § 5º).


      Quem decide sobre a concessão é o juiz, a pedido do Ministério Público ou da própria ofendida (Lei 11.340/2006, art. 19). Recebido o pedido, o juiz tem o prazo de 48 horas para decidir (Lei 11.340/2006, art. 18, I).


      Sobre por quanto tempo a medida continua valendo: não sei responder com segurança, porque os trechos enviados não tratam da duração das medidas protetivas.'
    artigos:
      Lei 11.340/2006, art. 19: 'Art. 19. As medidas protetivas de urgência poderão ser concedidas pelo juiz, a requerimento do Ministério Público ou a pedido da ofendida.

        § 1º As medidas protetivas de urgência poderão ser concedidas de imediato, independentemente de audiência das partes e de manifestação do Ministério Público, devendo este ser prontamente comunicado.

        § 2º As medidas protetivas de urgência serão aplicadas isolada ou cumulativamente, e poderão ser substituídas a qualquer tempo por outras de maior eficácia, sempre que os direitos reconhecidos nesta Lei forem ameaçados ou violados.

        § 3º Poderá o juiz, a requerimento do Ministério Público ou a pedido da ofendida, conceder novas medidas protetivas de urgência ou rever aquelas já concedidas, se entender necessário à proteção da ofendida, de seus familiares e de seu patrimônio, ouvido o Ministério Público.

        § 4º As medidas protetivas de urgência serão concedidas em juízo de cognição sumária a partir do depoimento da ofendida perante a autoridade policial ou da apresentação de suas alegações escritas e poderão ser indeferidas no caso de avaliação pela autoridade de inexistência de risco à integridade física, psicológica, sexual, patrimonial ou moral da ofendida ou de seus dependentes.

        § 5º As medidas protetivas de urgência serão concedidas independentemente da tipificação penal da violência, do ajuizamento de ação penal ou cível, da existência de inquérito policial ou do registro de boletim de ocorrência.

        § 6º As medidas protetivas de urgência vigorarão enquanto persistir risco à integridade física, psicológica, sexual, patrimonial ou moral da ofendida ou de seus dependentes.'
      Lei 11.340/2006, art. 18: 'Art. 18. Recebido o expediente com o pedido da ofendida, caberá ao juiz, no prazo de 48 (quarenta e oito) horas:

        I - conhecer do expediente e do pedido e decidir sobre as medidas protetivas de urgência;

        II - determinar o encaminhamento da ofendida ao órgão de assistência judiciária, quando for o caso, inclusive para o ajuizamento da ação de separação judicial, de divórcio, de anulação de casamento ou de dissolução de união estável perante o juízo competente;

        III - comunicar ao Ministério Público para que adote as providências cabíveis.

        IV - determinar a apreensão imediata de arma de fogo sob a posse do agressor.'
