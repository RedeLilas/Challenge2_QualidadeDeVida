  A23:
    pergunta: Se uma trabalhadora precisar se afastar do local de trabalho para preservar sua integridade física e psicológica diante de violência doméstica, a Lei Maria da Penha garante a manutenção do emprego dela? Por quanto tempo?
    resposta_esperada: Sim. Para preservar a integridade física e psicológica da mulher em situação de violência doméstica e familiar, o juiz assegurará a manutenção do vínculo trabalhista, quando necessário o afastamento do local de trabalho, por até 6 meses.
    pontos_obrigatorios:
    - O juiz assegura a manutenção do vínculo trabalhista quando necessário o afastamento do local de trabalho.
    - O afastamento com manutenção do vínculo trabalhista pode durar até 6 meses.
    resposta: 'A lei trata disso, mas com limites. Veja o que está previsto.


      **1. Afastamento do trabalho**

      A lei prevê que a mulher em situação de violência doméstica e familiar pode ser afastada do local de trabalho por até 6 meses, para preservar sua integridade física e psicológica. Isso depende de decisão do juiz. (Lei 11.340/2006, art. 9º, § 2º, incluído pela Lei 13.871/2019)


      **2. Manutenção do vínculo**

      Nesse período de afastamento, a lei prevê a manutenção do vínculo trabalhista. Ou seja, o contrato de trabalho continua. (Lei 11.340/2006, art. 9º, § 2º)


      **3. Quem decide**

      Quem concede o afastamento é o juiz. A lei prevê o direito, mas não é automático: é preciso pedir e o juiz analisa o caso. (Lei 11.340/2006, art. 9º, § 2º)


      **4. Ponto de atenção**

      A lei fala em manutenção do vínculo trabalhista, mas não detalha quem paga o salário nesse período. Isso costuma ser discutido no caso concreto. Não sei responder com segurança como fica o pagamento em cada situação.


      **5. Outra proteção**

      A lei também prevê que o juiz pode determinar, se necessário, a recondução da mulher e dos dependentes ao domicílio, e a manutenção do vínculo trabalhista quando o afastamento do local de trabalho for necessário. (Lei 11.340/2006, art. 22, incisos II e III)


      **Importante**

      Isso é orientação, não substitui advogada ou defensora. Para o caso concreto, procure a Defensoria Pública ou uma advogada.


      **Se você estiver em perigo agora, ligue 190.**'
    artigos:
      Lei 11.340/2006, art. 9º: 'Art. 9º A assistência à mulher em situação de violência doméstica e familiar será prestada em caráter prioritário no Sistema Único de Saúde (SUS) e no Sistema Único de Segurança Pública (Susp), de forma articulada e conforme os princípios e as diretrizes previstos na Lei nº 8.742, de 7 de dezembro de 1993 (Lei Orgânica da Assistência Social), e em outras normas e políticas públicas de proteção, e emergencialmente, quando for o caso.

        § 1º O juiz determinará, por prazo certo, a inclusão da mulher em situação de violência doméstica e familiar no cadastro de programas assistenciais do governo federal, estadual e municipal.

        § 2º O juiz assegurará à mulher em situação de violência doméstica e familiar, para preservar sua integridade física e psicológica:

        I - acesso prioritário à remoção quando servidora pública, integrante da administração direta ou indireta;

        II - manutenção do vínculo trabalhista, quando necessário o afastamento do local de trabalho, por até seis meses.

        III - encaminhamento à assistência judiciária, quando for o caso, inclusive para eventual ajuizamento da ação de separação judicial, de divórcio, de anulação de casamento ou de dissolução de união estável perante o juízo competente.

        § 3º A assistência à mulher em situação de violência doméstica e familiar compreenderá o acesso aos benefícios decorrentes do desenvolvimento científico e tecnológico, incluindo os serviços de contracepção de emergência, a profilaxia das Doenças Sexualmente Transmissíveis (DST) e da Síndrome da Imunodeficiência Adquirida (AIDS) e outros procedimentos médicos necessários e cabíveis nos casos de violência sexual.

        § 4º

        § 5º Os dispositivos de segurança destinados ao uso em caso de perigo iminente e disponibilizados para o monitoramento das vítimas de violência doméstica ou familiar amparadas por medidas protetivas terão seus custos ressarcidos pelo agressor.

        § 6º O ressarcimento de que tratam os §§ 4º e 5º deste artigo não poderá importar ônus de qualquer natureza ao patrimônio da mulher e dos seus dependentes, nem configurar atenuante ou ensejar possibilidade de substituição da pena aplicada.

        § 7º A mulher em situação de violência doméstica e familiar tem prioridade para matricular seus dependentes em instituição de educação básica mais próxima de seu domicílio, ou transferi-los para essa instituição, mediante a apresentação dos documentos comprobatórios do registro da ocorrência policial ou do processo de violência doméstica e familiar em curso.

        § 8º Serão sigilosos os dados da ofendida e de seus dependentes matriculados ou transferidos conforme o disposto no § 7º deste artigo, e o acesso às informações será reservado ao juiz, ao Ministério Público e aos órgãos competentes do poder público.'
