  B23:
    pergunta: O ex-companheiro de uma amiga saiu dizendo para os colegas de serviço dela que ela tinha roubado dinheiro do caixa da loja, mesmo sabendo que era mentira, e ainda espalhou histórias humilhantes sobre a vida pessoal dela para ela ficar mal falada no bairro. Inventar que alguém cometeu um roubo e espalhar histórias para manchar o nome de uma pessoa são crimes diferentes?
    resposta_esperada: Sim, são crimes contra a honra previstos no Código Penal. Imputar falsamente a alguém fato definido como crime é calúnia (detenção de 6 meses a 2 anos e multa, incorrendo na mesma pena quem, sabendo falsa a imputação, a propala ou divulga), enquanto imputar a alguém fato ofensivo à sua reputação é difamação (detenção de 3 meses a 1 ano e multa).
    pontos_obrigatorios:
    - Atribuir falsamente a alguém fato definido como crime e divulgar essa acusação sabendo que é falsa configuram o crime de calúnia.
    - Atribuir a alguém fato ofensivo à sua reputação configura o crime de difamação.
    resposta: 'Sim, são situações diferentes. Podem ser tratadas como crimes distintos.


      **1. Dizer que ela roubou dinheiro, sabendo que é mentira**

      Isso pode ser **calúnia**. Calúnia é atribuir falsamente a alguém um crime. (Código Penal, art. 138)

      A pena prevista é detenção de 6 meses a 2 anos, e multa. (Código Penal, art. 138)


      **2. Espalhar histórias humilhantes sobre a vida pessoal**

      Isso pode ser **difamação**. Difamação é espalhar fato ofensivo à reputação de alguém. (Código Penal, art. 139)

      A pena prevista é detenção de 3 meses a 1 ano, e multa. (Código Penal, art. 139)


      Se as histórias forem sobre características dela, e não sobre um fato, pode ser **injúria**. Injúria é ofender a dignidade ou o decoro de alguém. (Código Penal, art. 140)


      **O que a lei prevê nesses casos**

      - A pena pode aumentar se o crime é cometido na presença de várias pessoas ou por meio que facilite a divulgação. (Código Penal, art. 141)

      - Se o crime é cometido contra a mulher por razões da condição de sexo feminino, a lei prevê pena maior. (Código Penal, art. 141, § 2º)

      - Esses crimes, em regra, dependem de queixa da pessoa ofendida. Quem decide se aceita a queixa é o juiz. (Código Penal, art. 145)


      **Sobre a Lei Maria da Penha**

      A Lei Maria da Penha trata de violência doméstica e familiar contra a mulher. (Lei 11.340/2006, art. 5º)

      Ela inclui a violência moral, que é caluniar, difamar ou injuriar a mulher. (Lei 11.340/2006, art. 7º, inciso V)

      Se o ex-companheiro se enquadra como agressor em relação doméstica ou familiar, esses fatos podem ser tratados também por essa lei. Quem avalia isso é o juiz.


      **Importante**

      - Guarde provas: mensagens, prints, nomes de testemunhas.

      - A pessoa ofendida pode procurar a delegacia, a Defensoria Pública ou uma advogada.

      - Eu não sei responder com segurança qual é o melhor caminho no caso concreto. Isso depende de detalhes que só uma profissional pode avaliar.


      Se houver perigo agora, ligue 190.'
    artigos:
      Código Penal, art. 138: 'Art. 138 - Caluniar alguém, imputando-lhe falsamente fato definido como crime: Pena - detenção, de seis meses a dois anos, e multa.

        § 1º - Na mesma pena incorre quem, sabendo falsa a imputação, a propala ou divulga.

        § 2º - É punível a calúnia contra os mortos.

        § 3º - Admite-se a prova da verdade, salvo:

        I - se, constituindo o fato imputado crime de ação privada, o ofendido não foi condenado por sentença irrecorrível;

        II - se o fato é imputado a qualquer das pessoas indicadas no nº I do art. 141;

        III - se do crime imputado, embora de ação pública, o ofendido foi absolvido por sentença irrecorrível.'
      Código Penal, art. 139: 'Art. 139 - Difamar alguém, imputando-lhe fato ofensivo à sua reputação: Pena - detenção, de três meses a um ano, e multa.

        Parágrafo único - A exceção da verdade somente se admite se o ofendido é funcionário público e a ofensa é relativa ao exercício de suas funções.'
      Código Penal, art. 140: 'Art. 140 - Injuriar alguém, ofendendo-lhe a dignidade ou o decoro: Pena - detenção, de um a seis meses, ou multa.

        § 1º - O juiz pode deixar de aplicar a pena:

        I - quando o ofendido, de forma reprovável, provocou diretamente a injúria;

        II - no caso de retorsão imediata, que consista em outra injúria.

        § 2º - Se a injúria consiste em violência ou vias de fato, que, por sua natureza ou pelo meio empregado, se considerem aviltantes: Pena - detenção, de três meses a um ano, e multa, além da pena correspondente à violência.

        § 3º Se a injúria consiste na utilização de elementos referentes a religião ou à condição de pessoa idosa ou com deficiência: Pena - reclusão, de 1 (um) a 3 (três) anos, e multa.'
      Lei 11.340/2006, art. 5º: 'Art. 5º Para os efeitos desta Lei, configura violência doméstica e familiar contra a mulher qualquer ação ou omissão baseada no gênero que lhe cause morte, lesão, sofrimento físico, sexual ou psicológico e dano moral ou patrimonial:

        I - no âmbito da unidade doméstica, compreendida como o espaço de convívio permanente de pessoas, com ou sem vínculo familiar, inclusive as esporadicamente agregadas;

        II - no âmbito da família, compreendida como a comunidade formada por indivíduos que são ou se consideram aparentados, unidos por laços naturais, por afinidade ou por vontade expressa;

        III - em qualquer relação íntima de afeto, na qual o agressor conviva ou tenha convivido com a ofendida, independentemente de coabitação.

        Parágrafo único. As relações pessoais enunciadas neste artigo independem de orientação sexual.'
      Lei 11.340/2006, art. 7º: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

        I - a violência física, entendida como qualquer conduta que ofenda sua integridade ou saúde corporal;

        II - a violência psicológica, entendida como qualquer conduta que lhe cause dano emocional e diminuição da autoestima ou que lhe prejudique e perturbe o pleno desenvolvimento ou que vise degradar ou controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, vigilância constante, perseguição contumaz, insulto, chantagem, violação de sua intimidade, ridicularização, exploração e limitação do direito de ir e vir ou qualquer outro meio que lhe cause prejuízo à saúde psicológica e à autodeterminação;

        III - a violência sexual, entendida como qualquer conduta que a constranja a presenciar, a manter ou a participar de relação sexual não desejada, mediante intimidação, ameaça, coação ou uso da força; que a induza a comercializar ou a utilizar, de qualquer modo, a sua sexualidade, que a impeça de usar qualquer método contraceptivo ou que a force ao matrimônio, à gravidez, ao aborto ou à prostituição, mediante coação, chantagem, suborno ou manipulação; ou que limite ou anule o exercício de seus direitos sexuais e reprodutivos;

        IV - a violência patrimonial, entendida como qualquer conduta que configure retenção, subtração, destruição parcial ou total de seus objetos, instrumentos de trabalho, documentos pessoais, bens, valores e direitos ou recursos econômicos, incluindo os destinados a satisfazer suas necessidades;

        V - a violência moral, entendida como qualquer conduta que configure calúnia, difamação ou injúria.

        VI – a violência vicária, entendida como qualquer forma de violência praticada contra descendente, ascendente, dependente, enteado, parente, pessoa sob guarda ou responsabilidade direta da mulher ou pessoa de sua rede de apoio, com vistas a atingi-la.'
    fora_da_base:
    - Código Penal, art. 141
    - Código Penal, art. 145
  B24:
    pergunta: Uma amiga minha namora outra mulher e sofre agressões e humilhações constantes nesse relacionamento, mas elas nunca moraram juntas. A Lei Maria da Penha protege mulheres em relacionamentos homoafetivos e sem morar na mesma casa?
    resposta_esperada: Sim. A Lei Maria da Penha aplica-se a qualquer relação íntima de afeto na qual a pessoa agressora conviva ou tenha convivido com a ofendida, independentemente de coabitação (morar na mesma casa), e as relações pessoais protegidas pela lei independem de orientação sexual.
    pontos_obrigatorios:
    - A proteção vale para relação íntima de afeto independentemente de coabitação (morar junto).
    - A aplicação da Lei 11.340/2006 independe de orientação sexual.
    resposta: 'Sim. A lei fala em "unidade doméstica, família ou relação íntima de afeto", sem exigir morar junto nem exigir que o parceiro seja homem (Lei 11.340/2006, art. 5º).


      Então, pela lei, a proteção alcança relação entre duas mulheres, com ou sem coabitação. "Relação íntima de afeto" é o vínculo próximo e afetivo entre as pessoas, mesmo sem morarem juntas.


      O que a lei prevê nesses casos:

      - Violência psicológica, como humilhação e controle, é forma de violência doméstica (Lei 11.340/2006, art. 7º, II).

      - A mulher pode pedir medidas protetivas de urgência, como afastamento do agressor e proibição de contato (Lei 11.340/2006, arts. 18 e 22).

      - Quem decide conceder as medidas é o juiz, que analisa o caso (Lei 11.340/2006, art. 19).


      Importante: a lei prevê esses caminhos, mas não há resultado garantido. Quem avalia e decide é a autoridade policial e o juiz.


      Se ela estiver em perigo agora, ligue 190. Para orientação, o Ligue 180 atende gratuitamente. Eu ofereço orientação e não substituo advogada ou defensora pública.'
