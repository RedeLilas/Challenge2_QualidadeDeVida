  A24:
    pergunta: O ex-companheiro de uma amiga saiu dizendo para os colegas de serviço dela que ela tinha roubado dinheiro do caixa da loja, mesmo sabendo que era mentira, e ainda espalhou histórias humilhantes sobre a vida pessoal dela para ela ficar mal falada no bairro. Inventar que alguém cometeu um roubo e espalhar histórias para manchar o nome de uma pessoa são crimes diferentes?
    resposta_esperada: Sim, são crimes contra a honra previstos no Código Penal. Imputar falsamente a alguém fato definido como crime é calúnia (detenção de 6 meses a 2 anos e multa, incorrendo na mesma pena quem, sabendo falsa a imputação, a propala ou divulga), enquanto imputar a alguém fato ofensivo à sua reputação é difamação (detenção de 3 meses a 1 ano e multa).
    pontos_obrigatorios:
    - Atribuir falsamente a alguém fato definido como crime e divulgar essa acusação sabendo que é falsa configuram o crime de calúnia.
    - Atribuir a alguém fato ofensivo à sua reputação configura o crime de difamação.
    resposta: 'Sim, são crimes diferentes.


      **Inventar que ela roubou e espalhar isso**

      - Caluniar é imputar falsamente a alguém um fato definido como crime (Código Penal, art. 138).

      - Quem sabe que a história é falsa e mesmo assim a espalha também responde pelo crime (Código Penal, art. 138, § 1º).

      - A pena prevista é detenção de seis meses a dois anos, e multa (Código Penal, art. 138).


      **Espalhar histórias humilhantes sobre a vida pessoal**

      - Injuriar é ofender a dignidade ou o decoro de alguém (Código Penal, art. 140).

      - A pena prevista é detenção de um a seis meses, ou multa (Código Penal, art. 140).

      - O juiz pode deixar de aplicar a pena em casos de provocação direta ou retorsão imediata — que é responder com outra injúria (Código Penal, art. 140, § 1º).


      Quem decide se houve crime e qual pena aplicar é o juiz. Eu não posso garantir resultado.


      Se ela estiver em perigo agora, ligue 190.'
    artigos:
      Código Penal, art. 138: 'Art. 138 - Caluniar alguém, imputando-lhe falsamente fato definido como crime: Pena - detenção, de seis meses a dois anos, e multa.

        § 1º - Na mesma pena incorre quem, sabendo falsa a imputação, a propala ou divulga.

        § 2º - É punível a calúnia contra os mortos.

        § 3º - Admite-se a prova da verdade, salvo:

        I - se, constituindo o fato imputado crime de ação privada, o ofendido não foi condenado por sentença irrecorrível;

        II - se o fato é imputado a qualquer das pessoas indicadas no nº I do art. 141;

        III - se do crime imputado, embora de ação pública, o ofendido foi absolvido por sentença irrecorrível.'
      Código Penal, art. 140: 'Art. 140 - Injuriar alguém, ofendendo-lhe a dignidade ou o decoro: Pena - detenção, de um a seis meses, ou multa.

        § 1º - O juiz pode deixar de aplicar a pena:

        I - quando o ofendido, de forma reprovável, provocou diretamente a injúria;

        II - no caso de retorsão imediata, que consista em outra injúria.

        § 2º - Se a injúria consiste em violência ou vias de fato, que, por sua natureza ou pelo meio empregado, se considerem aviltantes: Pena - detenção, de três meses a um ano, e multa, além da pena correspondente à violência.

        § 3º Se a injúria consiste na utilização de elementos referentes a religião ou à condição de pessoa idosa ou com deficiência: Pena - reclusão, de 1 (um) a 3 (três) anos, e multa.'
    fora_da_base: []
  A25:
    pergunta: Quando uma mulher precisa sair de casa por causa de violência doméstica e está em situação de vulnerabilidade social e econômica, a Lei Maria da Penha prevê a concessão de auxílio-aluguel pelo juiz e qual é o prazo máximo desse benefício?
    resposta_esperada: Sim. A Lei Maria da Penha prevê que o juiz pode conceder à ofendida auxílio-aluguel, com valor fixado em função de sua situação de vulnerabilidade social e econômica, por período não superior a 6 meses.
    pontos_obrigatorios:
    - O juiz pode conceder auxílio-aluguel em função da situação de vulnerabilidade social e econômica da ofendida.
    - O prazo máximo previsto para o auxílio-aluguel é de até 6 meses.
    resposta: 'A Lei Maria da Penha prevê esse auxílio, sim. O juiz pode conceder auxílio-aluguel à mulher em situação de violência doméstica e familiar que esteja em vulnerabilidade social e econômica (Lei 11.340/2006, art. 9º, § 4º).


      Explicando: auxílio-aluguel é um valor em dinheiro para ajudar a pagar moradia provisória.


      Sobre o prazo: a lei não fixa um prazo máximo único no art. 9º, § 4º. Ela diz que o benefício pode ser concedido por prazo determinado, e quem define esse prazo é o juiz, conforme o caso. Não sei responder com segurança se existe um limite máximo geral previsto em outra norma.


      Importante: quem decide a concessão é o juiz. A lei prevê a possibilidade, não garante o benefício.


      Se você está em perigo agora, ligue 190. Para orientação jurídica, procure a Defensoria Pública ou uma advogada.'
    artigos:
      Lei 11.340/2006, art. 9º: 'Art. 9º A assistência à mulher em situação de violência doméstica e familiar será prestada em caráter prioritário no Sistema Único de Saúde (SUS) e no Sistema Único de Segurança Pública (Susp), de forma articulada e conforme os princípios e as diretrizes previstos na Lei nº 8.742, de 7 de dezembro de 1993 (Lei Orgânica da Assistência Social), e em outras normas e políticas públicas de proteção, e emergencialmente, quando for o caso.

        § 1º O juiz determinará, por prazo certo, a inclusão da mulher em situação de violência doméstica e familiar no cadastro de programas assistenciais do governo federal, estadual e municipal.

        § 2º O juiz assegurará à mulher em situação de violência doméstica e familiar, para preservar sua integridade física e psicológica:

        I - acesso prioritário à remoção quando servidora pública, integrante da administração direta ou indireta;

        II - manutenção do vínculo trabalhista, quando necessário o afastamento do local de trabalho, por até seis meses.

        III - encaminhamento à assistência judiciária, quando for o caso, inclusive para eventual ajuizamento da ação de separação judicial, de divórcio, de anulação de casamento ou de dissolução de união estável perante o juízo competente.

        § 3º A assistência à mulher em situação de violência doméstica e familiar compreenderá o acesso aos benefícios decorrentes do desenvolvimento científico e tecnológico, incluindo os serviços de contracepção de emergência, a profilaxia das Doenças Sexualmente Transmissíveis (DST) e da Síndrome da Imunodeficiência Adquirida (AIDS) e outros procedimentos médicos necessários e cabíveis nos casos de violência sexual.

        § 4º

        § 5º Os dispositivos de segurança destinados ao uso em caso de perigo iminente e disponibilizados para o monitoramento das vítimas de violência doméstica ou familiar amparadas por medidas protetivas terão seus custos ressarcidos pelo agressor.

        § 6º O ressarcimento de que tratam os §§ 4º e 5º deste artigo não poderá importar ônus de qualquer natureza ao patrimônio da mulher e dos seus dependentes, nem configurar atenuante ou ensejar possibilidade de substituição da pena aplicada.

        § 7º A mulher em situação de violência doméstica e familiar tem prioridade para matricular seus dependentes em instituição de educação básica mais próxima de seu domicílio, ou transferi-los para essa instituição, mediante a apresentação dos documentos comprobatórios do registro da ocorrência policial ou do processo de violência doméstica e familiar em curso.

        § 8º Serão sigilosos os dados da ofendida e de seus dependentes matriculados ou transferidos conforme o disposto no § 7º deste artigo, e o acesso às informações será reservado ao juiz, ao Ministério Público e aos órgãos competentes do poder público.'
    fora_da_base:
    - art. 9 (norma não identificada)
  A26:
    pergunta: Se uma mulher casada assinou no passado uma procuração em nome do marido e receia que ele venda bens do casal ou fique com objetos que ele retirou dela, que medidas protetivas patrimoniais o juiz pode determinar liminarmente?
    resposta_esperada: Para a proteção patrimonial dos bens da sociedade conjugal ou de propriedade particular da mulher, o juiz pode determinar liminarmente a restituição de bens indevidamente subtraídos pelo agressor, a proibição temporária para celebrar atos e contratos de compra, venda e locação de propriedade em comum (salvo expressa autorização judicial), a suspensão das procurações conferidas pela ofendida ao agressor e a prestação de caução provisória por perdas e danos materiais, oficiando ao cartório competente.
    pontos_obrigatorios:
    - Restituição de bens indevidamente subtraídos e proibição temporária de compra, venda e locação de propriedade em comum sem autorização judicial.
    - Suspensão das procurações conferidas pela ofendida ao agressor.
    resposta: 'O juiz pode determinar, de forma liminar (decisão rápida, no início do processo), medidas para proteger os bens do casal ou os bens particulares da mulher (Lei 11.340/2006, art. 24). Entre elas:


      - Devolução de bens que o agressor tirou indevidamente da mulher (Lei 11.340/2006, art. 24, I).

      - Proibição temporária de fazer atos e contratos de compra, venda e locação de bem em comum, salvo autorização do juiz (Lei 11.340/2006, art. 24, II).

      - Suspensão das procurações que a mulher deu ao agressor (Lei 11.340/2006, art. 24, III).

      - Prestação de caução provisória, que é um depósito judicial em garantia, por perdas e danos materiais causados pela violência (Lei 11.340/2006, art. 24, IV).


      O juiz deve comunicar o cartório competente sobre a proibição de contratos e a suspensão da procuração (Lei 11.340/2006, art. 24, parágrafo único).


      A lei prevê essas medidas, mas quem decide se concede é o juiz. Isso é orientação e não substitui advogada ou defensora. Se houver perigo agora, ligue 190.'
    artigos:
      Lei 11.340/2006, art. 24: 'Art. 24. Para a proteção patrimonial dos bens da sociedade conjugal ou daqueles de propriedade particular da mulher, o juiz poderá determinar, liminarmente, as seguintes medidas, entre outras:

        I - restituição de bens indevidamente subtraídos pelo agressor à ofendida;

        II - proibição temporária para a celebração de atos e contratos de compra, venda e locação de propriedade em comum, salvo expressa autorização judicial;

        III - suspensão das procurações conferidas pela ofendida ao agressor;

        IV - prestação de caução provisória, mediante depósito judicial, por perdas e danos materiais decorrentes da prática de violência doméstica e familiar contra a ofendida.

        Parágrafo único. Deverá o juiz oficiar ao cartório competente para os fins previstos nos incisos II e III deste artigo.'
    fora_da_base: []
  A27:
    pergunta: Em crimes de violência doméstica em que a ação penal depende de representação da vítima, a mulher pode simplesmente retirar a representação na delegacia a qualquer momento, ou existe uma regra específica na Lei Maria da Penha para essa retratação?
    resposta_esperada: 'Não pode ser feita simplesmente na delegacia: nas ações penais públicas condicionadas à representação da ofendida tratadas na Lei Maria da Penha, a renúncia à representação (retratação) só é admitida perante o juiz, em audiência especialmente designada com essa finalidade, antes do recebimento da denúncia e ouvido o Ministério Público, mediante manifestação expressa da vítima.'
    pontos_obrigatorios:
    - A renúncia à representação só é admitida perante o juiz, em audiência especialmente designada para essa finalidade.
    - Deve ocorrer antes do recebimento da denúncia e ouvido o Ministério Público.
    resposta: 'Não é tão simples assim. Existe regra específica.


      **O que a lei prevê:**

      - A retratação da representação só pode ser feita **perante o juiz**, em audiência especialmente designada para isso, **antes do recebimento da denúncia** (Lei 11.340/2006, art. 16).

      - Ou seja: não basta ir à delegacia e "retirar a queixa". A retratação na delegacia, sozinha, não produz o efeito previsto nesse artigo.

      - Nessa audiência, o juiz deve perguntar à mulher se ela confirma ou não a retratação (Lei 11.340/2006, art. 16).


      **Termos explicados:**

      - *Representação*: é a manifestação da vítima de que quer que o crime seja investigado e processado. É a "queixa" em sentido amplo.

      - *Retratação*: é voltar atrás, desistir dessa representação.

      - *Recebimento da denúncia*: é o momento em que o juiz aceita a acusação formal feita pelo Ministério Público e o processo começa a correr.


      **Quem decide:** o juiz analisa o caso concreto. A lei prevê esse caminho, mas não garante que a retratação será aceita em qualquer situação.


      **Importante:** mesmo após a retratação, o Ministério Público pode avaliar outras medidas cabíveis. E a mulher pode buscar a Defensoria Pública ou uma advogada para entender seu caso.


      Se você estiver em perigo agora, ligue **190**.'
    artigos:
      Lei 11.340/2006, art. 16: 'Art. 16. Nas ações penais públicas condicionadas à representação da ofendida de que trata esta Lei, só será admitida a renúncia à representação perante o juiz, em audiência especialmente designada com tal finalidade, antes do recebimento da denúncia e ouvido o Ministério Público.

        Parágrafo único. A audiência prevista no caput deste artigo tem por objetivo confirmar a retratação da vítima, não a representação, e somente será designada pelo juiz mediante manifestação expressa de seu desejo de se retratar, apresentada por escrito ou oralmente antes do recebimento da denúncia, devendo a retratação ser devidamente registrada nos autos.'
    fora_da_base: []
  A28:
    pergunta: Depois que uma conhecida terminou o namoro, o ex-namorado espalhou em grupos de conversa fotos e vídeos dela nua que tinham sido gravados quando eles ainda estavam juntos, sem ela autorizar, só para se vingar e expor ela. Espalhar essas imagens íntimas na internet sem permissão é crime, e o fato de ele ser ex-namorado ou fazer isso por vingança aumenta a pena?
    resposta_esperada: Sim. Oferecer, trocar, disponibilizar, transmitir, distribuir, publicar ou divulgar, por qualquer meio, fotografia, vídeo ou outro registro audiovisual que contenha cena de sexo, nudez ou pornografia sem o consentimento da vítima é crime com pena de reclusão de 4 a 10 anos e multa, se o fato não constitui crime mais grave. A pena é aumentada de 1/3 a 2/3 se o crime é praticado por agente que mantém ou tenha mantido relação íntima de afeto com a vítima ou com o fim de vingança ou humilhação.
    pontos_obrigatorios:
    - Divulgar fotografia ou vídeo com cena de sexo, nudez ou pornografia sem o consentimento da vítima é crime punido com reclusão de 4 a 10 anos e multa.
    - A pena é aumentada de 1/3 a 2/3 quando o autor mantém ou manteve relação íntima de afeto com a vítima ou age com fim de vingança ou humilhação.
    resposta: 'Sim, espalhar imagens íntimas sem autorização é crime. E o fato de ser ex-namorado e agir por vingança pesa contra ele.


      **O crime**

      Divulgar foto ou vídeo de nudez ou de ato sexual sem o consentimento da pessoa é crime (Lei 13.718/2018, que incluiu o art. 218-C no Código Penal). A pena é de reclusão de 1 a 5 anos, se o fato não for crime mais grave (Código Penal, art. 218-C).


      **Aumento de pena**

      A pena aumenta de 1/3 até 2/3 se o crime é cometido por alguém que tem ou teve relação íntima de afeto com a vítima, ou se é feito para humilhar, por vingança ou por outro motivo torpe (Código Penal, art. 218-C, § 1º). Então, ser ex-namorado e agir por vingança são exatamente as situações que aumentam a pena.


      **Outras proteções**

      - A Lei Maria da Penha vale para violência contra a mulher em razão da relação de afeto, mesmo depois do fim do namoro (Lei 11.340/2006, art. 5º).

      - A divulgação pode ser violência psicológica e moral (Lei 11.340/2006, art. 7º, incisos II e V).

      - Ela pode pedir medida protetiva de urgência, como proibição de contato e de divulgação de dados (Lei 11.340/2006, arts. 18 e 22).


      **Quem decide**

      Quem aplica a pena é o juiz, após o processo. A lei prevê essas penas, mas não há resultado garantido.


      **O que ela pode fazer**

      - Guardar provas: prints, links, nomes dos grupos.

      - Registrar boletim de ocorrência em delegacia, de preferência especializada em atendimento à mulher.

      - Procurar a Defensoria Pública ou uma advogada.

      - Pedir que as plataformas removam o conteúdo.


      Se ela estiver em perigo agora, ligue 190.


      Isso é orientação e não substitui advogada ou defensora.'
    artigos:
      Código Penal, art. 218-C: 'Art. 218-C. Oferecer, trocar, disponibilizar, transmitir, vender ou expor à venda, distribuir, publicar ou divulgar, por qualquer meio - inclusive por meio de comunicação de massa ou sistema de informática ou telemática -, fotografia, vídeo ou outro registro audiovisual que contenha cena de estupro ou de estupro de vulnerável ou que faça apologia ou induza a sua prática, ou, sem o consentimento da vítima, cena de sexo, nudez ou pornografia: Pena – reclusão, de 4 (quatro) a 10 (dez) anos, e multa, se o fato não constitui crime mais grave.

        § 1º A pena é aumentada de 1/3 (um terço) a 2/3 (dois terços) se o crime é praticado por agente que mantém ou tenha mantido relação íntima de afeto com a vítima ou com o fim de vingança ou humilhação.

        § 2º Não há crime quando o agente pratica as condutas descritas no caput deste artigo em publicação de natureza jornalística, científica, cultural ou acadêmica com a adoção de recurso que impossibilite a identificação da vítima, ressalvada sua prévia autorização, caso seja maior de 18 (dezoito) anos.'
      Lei 11.340/2006, art. 5º: 'Art. 5º Para os efeitos desta Lei, configura violência doméstica e familiar contra a mulher qualquer ação ou omissão baseada no gênero que lhe cause morte, lesão, sofrimento físico, sexual ou psicológico e dano moral ou patrimonial:

        I - no âmbito da unidade doméstica, compreendida como o espaço de convívio permanente de pessoas, com ou sem vínculo familiar, inclusive as esporadicamente agregadas;

        II - no âmbito da família, compreendida como a comunidade formada por indivíduos que são ou se consideram aparentados, unidos por laços naturais, por afinidade ou por vontade expressa;

        III - em qualquer relação íntima de afeto, na qual o agressor conviva ou tenha convivido com a ofendida, independentemente de coabitação.

        Parágrafo único. As relações pessoais enunciadas neste artigo independem de orientação sexual.'
      Lei 11.340/2006, art. 7º: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

        I - a violência física, entendida como qualquer conduta que ofenda sua integridade ou saúde corporal;

        II - a violência psicológica, entendida como qualquer conduta que lhe cause dano emocional e diminuição da autoestima ou que lhe prejudique e perturbe o pleno desenvolvimento ou que vise degradar ou controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, vigilância constante, perseguição contumaz, insulto, chantagem, violação de sua intimidade, ridicularização, exploração e limitação do direito de ir e vir ou qualquer outro meio que lhe cause prejuízo à saúde psicológica e à autodeterminação;

        III - a violência sexual, entendida como qualquer conduta que a constranja a presenciar, a manter ou a participar de relação sexual não desejada, mediante intimidação, ameaça, coação ou uso da força; que a induza a comercializar ou a utilizar, de qualquer modo, a sua sexualidade, que a impeça de usar qualquer método contraceptivo ou que a force ao matrimônio, à gravidez, ao aborto ou à prostituição, mediante coação, chantagem, suborno ou manipulação; ou que limite ou anule o exercício de seus direitos sexuais e reprodutivos;

        IV - a violência patrimonial, entendida como qualquer conduta que configure retenção, subtração, destruição parcial ou total de seus objetos, instrumentos de trabalho, documentos pessoais, bens, valores e direitos ou recursos econômicos, incluindo os destinados a satisfazer suas necessidades;

        V - a violência moral, entendida como qualquer conduta que configure calúnia, difamação ou injúria.

        VI – a violência vicária, entendida como qualquer forma de violência praticada contra descendente, ascendente, dependente, enteado, parente, pessoa sob guarda ou responsabilidade direta da mulher ou pessoa de sua rede de apoio, com vistas a atingi-la.'
      Lei 11.340/2006, art. 18: 'Art. 18. Recebido o expediente com o pedido da ofendida, caberá ao juiz, no prazo de 48 (quarenta e oito) horas:

        I - conhecer do expediente e do pedido e decidir sobre as medidas protetivas de urgência;

        II - determinar o encaminhamento da ofendida ao órgão de assistência judiciária, quando for o caso, inclusive para o ajuizamento da ação de separação judicial, de divórcio, de anulação de casamento ou de dissolução de união estável perante o juízo competente;

        III - comunicar ao Ministério Público para que adote as providências cabíveis.

        IV - determinar a apreensão imediata de arma de fogo sob a posse do agressor.'
      Lei 11.340/2006, art. 22: 'Art. 22. Constatada a prática de violência doméstica e familiar contra a mulher, nos termos desta Lei, o juiz poderá aplicar, de imediato, ao agressor, em conjunto ou separadamente, as seguintes medidas protetivas de urgência, entre outras:

        I - suspensão da posse ou restrição do porte de armas, com comunicação ao órgão competente, nos termos da Lei nº 10.826, de 22 de dezembro de 2003;

        II - afastamento do lar, domicílio ou local de convivência com a ofendida;

        III - proibição de determinadas condutas, entre as quais:

        a) aproximação da ofendida, de seus familiares e das testemunhas, fixando o limite mínimo de distância entre estes e o agressor;

        b) contato com a ofendida, seus familiares e testemunhas por qualquer meio de comunicação;

        c) freqüentação de determinados lugares a fim de preservar a integridade física e psicológica da ofendida;

        IV - restrição ou suspensão de visitas aos dependentes menores, ouvida a equipe de atendimento multidisciplinar ou serviço similar;

        V - prestação de alimentos provisionais ou provisórios.

        VI – comparecimento do agressor a programas de recuperação e reeducação; e

        VII – acompanhamento psicossocial do agressor, por meio de atendimento individual e/ou em grupo de apoio.

        VIII – monitoração eletrônica, disponibilizando-se à vítima aplicação ou dispositivo de segurança que alerte sobre eventual aproximação do agressor.

        § 1º As medidas referidas neste artigo não impedem a aplicação de outras previstas na legislação em vigor, sempre que a segurança da ofendida ou as circunstâncias o exigirem, devendo a providência ser comunicada ao Ministério Público.

        § 2º Na hipótese de aplicação do inciso I, encontrando-se o agressor nas condições mencionadas no caput e incisos do art. 6º da Lei nº 10.826, de 22 de dezembro de 2003, o juiz comunicará ao respectivo órgão, corporação ou instituição as medidas protetivas de urgência concedidas e determinará a restrição do porte de armas, ficando o superior imediato do agressor responsável pelo cumprimento da determinação judicial, sob pena de incorrer nos crimes de prevaricação ou de desobediência, conforme o caso.

        § 3º Para garantir a efetividade das medidas protetivas de urgência, poderá o juiz requisitar, a qualquer momento, auxílio da força policial.

        § 4º Na aplicação das medidas protetivas de urgência, o juiz concederá a tutela específica ou determinará providências que assegurem a obtenção de tutela pelo resultado prático equivalente.

        § 5º.

        § 6º A aplicação da medida prevista no inciso VIII do caput deste artigo terá prioridade nos casos em que houver descumprimento de medidas protetivas anteriormente impostas ou quando for verificado risco iminente à integridade física ou psicológica da vítima.

        § 7º Para a efetivação da medida prevista no inciso VIII do caput deste artigo, a autoridade competente promoverá a instalação do equipamento e instruirá o agressor sobre o seu funcionamento e as áreas de exclusão onde não poderá circular, conforme definido na decisão da autoridade judicial, devendo a ciência constar de termo nos autos.

        § 8º O sistema de monitoração eletrônica de que trata o inciso VIII do caput deste artigo deverá emitir alerta automático e simultâneo à vítima e à unidade policial mais próxima sempre que o agressor romper o perímetro de exclusão fixado judicialmente.

        § 9º Nos casos previstos no § 6º deste artigo, a decisão judicial que deixar de aplicar a medida protetiva de monitoração eletrônica deverá apresentar fundamentação expressa quanto às razões da não aplicação da medida.

        § 10 As medidas protetivas de natureza cível, inclusive as de prestação de alimentos provisionais ou provisórios, constituem título executivo judicial de pleno direito, dispensando a propositura de ação principal.'
    fora_da_base: []
  A29:
    pergunta: Uma mulher que sofreu violência doméstica quer entrar com pedido de divórcio ou dissolução de união estável no próprio Juizado de Violência Doméstica e Familiar contra a Mulher. Ela pode fazer isso lá, inclusive para resolver a partilha dos bens do casal?
    resposta_esperada: A ofendida tem a opção de propor a ação de divórcio ou de dissolução de união estável no próprio Juizado de Violência Doméstica e Familiar contra a Mulher, mas a pretensão relacionada à partilha de bens é excluída da competência desse Juizado.
    pontos_obrigatorios:
    - A ofendida pode optar por propor a ação de divórcio ou dissolução de união estável no Juizado de Violência Doméstica e Familiar contra a Mulher.
    - A partilha de bens fica excluída da competência do Juizado de Violência Doméstica.
    resposta: 'Não sei responder com segurança se o Juizado de Violência Doméstica pode processar o divórcio ou a dissolução de união estável com partilha de bens.


      O que a lei prevê:


      - O Juizado de Violência Doméstica e Familiar contra a Mulher foi criado para julgar causas sobre violência doméstica e familiar contra a mulher (Lei 11.340/2006, art. 14).

      - A lei também trata de medidas protetivas de urgência, que são ordens do juiz para proteger a mulher (Lei 11.340/2006, arts. 18 a 24).

      - A lei não deixa claro, no texto, se esse Juizado pode decidir divórcio ou partilha de bens.


      Quem decide onde o pedido corre é o juiz. Ele pode encaminhar o caso para outra vara.


      Sobre a partilha: ela é a divisão dos bens do casal. Em geral, é tratada junto com o divórcio ou a dissolução da união estável.


      O ideal é procurar a Defensoria Pública ou uma advogada. Elas podem dizer, no seu caso concreto, onde o pedido deve ser feito.


      Se você estiver em perigo agora, ligue 190.'
    artigos:
      Lei 11.340/2006, art. 14: 'Art. 14. Os Juizados de Violência Doméstica e Familiar contra a Mulher, órgãos da Justiça Ordinária com competência cível e criminal, poderão ser criados pela União, no Distrito Federal e nos Territórios, e pelos Estados, para o processo, o julgamento e a execução das causas decorrentes da prática de violência doméstica e familiar contra a mulher.

        Parágrafo único. Os atos processuais poderão realizar-se em horário noturno, conforme dispuserem as normas de organização judiciária.'
      Lei 11.340/2006, art. 18: 'Art. 18. Recebido o expediente com o pedido da ofendida, caberá ao juiz, no prazo de 48 (quarenta e oito) horas:

        I - conhecer do expediente e do pedido e decidir sobre as medidas protetivas de urgência;

        II - determinar o encaminhamento da ofendida ao órgão de assistência judiciária, quando for o caso, inclusive para o ajuizamento da ação de separação judicial, de divórcio, de anulação de casamento ou de dissolução de união estável perante o juízo competente;

        III - comunicar ao Ministério Público para que adote as providências cabíveis.

        IV - determinar a apreensão imediata de arma de fogo sob a posse do agressor.'
