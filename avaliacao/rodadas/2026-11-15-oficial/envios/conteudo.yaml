  A09:
    pergunta: Quando um agressor é preso em flagrante por descumprir uma medida protetiva de urgência concedida por um juiz cível, qual é a pena prevista na Lei Maria da Penha e o delegado de polícia pode arbitrar fiança na delegacia?
    resposta_esperada: Descumprir decisão judicial que defere medidas protetivas de urgência é crime previsto na Lei Maria da Penha com pena de reclusão de 2 a 5 anos e multa. O crime se configura independentemente de a medida ter sido deferida por juiz de competência cível ou criminal, e, em caso de prisão em flagrante, o delegado não pode conceder fiança, pois apenas a autoridade judicial pode fazê-lo.
    pontos_obrigatorios:
    - A pena prevista é de reclusão de 2 a 5 anos e multa.
    - O crime ocorre independentemente da competência civil ou criminal do juiz que deferiu a medida.
    - Na prisão em flagrante, apenas a autoridade judicial (juiz) pode conceder fiança.
    resposta: 'Não sei responder com segurança sobre todos os pontos dessa pergunta.


      Sobre o que a lei prevê, posso dizer:


      - Descumprir medida protetiva de urgência é crime, com pena de detenção de 3 meses a 2 anos (Lei 11.340/2006, art. 24-A). Detenção é uma pena privativa de liberdade mais branda que a reclusão.

      - A prisão em flagrante é possível quando a pessoa é encontrada cometendo o crime ou logo depois (Código de Processo Penal, art. 302).

      - Sobre fiança: a autoridade policial pode conceder fiança nos crimes com pena máxima de até 4 anos (Código de Processo Penal, art. 322). Como a pena máxima do art. 24-A é 2 anos, em tese o delegado poderia arbitrar fiança. Mas há normas e entendimentos que restringem isso em casos de violência doméstica, e não tenho certeza suficiente para afirmar como se aplica ao seu caso concreto.


      Quem decide sobre prisão, fiança e medidas é a autoridade competente, no caso concreto. Para orientação segura, procure uma advogada ou a Defensoria Pública.


      Se houver perigo agora, ligue 190.'
    artigos:
      Lei 11.340/2006, art. 24-A: 'Art. 24-A. Descumprir decisão judicial que defere medidas protetivas de urgência previstas nesta Lei: Pena – reclusão, de 2 (dois) a 5 (cinco) anos, e multa.

        § 1º A configuração do crime independe da competência civil ou criminal do juiz que deferiu as medidas.

        § 2º Na hipótese de prisão em flagrante, apenas a autoridade judicial poderá conceder fiança.

        § 3º O disposto neste artigo não exclui a aplicação de outras sanções cabíveis.

        § 4º A pena será aumentada de 1/3 (um terço) até a metade se o descumprimento decorrer da violação das áreas de exclusão monitoradas eletronicamente ou da remoção, violação ou alteração do dispositivo de monitoração sem autorização judicial.'
    fora_da_base:
    - art. 302 (norma não identificada)
    - art. 322 (norma não identificada)
    - art. 24-A (norma não identificada)
  A10:
    pergunta: Uma mulher trabalha como costureira autônoma e, após uma discussão meses atrás, o companheiro escondeu os documentos pessoais dela e danificou a máquina de costura para ela não conseguir trabalhar. Que tipo de violência doméstica é essa segundo a lei?
    resposta_esperada: Trata-se de violência patrimonial, definida pela Lei Maria da Penha como qualquer conduta que configure retenção, subtração ou destruição parcial ou total de objetos, instrumentos de trabalho, documentos pessoais, bens, valores e direitos ou recursos econômicos da mulher.
    pontos_obrigatorios:
    - Configura violência patrimonial nos termos da Lei 11.340/2006.
    - Inclui a retenção ou destruição de documentos pessoais e de instrumentos de trabalho.
    resposta: 'Isso é violência patrimonial. A lei define como conduta que cause perda, subtração ou dano a bens, documentos e instrumentos de trabalho da mulher (Lei 11.340/2006, art. 7º, IV).


      Esconder os documentos e danificar a máquina de costura se encaixam nessa definição. A máquina é o instrumento de trabalho dela.


      A lei prevê medidas de proteção, como a proibição de o agressor se aproximar ou manter contato (Lei 11.340/2006, art. 22). Quem decide sobre essas medidas é o juiz.


      Ela pode registrar boletim de ocorrência em delegacia, inclusive na Delegacia da Mulher, e buscar a Defensoria Pública ou uma advogada. A orientação não substitui esse atendimento.


      Se houver perigo agora, ligue 190.'
    artigos:
      Lei 11.340/2006, art. 7º: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

        I - a violência física, entendida como qualquer conduta que ofenda sua integridade ou saúde corporal;

        II - a violência psicológica, entendida como qualquer conduta que lhe cause dano emocional e diminuição da autoestima ou que lhe prejudique e perturbe o pleno desenvolvimento ou que vise degradar ou controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, vigilância constante, perseguição contumaz, insulto, chantagem, violação de sua intimidade, ridicularização, exploração e limitação do direito de ir e vir ou qualquer outro meio que lhe cause prejuízo à saúde psicológica e à autodeterminação;

        III - a violência sexual, entendida como qualquer conduta que a constranja a presenciar, a manter ou a participar de relação sexual não desejada, mediante intimidação, ameaça, coação ou uso da força; que a induza a comercializar ou a utilizar, de qualquer modo, a sua sexualidade, que a impeça de usar qualquer método contraceptivo ou que a force ao matrimônio, à gravidez, ao aborto ou à prostituição, mediante coação, chantagem, suborno ou manipulação; ou que limite ou anule o exercício de seus direitos sexuais e reprodutivos;

        IV - a violência patrimonial, entendida como qualquer conduta que configure retenção, subtração, destruição parcial ou total de seus objetos, instrumentos de trabalho, documentos pessoais, bens, valores e direitos ou recursos econômicos, incluindo os destinados a satisfazer suas necessidades;

        V - a violência moral, entendida como qualquer conduta que configure calúnia, difamação ou injúria.

        VI – a violência vicária, entendida como qualquer forma de violência praticada contra descendente, ascendente, dependente, enteado, parente, pessoa sob guarda ou responsabilidade direta da mulher ou pessoa de sua rede de apoio, com vistas a atingi-la.'
      Lei 11.340/2006, art. 22: 'Art. 22. Constatada a prática de violência doméstica e familiar contra a mulher, nos termos desta Lei, o juiz poderá aplicar, de imediato, ao agressor, em conjunto ou separadamente, as seguintes medidas protetivas de urgência, entre outras:

        I - suspensão da posse ou restrição do porte de armas, com comunicação ao órgão competente, nos termos da Lei nº 10.826, de 22 de dezembro de 2003;

        II - afastamento do lar, domicílio ou local de convivência com a ofendida;

        III - proibição de determinadas condutas, entre as quais:

        a) aproximação da ofendida, de seus familiares e das testemunhas, fixando o limite mínimo de distância entre estes e o agressor;

        b) contato com a ofendida, seus familiares e testemunhas por qualquer meio de comunicação;

        c) freqüentação de determinados lugares a fim de preservar a integridade física e psicológica da ofendida;

        IV - restrição ou suspensão de visitas aos dependentes menores, ouvida a equipe de atendimento multidisciplinar ou serviço similar;

        V - prestação de alimentos provisionais ou provisórios.

        VI – comparecimento do agressor a programas de recuperação e reeducação; e

        VII – acompanhamento psicossocial do agressor, por meio de atendimento individual e/ou em grupo de apoio.

        VIII – monitoração eletrônica, disponibilizando-se à vítima aplicação ou dispositivo de segurança que alerte sobre eventual aproximação do agressor.

        § 1º As medidas referidas neste artigo não impedem a aplicação de outras previstas na legislação em vigor, sempre que a segurança da ofendida ou as circunstâncias o exigirem, devendo a providência ser comunicada ao Ministério Público.

        § 2º Na hipótese de aplicação do inciso I, encontrando-se o agressor nas condições mencionadas no caput e incisos do art. 6º da Lei nº 10.826, de 22 de dezembro de 2003, o juiz comunicará ao respectivo órgão, corporação ou instituição as medidas protetivas de urgência concedidas e determinará a restrição do porte de armas, ficando o superior imediato do agressor responsável pelo cumprimento da determinação judicial, sob pena de incorrer nos crimes de prevaricação ou de desobediência, conforme o caso.

        § 3º Para garantir a efetividade das medidas protetivas de urgência, poderá o juiz requisitar, a qualquer momento, auxílio da força policial.

        § 4º Na aplicação das medidas protetivas de urgência, o juiz concederá a tutela específica ou determinará providências que assegurem a obtenção de tutela pelo resultado prático equivalente.

        § 5º.

        § 6º A aplicação da medida prevista no inciso VIII do caput deste artigo terá prioridade nos casos em que houver descumprimento de medidas protetivas anteriormente impostas ou quando for verificado risco iminente à integridade física ou psicológica da vítima.

        § 7º Para a efetivação da medida prevista no inciso VIII do caput deste artigo, a autoridade competente promoverá a instalação do equipamento e instruirá o agressor sobre o seu funcionamento e as áreas de exclusão onde não poderá circular, conforme definido na decisão da autoridade judicial, devendo a ciência constar de termo nos autos.

        § 8º O sistema de monitoração eletrônica de que trata o inciso VIII do caput deste artigo deverá emitir alerta automático e simultâneo à vítima e à unidade policial mais próxima sempre que o agressor romper o perímetro de exclusão fixado judicialmente.

        § 9º Nos casos previstos no § 6º deste artigo, a decisão judicial que deixar de aplicar a medida protetiva de monitoração eletrônica deverá apresentar fundamentação expressa quanto às razões da não aplicação da medida.

        § 10 As medidas protetivas de natureza cível, inclusive as de prestação de alimentos provisionais ou provisórios, constituem título executivo judicial de pleno direito, dispensando a propositura de ação principal.'
