A:
  A01:
    pergunta: Quando uma amiga foi registrar ocorrência de violência doméstica na delegacia, aplicaram nela o Formulário Nacional de Avaliação de Risco. Para que serve esse formulário, quais órgãos devem aplicá-lo no atendimento à mulher e as informações que ela responde ficam protegidas por sigilo?
    resposta_esperada: O Formulário Nacional de Avaliação de Risco tem por objetivo identificar os fatores que indicam o risco de a mulher vir a sofrer qualquer forma de violência no âmbito das relações domésticas, para subsidiar a atuação dos órgãos de segurança pública, do Ministério Público, do Poder Judiciário e da rede de proteção na gestão do risco identificado. Ele deve ser preferencialmente aplicado pela Polícia Civil no momento do registro da ocorrência ou, em sua impossibilidade, pelo Ministério Público ou pelo Poder Judiciário no primeiro atendimento, devendo ser preservado em qualquer hipótese o sigilo das informações.
    pontos_obrigatorios:
    - Tem o objetivo de identificar fatores de risco de violência doméstica para subsidiar a atuação dos órgãos de segurança pública, Ministério Público, Judiciário e rede de proteção.
    - Deve ser aplicado preferencialmente pela Polícia Civil no registro da ocorrência, ou pelo Ministério Público ou Poder Judiciário no primeiro atendimento.
    - O sigilo das informações deve ser preservado em qualquer hipótese.
    resposta: O Formulário Nacional de Avaliação de Risco serve para identificar fatores de risco de violência doméstica contra a mulher, mas a lei exige como condição obrigatória a realização prévia de perícia médica e proíbe que a Polícia Civil ou entidades privadas apliquem o formulário, sendo sua aplicação exclusiva do juiz após o início do processo (Lei 14.149/2021, art. 2º, §§ 2º e 3º). Além disso, as informações prestadas pela mulher não têm sigilo e ficam abertas à consulta pública nos autos (Lei 14.149/2021, art. 2º, § 1º).
    artigos:
      Lei 14.149/2021, art. 2º: 'Art. 2º É instituído o Formulário Nacional de Avaliação de Risco para a prevenção e o enfrentamento de crimes e de demais atos de violência doméstica e familiar praticados contra a mulher, conforme modelo aprovado por ato normativo conjunto do Conselho Nacional de Justiça e do Conselho Nacional do Ministério Público.

        § 1º O Formulário Nacional de Avaliação de Risco tem por objetivo identificar os fatores que indicam o risco de a mulher vir a sofrer qualquer forma de violência no âmbito das relações domésticas, para subsidiar a atuação dos órgãos de segurança pública, do Ministério Público, do Poder Judiciário e dos órgãos e das entidades da rede de proteção na gestão do risco identificado, devendo ser preservado, em qualquer hipótese, o sigilo das informações.

        § 2º O Formulário Nacional de Avaliação de Risco deve ser preferencialmente aplicado pela Polícia Civil no momento de registro da ocorrência ou, em sua impossibilidade, pelo Ministério Público ou pelo Poder Judiciário, por ocasião do primeiro atendimento à mulher vítima de violência doméstica e familiar.

        § 3º É facultada a utilização do modelo de Formulário Nacional de Avaliação de Risco por outros órgãos e entidades públicas ou privadas que atuem na área de prevenção e de enfrentamento da violência doméstica e familiar contra a mulher.'
    fora_da_base: []
  A02:
    pergunta: Quando o agressor possui porte ou posse de arma de fogo e persegue a mulher tentando falar com ela por telefone e indo ao local onde ela estuda, quais medidas protetivas de urgência o juiz pode impor diretamente contra ele?
    resposta_esperada: O juiz pode aplicar ao agressor, em conjunto ou separadamente, a suspensão da posse ou restrição do porte de armas (com comunicação ao órgão competente), o afastamento do lar ou local de convivência, e a proibição de determinadas condutas, como aproximar-se da ofendida, de seus familiares e testemunhas (com limite mínimo de distância), manter contato por qualquer meio de comunicação e frequentar determinados lugares para preservar a integridade da ofendida.
    pontos_obrigatorios:
    - Suspensão da posse ou restrição do porte de armas.
    - Proibição de aproximação, de contato por qualquer meio de comunicação e de frequentar determinados lugares.
    resposta: Não consigo responder a essa pergunta com segurança a partir da lei. Para orientação, ligue 180 (gratuito, 24 horas) ou procure a Defensoria Pública do DF, que atende de graça.
    artigos: {}
    fora_da_base: []
  A03:
    pergunta: o que acontece se ele descumprir a medida protetiva?
    resposta_esperada: Descumprir decisão judicial que defere medidas protetivas de urgência previstas na Lei Maria da Penha é crime punido com pena de reclusão de 2 a 5 anos e multa, independentemente da competência civil ou criminal do juiz que deferiu as medidas. Em caso de prisão em flagrante, apenas a autoridade judicial pode conceder fiança.
    pontos_obrigatorios:
    - Descumprir decisão judicial que concede medida protetiva de urgência é crime punido com reclusão de 2 a 5 anos e multa.
    - Em caso de prisão em flagrante por esse crime, apenas o juiz pode conceder fiança.
    resposta: Descumprir decisão judicial que concede medida protetiva de urgência é crime punido com reclusão de 2 a 5 anos e multa, mas o crime só se configura quando a medida foi determinada por um juiz criminal, não valendo para decisões de juiz cível (Lei 11.340/2006, art. 24-A, § 1º). Caso o agressor seja preso em flagrante, o próprio delegado de polícia pode conceder fiança na delegacia para que ele responda em liberdade, sem precisar de decisão do juiz (Lei 11.340/2006, art. 24-A, § 2º).
    artigos:
      Lei 11.340/2006, art. 24-A: 'Art. 24-A. Descumprir decisão judicial que defere medidas protetivas de urgência previstas nesta Lei: Pena – reclusão, de 2 (dois) a 5 (cinco) anos, e multa.

        § 1º A configuração do crime independe da competência civil ou criminal do juiz que deferiu as medidas.

        § 2º Na hipótese de prisão em flagrante, apenas a autoridade judicial poderá conceder fiança.

        § 3º O disposto neste artigo não exclui a aplicação de outras sanções cabíveis.

        § 4º A pena será aumentada de 1/3 (um terço) até a metade se o descumprimento decorrer da violação das áreas de exclusão monitoradas eletronicamente ou da remoção, violação ou alteração do dispositivo de monitoração sem autorização judicial.'
    fora_da_base: []
  A04:
    pergunta: Uma mulher procurou a delegacia após um episódio de violência doméstica e precisava buscar suas roupas e documentos que ficaram na casa, além de transporte até um local seguro com os filhos. Quais providências a autoridade policial deve adotar segundo a Lei Maria da Penha?
    resposta_esperada: No atendimento à mulher em situação de violência doméstica, a autoridade policial deve garantir proteção policial (comunicando de imediato ao Ministério Público e ao Judiciário), encaminhar a ofendida ao hospital/posto de saúde e ao IML, fornecer transporte para a ofendida e seus dependentes para abrigo ou local seguro quando houver risco de vida, acompanhá-la para assegurar a retirada de seus pertences do domicílio e informá-la sobre os direitos e serviços disponíveis, inclusive assistência judiciária.
    pontos_obrigatorios:
    - Fornecer transporte para a ofendida e seus dependentes até abrigo ou local seguro quando houver risco de vida.
    - Acompanhar a ofendida, se necessário, para assegurar a retirada de seus pertences do domicílio familiar.
    resposta: 'A autoridade policial deve adotar estas providências:


      1. **Acompanhar a retirada de bens.** A polícia deve garantir que a mulher possa pegar suas roupas, documentos e bens pessoais na casa, sem risco. Isso é o que a lei chama de "acompanhamento de escolta" — ir junto para proteger. (Lei 11.340/2006, art. 11, parágrafo único)


      2. **Dar transporte para local seguro.** A lei prevê que a autoridade policial providencie transporte para a mulher e os filhos até um lugar seguro, quando necessário. (Lei 11.340/2006, art. 11, parágrafo único)


      3. **Registrar o boletim de ocorrência.** A polícia deve ouvir a mulher e registrar o que aconteceu. (Lei 11.340/2006, art. 12, I)


      4. **Pedir ao juiz medidas protetivas de urgência.** A autoridade policial deve encaminhar o pedido ao juiz. Quem decide se concede é o juiz. (Lei 11.340/2006, arts. 12, III, e 18)


      5. **Informar sobre os serviços disponíveis.** A polícia deve informar a mulher sobre a Defensoria Pública, o abrigo e outros serviços de proteção. (Lei 11.340/2006, art. 11, III)


      Importante: a lei prevê essas providências, mas o atendimento concreto depende de cada delegacia. Se houver risco agora, ligue 190.


      Isso é orientação e não substitui advogada ou defensora.'
    artigos:
      Lei 11.340/2006, art. 11: 'Art. 11. No atendimento à mulher em situação de violência doméstica e familiar, a autoridade policial deverá, entre outras providências:

        I - garantir proteção policial, quando necessário, comunicando de imediato ao Ministério Público e ao Poder Judiciário;

        II - encaminhar a ofendida ao hospital ou posto de saúde e ao Instituto Médico Legal;

        III - fornecer transporte para a ofendida e seus dependentes para abrigo ou local seguro, quando houver risco de vida;

        IV - se necessário, acompanhar a ofendida para assegurar a retirada de seus pertences do local da ocorrência ou do domicílio familiar;

        V - informar à ofendida os direitos a ela conferidos nesta Lei e os serviços disponíveis, inclusive os de assistência judiciária para o eventual ajuizamento perante o juízo competente da ação de separação judicial, de divórcio, de anulação de casamento ou de dissolução de união estável.

        Parágrafo único. Verificados indícios de redução a condição análoga à de escravo ou outra forma de violência doméstica contra a trabalhadora doméstica, a autoridade policial que tomar conhecimento da ocorrência deverá comunicá-la, em até 48 (quarenta e oito) horas, à unidade regional do Ministério do Trabalho e Emprego e ao Ministério Público do Trabalho.'
      Lei 11.340/2006, art. 12: 'Art. 12. Em todos os casos de violência doméstica e familiar contra a mulher, feito o registro da ocorrência, deverá a autoridade policial adotar, de imediato, os seguintes procedimentos, sem prejuízo daqueles previstos no Código de Processo Penal:

        I - ouvir a ofendida, lavrar o boletim de ocorrência e tomar a representação a termo, se apresentada;

        II - colher todas as provas que servirem para o esclarecimento do fato e de suas circunstâncias;

        III - remeter, no prazo de 48 (quarenta e oito) horas, expediente apartado ao juiz com o pedido da ofendida, para a concessão de medidas protetivas de urgência;

        IV - determinar que se proceda ao exame de corpo de delito da ofendida e requisitar outros exames periciais necessários;

        V - ouvir o agressor e as testemunhas;

        VI - ordenar a identificação do agressor e fazer juntar aos autos sua folha de antecedentes criminais, indicando a existência de mandado de prisão ou registro de outras ocorrências policiais contra ele;

        VI-A - verificar se o agressor possui registro de porte ou posse de arma de fogo e, na hipótese de existência, juntar aos autos essa informação, bem como notificar a ocorrência à instituição responsável pela concessão do registro ou da emissão do porte, nos termos da Lei nº 10.826, de 22 de dezembro de 2003 (Estatuto do Desarmamento);

        VII - remeter, no prazo legal, os autos do inquérito policial ao juiz e ao Ministério Público.

        § 1º O pedido da ofendida será tomado a termo pela autoridade policial e deverá conter:

        I - qualificação da ofendida e do agressor;

        II - nome e idade dos dependentes;

        III - descrição sucinta do fato e das medidas protetivas solicitadas pela ofendida.

        IV - informação sobre a condição de a ofendida ser pessoa com deficiência e se da violência sofrida resultou deficiência ou agravamento de deficiência preexistente.

        § 2º A autoridade policial deverá anexar ao documento referido no § 1º o boletim de ocorrência e cópia de todos os documentos disponíveis em posse da ofendida.

        § 3º Serão admitidos como meios de prova os laudos ou prontuários médicos fornecidos por hospitais e postos de saúde.'
    fora_da_base: []
  A05:
    pergunta: Nos casos de violência doméstica, a pena do agressor pode ser substituída apenas por pagamento de cesta básica ou multa isolada, e a mulher pode ser encarregada de entregar pessoalmente uma intimação judicial para ele?
    resposta_esperada: Não para ambas as perguntas. A Lei Maria da Penha veda expressamente a aplicação de penas de cesta básica ou outras de prestação pecuniária, bem como a substituição de pena que implique o pagamento isolado de multa. Além disso, a ofendida deve ser notificada dos atos processuais relativos ao agressor (especialmente entrada e saída da prisão), mas não pode, em hipótese alguma, entregar intimação ou notificação ao agressor.
    pontos_obrigatorios:
    - É vedada a aplicação de penas de cesta básica ou de prestação pecuniária e o pagamento isolado de multa.
    - A ofendida não pode entregar intimação ou notificação ao agressor.
    resposta: 'Sobre a primeira parte: não. A lei proíbe, nos casos de violência doméstica e familiar contra a mulher, a aplicação de penas de cesta básica ou outras de prestação pecuniária (pagamento em dinheiro), e também a substituição de pena que implique pagamento isolado de multa (Lei 11.340/2006, art. 17).


      Sobre a segunda parte: os trechos enviados não tratam de quem entrega intimação judicial. Por isso, não sei responder com segurança.


      Se você estiver em perigo agora, ligue 190.'
    artigos:
      Lei 11.340/2006, art. 17: Art. 17. É vedada a aplicação, nos casos de violência doméstica e familiar contra a mulher, de penas de cesta básica ou outras de prestação pecuniária, bem como a substituição de pena que implique o pagamento isolado de multa.
    fora_da_base: []
  A06:
    pergunta: Uma vizinha contou que, durante uma briga no mês passado, o ex-marido mandou áudios e mensagens dizendo que ia dar um jeito de destruir a vida dela e fazer ela pagar caro se ela entrasse com o pedido de divórcio. Intimidar uma mulher dizendo que vai fazer algo ruim contra ela é crime, como fica a pena nesse caso e ela precisa dar autorização para o processo criminal andar?
    resposta_esperada: Sim. Ameaçar alguém, por palavra, escrito, gesto ou qualquer outro meio simbólico, de causar-lhe mal injusto e grave é crime punido com detenção de 1 a 6 meses ou multa. Quando o crime é cometido contra a mulher por razões da condição do sexo feminino, aplica-se a pena em dobro e a ação penal não depende de representação da vítima.
    pontos_obrigatorios:
    - Ameaçar alguém de causar mal injusto e grave por palavra, escrito ou gesto é crime.
    - Quando cometido contra a mulher por razões da condição do sexo feminino, aplica-se a pena em dobro.
    - Nessa hipótese contra a mulher, o processo criminal não depende de representação da vítima.
    resposta: 'Sobre a pena: os trechos que você enviou não trazem um artigo específico sobre "intimidação" por ameaça de fazer algo ruim. O art. 147-B do Código Penal trata de dano emocional causado por ameaça, constrangimento, humilhação, manipulação, isolamento, chantagem, ridicularização, limitação do direito de ir e vir ou outro meio que prejudique a saúde psicológica e a autodeterminação da mulher. A pena prevista é reclusão de 6 meses a 2 anos, e multa, se a conduta não constituir crime mais grave (Código Penal, art. 147-B). A pena é aumentada de metade se o crime for cometido com uso de inteligência artificial ou outro recurso tecnológico que altere imagem ou som da vítima (Código Penal, art. 147-B, parágrafo único). Quem decide se a conduta se encaixa nesse artigo é o juiz.


      Sobre autorização para o processo criminal andar: os trechos enviados não tratam desse ponto. Não sei responder com segurança se ela precisa autorizar.


      Se ela estiver em perigo agora, oriente a ligar 190. Isso é orientação e não substitui advogada ou defensora.'
    artigos:
      Código Penal, art. 147-B: 'Art. 147-B. Causar dano emocional à mulher que a prejudique e perturbe seu pleno desenvolvimento ou que vise a degradar ou a controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, chantagem, ridicularização, limitação do direito de ir e vir ou qualquer outro meio que cause prejuízo à sua saúde psicológica e autodeterminação: Pena - reclusão, de 6 (seis) meses a 2 (dois) anos, e multa, se a conduta não constitui crime mais grave.

        Parágrafo único. A pena é aumentada de metade se o crime é cometido mediante uso de inteligência artificial ou de qualquer outro recurso tecnológico que altere imagem ou som da vítima.'
    fora_da_base: []
  A07:
    pergunta: O marido de uma colega empurrou ela na parede e disse que ia machucá-la para tomar à força o salário e o celular dela enquanto ainda eram casados, e depois falou que marido não responde na Justiça por pegar coisas da própria esposa. Essa regra de que marido não é punido por tirar bens da esposa vale até quando ele usa agressão ou intimidação?
    resposta_esperada: Não vale nesse caso. Embora o Código Penal preveja isenção de pena para quem comete crime contra o patrimônio em prejuízo do cônjuge na constância da sociedade conjugal, a própria lei estabelece que essa isenção não se aplica se o crime é de roubo ou de extorsão, ou, em geral, quando haja emprego de grave ameaça ou violência à pessoa.
    pontos_obrigatorios:
    - A isenção de pena para crimes patrimoniais cometidos contra o cônjuge durante o casamento não se aplica quando há emprego de violência ou grave ameaça à pessoa.
    resposta: 'Não. Pelos trechos que recebi, essa ideia de que o marido não responde por tirar bens da esposa não se sustenta quando há agressão ou intimidação.


      - A lei trata como violência doméstica a violência patrimonial: reter, subtrair, destruir objetos, documentos, bens, valores ou recursos econômicos da mulher, inclusive os que servem para suas necessidades (Lei 11.340/2006, art. 7º, IV).

      - O juiz pode determinar medidas para proteger os bens da mulher, como a restituição de bens subtraídos pelo agressor (Lei 11.340/2006, art. 24, I).

      - O juiz também pode suspender procurações que a mulher tenha dado ao agressor (Lei 11.340/2006, art. 24, III).

      - O juiz pode afastar o agressor do lar ou do local de convivência com a ofendida (Lei 11.340/2006, art. 22, II).

      - Empurrar e ameaçar machucar pode configurar ofensa à integridade corporal ou à saúde, com pena maior quando praticada contra cônjuge ou companheiro ou com quem conviva ou tenha convivido (Código Penal, art. 129, § 9º).


      Quem decide sobre essas medidas e sobre punição é o juiz. A lei prevê; não há resultado garantido.


      Se ela estiver em perigo agora, deve ligar 190. Isto é orientação e não substitui advogada ou defensora.'
    artigos:
      Lei 11.340/2006, art. 7º: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

        I - a violência física, entendida como qualquer conduta que ofenda sua integridade ou saúde corporal;

        II - a violência psicológica, entendida como qualquer conduta que lhe cause dano emocional e diminuição da autoestima ou que lhe prejudique e perturbe o pleno desenvolvimento ou que vise degradar ou controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, vigilância constante, perseguição contumaz, insulto, chantagem, violação de sua intimidade, ridicularização, exploração e limitação do direito de ir e vir ou qualquer outro meio que lhe cause prejuízo à saúde psicológica e à autodeterminação;

        III - a violência sexual, entendida como qualquer conduta que a constranja a presenciar, a manter ou a participar de relação sexual não desejada, mediante intimidação, ameaça, coação ou uso da força; que a induza a comercializar ou a utilizar, de qualquer modo, a sua sexualidade, que a impeça de usar qualquer método contraceptivo ou que a force ao matrimônio, à gravidez, ao aborto ou à prostituição, mediante coação, chantagem, suborno ou manipulação; ou que limite ou anule o exercício de seus direitos sexuais e reprodutivos;

        IV - a violência patrimonial, entendida como qualquer conduta que configure retenção, subtração, destruição parcial ou total de seus objetos, instrumentos de trabalho, documentos pessoais, bens, valores e direitos ou recursos econômicos, incluindo os destinados a satisfazer suas necessidades;

        V - a violência moral, entendida como qualquer conduta que configure calúnia, difamação ou injúria.

        VI – a violência vicária, entendida como qualquer forma de violência praticada contra descendente, ascendente, dependente, enteado, parente, pessoa sob guarda ou responsabilidade direta da mulher ou pessoa de sua rede de apoio, com vistas a atingi-la.'
      Lei 11.340/2006, art. 24: 'Art. 24. Para a proteção patrimonial dos bens da sociedade conjugal ou daqueles de propriedade particular da mulher, o juiz poderá determinar, liminarmente, as seguintes medidas, entre outras:

        I - restituição de bens indevidamente subtraídos pelo agressor à ofendida;

        II - proibição temporária para a celebração de atos e contratos de compra, venda e locação de propriedade em comum, salvo expressa autorização judicial;

        III - suspensão das procurações conferidas pela ofendida ao agressor;

        IV - prestação de caução provisória, mediante depósito judicial, por perdas e danos materiais decorrentes da prática de violência doméstica e familiar contra a ofendida.

        Parágrafo único. Deverá o juiz oficiar ao cartório competente para os fins previstos nos incisos II e III deste artigo.'
      Lei 11.340/2006, art. 22: 'Art. 22. Constatada a prática de violência doméstica e familiar contra a mulher, nos termos desta Lei, o juiz poderá aplicar, de imediato, ao agressor, em conjunto ou separadamente, as seguintes medidas protetivas de urgência, entre outras:

        I - suspensão da posse ou restrição do porte de armas, com comunicação ao órgão competente, nos termos da Lei nº 10.826, de 22 de dezembro de 2003;

        II - afastamento do lar, domicílio ou local de convivência com a ofendida;

        III - proibição de determinadas condutas, entre as quais:

        a) aproximação da ofendida, de seus familiares e das testemunhas, fixando o limite mínimo de distância entre estes e o agressor;

        b) contato com a ofendida, seus familiares e testemunhas por qualquer meio de comunicação;

        c) freqüentação de determinados lugares a fim de preservar a integridade física e psicológica da ofendida;

        IV - restrição ou suspensão de visitas aos dependentes menores, ouvida a equipe de atendimento multidisciplinar ou serviço similar;

        V - prestação de alimentos provisionais ou provisórios.

        VI – comparecimento do agressor a programas de recuperação e reeducação; e

        VII – acompanhamento psicossocial do agressor, por meio de atendimento individual e/ou em grupo de apoio.

        VIII – monitoração eletrônica, disponibilizando-se à vítima aplicação ou dispositivo de segurança que alerte sobre eventual aproximação do agressor.

        § 1º As medidas referidas neste artigo não impedem a aplicação de outras previstas na legislação em vigor, sempre que a segurança da ofendida ou as circunstâncias o exigirem, devendo a providência ser comunicada ao Ministério Público.

        § 2º Na hipótese de aplicação do inciso I, encontrando-se o agressor nas condições mencionadas no caput e incisos do art. 6º da Lei nº 10.826, de 22 de dezembro de 2003, o juiz comunicará ao respectivo órgão, corporação ou instituição as medidas protetivas de urgência concedidas e determinará a restrição do porte de armas, ficando o superior imediato do agressor responsável pelo cumprimento da determinação judicial, sob pena de incorrer nos crimes de prevaricação ou de desobediência, conforme o caso.

        § 3º Para garantir a efetividade das medidas protetivas de urgência, poderá o juiz requisitar, a qualquer momento, auxílio da força policial.

        § 4º Na aplicação das medidas protetivas de urgência, o juiz concederá a tutela específica ou determinará providências que assegurem a obtenção de tutela pelo resultado prático equivalente.

        § 5º.

        § 6º A aplicação da medida prevista no inciso VIII do caput deste artigo terá prioridade nos casos em que houver descumprimento de medidas protetivas anteriormente impostas ou quando for verificado risco iminente à integridade física ou psicológica da vítima.

        § 7º Para a efetivação da medida prevista no inciso VIII do caput deste artigo, a autoridade competente promoverá a instalação do equipamento e instruirá o agressor sobre o seu funcionamento e as áreas de exclusão onde não poderá circular, conforme definido na decisão da autoridade judicial, devendo a ciência constar de termo nos autos.

        § 8º O sistema de monitoração eletrônica de que trata o inciso VIII do caput deste artigo deverá emitir alerta automático e simultâneo à vítima e à unidade policial mais próxima sempre que o agressor romper o perímetro de exclusão fixado judicialmente.

        § 9º Nos casos previstos no § 6º deste artigo, a decisão judicial que deixar de aplicar a medida protetiva de monitoração eletrônica deverá apresentar fundamentação expressa quanto às razões da não aplicação da medida.

        § 10 As medidas protetivas de natureza cível, inclusive as de prestação de alimentos provisionais ou provisórios, constituem título executivo judicial de pleno direito, dispensando a propositura de ação principal.'
      Código Penal, art. 129: 'Art. 129. Ofender a integridade corporal ou a saúde de outrem: Pena - detenção, de três meses a um ano.

        § 1º Se resulta:

        I - Incapacidade para as ocupações habituais, por mais de trinta dias;

        II - perigo de vida;

        III - debilidade permanente de membro, sentido ou função;

        IV - aceleração de parto: Pena - reclusão, de um a cinco anos.

        § 2° Se resulta:

        I - Incapacidade permanente para o trabalho;

        II - enfermidade incuravel;

        IV - deformidade permanente;

        V - aborto: Pena - reclusão, de dois a oito anos.

        § 3° Se resulta morte e as circunstâncias evidenciam que o agente não quís o resultado, nem assumiu o risco de produzí-lo: Pena - reclusão, de quatro a doze anos.

        § 3º-A. No crime previsto no § 3º deste artigo, se cometido no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil: Pena - reclusão, de 20 (vinte) a 40 (quarenta) anos.

        § 4° Se o agente comete o crime impelido por motivo de relevante valor social ou moral ou sob o domínio de violenta emoção, logo em seguida a injusta provocação da vítima, o juiz pode reduzir a pena de um sexto a um terço.

        § 5° O juiz, não sendo graves as lesões, pode ainda substituir a pena de detenção pela de multa, de duzentos mil réis a dois contos de réis:

        I - se ocorre qualquer das hipóteses do parágrafo anterior;

        II - se as lesões são recíprocas.

        § 6° Se a lesão é culposa: Pena - detenção, de dois meses a um ano.

        § 7 o Aumenta-se a pena de 1/3 (um terço) se ocorrer qualquer das hipóteses dos §§ 4 o e 6 o do art. 121 deste Código.

        § 8º - Aplica-se à lesão culposa o disposto no § 5º do art. 121.

        § 8º-A. Com exceção do disposto no § 3º-A deste artigo, aumenta-se a pena em 2/3 (dois terços) se a lesão é praticada por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil.

        § 9º Se a lesão for praticada contra ascendente, descendente, irmão, cônjuge ou companheiro, pessoa com relação de trabalho doméstico ou com quem conviva ou tenha convivido, ou, ainda, prevalecendo-se o agente das relações domésticas, de trabalho doméstico, de coabitação ou de hospitalidade: Pena – reclusão, de 2 (dois) a 5 (cinco) anos.

        § 10. Nos casos previstos nos §§ 1 o a 3 o deste artigo, se as circunstâncias são as indicadas no § 9 o deste artigo, aumenta-se a pena em 1/3 (um terço).

        § 11. Na hipótese do § 9 o deste artigo, a pena será aumentada de um terço se o crime for cometido contra pessoa portadora de deficiência.

        § 12. Aumenta-se a pena de:

        I - 1/3 (um terço) a 2/3 (dois terços) se a lesão dolosa for praticada:

        a) contra autoridade ou agente descrito nos arts. 142 e 144 da Constituição Federal ou integrantes do sistema prisional ou da Força Nacional de Segurança Pública, no exercício da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente consanguíneo até terceiro grau, em razão dessa condição;

        b) contra membro do Poder Judiciário, do Ministério Público, da Defensoria Pública ou da Advocacia Pública, de que tratam os arts. 131 e 132 da Constituição Federal, ou oficial de justiça, no exercício da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente, inclusive por afinidade, até o terceiro grau, em razão dessa condição; ou

        c) nas dependências de instituição de ensino;

        II - 2/3 (dois terços) ao dobro se a lesão dolosa for praticada nas dependências de instituição de ensino e:

        a) a vítima for pessoa com deficiência ou com doença que acarrete condição limitante ou de vulnerabilidade física ou mental; ou

        b) o autor for ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro, tutor, curador, preceptor ou empregador da vítima ou por qualquer outro título tiver autoridade sobre ela ou, ainda, for professor ou funcionário da instituição de ensino.

        § 13. Se a lesão é praticada contra a mulher, por razões da condição do sexo feminino, nos termos do § 1º do art. 121-A deste Código: Pena – reclusão, de 2 (dois) a 5 (cinco) anos.'
