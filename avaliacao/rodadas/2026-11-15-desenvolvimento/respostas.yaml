- id: dv-001
  tipo: pergunta
  categoria: violencia_e_protecao
  pergunta: ele nunca me bateu, só quebrou minhas coisas e me humilhou, isso conta?
  rag:
    resposta: 'Sim, conta. A lei prevê essas condutas como formas de violência doméstica.


      - Quebrar suas coisas é violência patrimonial: retenção, subtração ou destruição de objetos, documentos, bens e recursos (Lei 11.340/2006, art. 7º, IV).

      - Humilhar e diminuir você é violência psicológica: conduta que causa dano emocional e diminuição da autoestima, por meio de humilhação, insulto, ridicularização, entre outros meios (Lei 11.340/2006, art. 7º, II).

      - Bater é violência física: conduta que ofenda a integridade ou a saúde corporal (Lei 11.340/2006, art. 7º, I).


      Violência psicológica é o dano emocional causado por palavras e atitudes que humilham ou controlam. Violência patrimonial é destruir ou reter seus bens e documentos.


      Nesses casos de violência doméstica, não se aplica a Lei 9.099/1995, que trata dos juizados especiais (Lei 11.340/2006, art. 41).


      Quem decide sobre medidas de proteção é o juiz. Eu não sei responder com segurança sobre o que você deve pedir nem sobre o resultado do seu caso. Procure uma advogada ou a Defensoria Pública.


      Se você estiver em perigo agora, ligue 190.'
    recusada: false
    citacoes:
    - Lei 11.340/2006, art. 7º
    - Lei 11.340/2006, art. 41
  sem_rag:
    resposta: 'Sim, conta. A lei não fala só de agressão física.


      **Violência patrimonial** é quando alguém quebra, esconde ou destrói seus objetos, documentos ou bens (Lei 11.340/2006, art. 7º, inciso IV). Quebrar suas coisas entra aí.


      **Violência moral** é quando alguém faz xingamento, calúnia ou difamação contra você (Lei 11.340/2006, art. 7º, inciso V). Humilhar e ofender entra aí.


      **Violência psicológica** é quando alguém causa dano emocional, diminui sua autoestima ou controla suas ações (Lei 11.340/2006, art. 7º, inciso II). Também pode se encaixar no seu caso.


      Quem decide se houve violência e se dá medida protetiva é o juiz. Ele pode conceder medidas protetivas de urgência, como afastamento do agressor (Lei 11.340/2006, arts. 18 e 22).


      Você pode procurar a Delegacia da Mulher ou a Defensoria Pública para orientação. Isso não substitui advogada ou defensora.


      Se você estiver em perigo agora, ligue 190.'
- id: dv-002
  tipo: pergunta
  categoria: violencia_e_protecao
  pergunta: meu companheiro controla todo o meu dinheiro e não me deixa trabalhar
  rag:
    resposta: 'Controlar todo o seu dinheiro e impedir você de trabalhar pode ser violência patrimonial. A lei define violência patrimonial como qualquer conduta que configure retenção, subtração, destruição parcial ou total de objetos, instrumentos de trabalho, documentos pessoais, bens, valores, direitos ou recursos econômicos, incluindo os destinados a satisfazer suas necessidades (Lei 11.340/2006, art. 7º, IV).


      "Retenção" significa segurar ou tomar algo que é seu e não devolver.


      Se você procurar a autoridade policial, a lei prevê que ela deve, entre outras providências, informar você sobre os direitos previstos na Lei e os serviços disponíveis, inclusive assistência judiciária (Lei 11.340/2006, art. 11, V).


      Quem decide sobre qualquer medida judicial é o juiz. Eu não posso garantir resultado.


      Se você estiver em perigo agora, ligue 190.


      Isto é orientação e não substitui advogada ou defensora.'
    recusada: false
    citacoes:
    - Lei 11.340/2006, art. 7º
    - Lei 11.340/2006, art. 11
  sem_rag:
    resposta: 'Isso é violência patrimonial. A lei prevê esse tipo de violência.


      Violência patrimonial é quando alguém controla, retém ou tira seus bens, dinheiro ou documentos (Lei 11.340/2006, art. 7º, inciso IV).


      Impedir você de trabalhar também é uma forma de violência. A lei trata do direito à autonomia econômica (Lei 11.340/2006, art. 7º, inciso IV).


      O que a lei prevê:

      - Você pode pedir medida protetiva de urgência. Medida protetiva é uma decisão rápida do juiz para proteger você. O juiz pode conceder, por exemplo, afastamento do agressor do lar e proibição de contato (Lei 11.340/2006, arts. 18 e 22).

      - A lei prevê atendimento pela Defensoria Pública e assistência jurídica gratuita (Lei 11.340/2006, art. 28).


      Quem decide é o juiz. Não há resultado garantido.


      Você pode procurar:

      - Delegacia da Mulher ou qualquer delegacia para registrar boletim de ocorrência.

      - Defensoria Pública ou advogada.

      - Ligue 180 para orientação gratuita.


      Se você estiver em perigo agora, ligue 190.


      Isso é orientação e não substitui advogada ou defensora.'
- id: dv-003
  tipo: pergunta
  categoria: crime
  pergunta: ele me xinga e me chama de burra na frente dos outros, isso é crime?
  rag:
    resposta: 'Xingar e chamar de "burra" na frente dos outros pode se encaixar no crime de injúria, que é ofender a dignidade ou o decoro de alguém. A pena prevista é detenção de um a seis meses, ou multa (Código Penal, art. 140).


      Explicando: injúria é ofender a honra da pessoa, sem imputar a ela um fato criminoso.


      O juiz pode deixar de aplicar a pena em algumas situações, por exemplo, quando a própria pessoa ofendida provocou diretamente a injúria de forma reprovável (Código Penal, art. 140, § 1º, I).


      Se a injúria for feita com violência ou vias de fato consideradas aviltantes, a pena é maior: detenção de três meses a um ano, e multa, além da pena correspondente à violência (Código Penal, art. 140, § 2º).


      Esses xingamentos também podem ser uma forma de violência doméstica e familiar contra a mulher, pois a lei trata como violência física qualquer conduta que ofenda a integridade ou a saúde corporal (Lei 11.340/2006, art. 7º, I).


      Quem decide se há crime e qual pena aplicar é o juiz. Eu não posso garantir resultado.


      Se você estiver em perigo agora, ligue 190.'
    recusada: false
    citacoes:
    - Código Penal, art. 140
    - Lei 11.340/2006, art. 7º
  sem_rag:
    resposta: 'Xingar e humilhar não é "só briga". A lei trata isso como violência.


      A Lei Maria da Penha lista a violência moral e a violência psicológica (Lei 11.340/2006, art. 7º, incisos II e V).


      Violência moral é ofender a honra, como xingar e humilhar. Violência psicológica é causar dano emocional, diminuir a autoestima e controlar o comportamento.


      Chamar de "burra" na frente dos outros pode se encaixar nesses dois tipos.


      Existe também o crime de injúria, que é ofender a dignidade de alguém (Código Penal, art. 140). Na violência doméstica, a pena é maior (Lei 11.340/2006, art. 7º e Código Penal, art. 141, inciso III).


      Quem decide se é crime e se há punição é o juiz. A lei prevê essas proteções, mas não há resultado garantido.


      Você pode registrar boletim de ocorrência e pedir medida protetiva. O juiz pode conceder, se entender que há risco (Lei 11.340/2006, arts. 18 e 19).


      Isso é orientação. Não substitui advogada ou defensora.


      Se você estiver em perigo agora, ligue 190.'
- id: dv-004
  tipo: pergunta
  categoria: violencia_e_protecao
  pergunta: meu namorado não mora comigo, a Lei Maria da Penha vale pra mim?
  rag:
    resposta: Não consigo responder a essa pergunta com segurança a partir da lei. Para orientação, ligue 180 (gratuito, 24 horas) ou procure a Defensoria Pública do DF, que atende de graça.
    recusada: true
    citacoes: []
  sem_rag:
    resposta: 'Sim, pode valer. A lei protege a mulher em relação afetiva de namoro, mesmo sem morar junto. Não precisa ter moradia comum nem filhos. (Lei 11.340/2006, art. 5º)


      O que a lei prevê: ela serve para qualquer relação íntima de afeto, inclusive namoro. Quem decide se o caso se encaixa é o juiz, ao analisar a situação concreta.


      Se você sofre violência, pode pedir medida protetiva de urgência. O juiz pode conceder, se entender que há risco. (Lei 11.340/2006, arts. 18 e 19)


      Violência não é só agressão física. Também inclui violência psicológica, moral, sexual e patrimonial. (Lei 11.340/2006, art. 7º)


      Se estiver em perigo agora, ligue 190. Para orientação, procure a Defensoria Pública ou a Delegacia da Mulher. Eu não substituo advogada ou defensora.'
- id: dv-005
  tipo: pergunta
  categoria: medidas_protetivas
  pergunta: o que é medida protetiva e como eu peço?
  rag:
    resposta: '**O que é medida protetiva**


      É uma decisão do juiz para proteger você. O juiz pode aplicar medidas ao agressor, como prestação de alimentos provisionais — uma ajuda de custo temporária para o seu sustento (Lei 11.340/2006, art. 22, V).


      **Como pedir**


      Você pode pedir. A lei diz que as medidas podem ser concedidas pelo juiz a pedido da ofendida — ou seja, a seu pedido — ou a requerimento do Ministério Público (Lei 11.340/2006, art. 19).


      O juiz pode conceder de imediato, sem ouvir antes as partes nem o Ministério Público, que depois é comunicado (Lei 11.340/2006, art. 19, § 1º).


      Não é preciso que a violência já tenha um tipo penal definido, nem ação penal ou cível, nem inquérito, nem boletim de ocorrência para o juiz conceder (Lei 11.340/2006, art. 19, § 5º).


      Depois de concedida, a medida é registrada em banco de dados do Conselho Nacional de Justiça (Lei 11.340/2006, art. 38-A).


      **Importante**


      Se o agressor descumprir a decisão, isso é crime, com pena de reclusão de 2 a 5 anos e multa (Lei 11.340/2006, art. 24-A).


      Eu não sei responder com segurança, com base apenas nesses trechos, qual é o passo a passo prático para fazer o pedido (onde e como protocolar). Para isso, procure uma advogada ou a Defensoria Pública.


      Se você estiver em perigo agora, ligue 190.'
    recusada: false
    citacoes:
    - Lei 11.340/2006, art. 22
    - Lei 11.340/2006, art. 19
    - Lei 11.340/2006, art. 38-A
    - Lei 11.340/2006, art. 24-A
  sem_rag:
    resposta: '**Medida protetiva** é uma decisão do juiz para proteger você. Ela serve para afastar o agressor e evitar que ele se aproxime. A lei prevê várias medidas (Lei 11.340/2006, art. 22).


      **Exemplos do que o juiz pode determinar:**

      - Afastamento do agressor do lar (Lei 11.340/2006, art. 22, II).

      - Proibição de aproximação de você, de familiares e de testemunhas, com limite mínimo de distância (Lei 11.340/2006, art. 22, III).

      - Proibição de contato por qualquer meio (Lei 11.340/2006, art. 22, III).

      - Restrição ou suspensão de visitas aos filhos (Lei 11.340/2006, art. 22, IV).


      **Como pedir:**

      1. Você pode pedir na delegacia, no Ministério Público ou direto ao juiz (Lei 11.340/2006, art. 19).

      2. O pedido pode ser feito pela própria mulher, sem advogado, ou por advogada ou defensora pública (Lei 11.340/2006, art. 27).

      3. O juiz deve decidir em até 48 horas sobre o pedido (Lei 11.340/2006, art. 18).

      4. O juiz pode conceder a medida de imediato, mesmo sem ouvir o agressor antes (Lei 11.340/2006, art. 22, caput).


      Quem decide se concede é o juiz. A lei prevê esse caminho, mas não há garantia de resultado.


      Se você estiver em perigo agora, ligue 190.


      Isso é orientação e não substitui advogada ou defensora.'
- id: dv-006
  tipo: pergunta
  categoria: medidas_protetivas
  pergunta: o juiz pode proibir ele de chegar perto de mim?
  rag:
    resposta: 'Sim. A lei prevê que o juiz pode proibir o agressor de se aproximar de você, dos seus familiares e das testemunhas, fixando uma distância mínima (Lei 11.340/2006, art. 22, inciso III, alínea "a").


      "Medida protetiva de urgência" é uma decisão rápida do juiz para proteger você.


      O juiz também pode proibir contato com você por qualquer meio de comunicação (Lei 11.340/2006, art. 22, inciso III, alínea "b") e proibir que ele frequente certos lugares para preservar sua integridade física e psicológica (Lei 11.340/2006, art. 22, inciso III, alínea "c").


      Quem decide é o juiz. A lei prevê essas medidas, mas não há garantia de que serão concedidas.


      Se você estiver em perigo agora, ligue 190.


      Isto é orientação e não substitui advogada ou defensora.'
    recusada: false
    citacoes:
    - Lei 11.340/2006, art. 22
  sem_rag:
    resposta: 'Sim. A lei prevê que o juiz pode aplicar medidas protetivas de urgência. Uma delas é a proibição de aproximação da ofendida. Isso inclui manter uma distância mínima de você (Lei 11.340/2006, art. 22, inciso III, alínea "a").


      "Medida protetiva de urgência" é uma decisão rápida do juiz para proteger você.


      Quem decide é o juiz. Ele pode conceder se entender que há risco à sua integridade. A lei também prevê que ele pode proibir o contato com você por qualquer meio de comunicação (Lei 11.340/2006, art. 22, inciso III, alínea "b").


      Se você estiver em perigo agora, ligue 190.


      Isso é orientação e não substitui advogada ou defensora.'
- id: dv-007
  tipo: pergunta
  categoria: auxilio_fonar_trabalho
  pergunta: tenho direito a auxílio-aluguel se eu sair de casa com meus filhos?
  rag:
    resposta: 'A lei prevê que o juiz **pode** conceder auxílio-aluguel à ofendida, com valor fixado conforme a situação de vulnerabilidade social e econômica, por período de até 6 meses (Lei 11.340/2006, art. 23, VI). Quem decide é o juiz.


      A lei também prevê que o juiz pode determinar o afastamento da ofendida do lar, sem prejuízo dos direitos relativos a bens, guarda dos filhos e alimentos (Lei 11.340/2006, art. 23, III).


      Sobre os filhos na escola: a mulher em situação de violência tem prioridade para matricular os dependentes em instituição de educação básica mais próxima do domicílio, ou transferi-los, mediante apresentação dos documentos do registro da ocorrência policial ou do processo em curso (Lei 11.340/2006, art. 9º, § 7º). O juiz também pode determinar essa matrícula ou transferência, independentemente de vaga (Lei 11.340/2006, art. 23, V).


      Isso é orientação e não substitui advogada ou defensora. Se você estiver em perigo agora, ligue 190.'
    recusada: false
    citacoes:
    - Lei 11.340/2006, art. 23
    - Lei 11.340/2006, art. 9º
  sem_rag:
    resposta: 'Não posso dizer que você "tem direito" — quem decide é o juiz. Mas a lei prevê esse auxílio em alguns casos.


      O que a lei diz:

      - O juiz pode conceder auxílio-aluguel à mulher que sair do lar em situação de violência. O valor e o tempo ficam a critério do juiz (Lei 11.340/2006, art. 9º, § 4º).

      - Esse auxílio é uma medida protetiva de urgência. Medida protetiva é uma decisão rápida do juiz para proteger você (Lei 11.340/2006, art. 22, inciso V).

      - O pedido pode incluir seus filhos, que também são protegidos pela lei (Lei 11.340/2006, art. 22, caput).


      Pontos importantes:

      - Não é automático. Depende do pedido e da análise do juiz.

      - Costuma ser pedido junto com outras medidas protetivas.

      - Quem pode pedir por você: advogada, defensora pública ou a delegacia, que encaminha o pedido ao juiz (Lei 11.340/2006, art. 12).


      Se você está em perigo agora, ligue 190.


      Procure a Defensoria Pública ou uma advogada para avaliar seu caso. Eu oriento, mas não substituo advogada ou defensora.'
- id: dv-008
  tipo: pergunta
  categoria: medidas_protetivas
  pergunta: o que acontece se ele descumprir a medida protetiva?
  rag:
    resposta: 'Se ele descumprir uma medida protetiva de urgência, isso é crime. A lei prevê pena de reclusão de 2 a 5 anos, e multa (Lei 11.340/2006, art. 24-A).


      Reclusão é o tipo de pena em que a pessoa cumpre a pena em regime mais rigoroso, conforme a decisão do juiz.


      O crime existe mesmo que o juiz que concedeu a medida seja da área civil ou criminal (Lei 11.340/2006, art. 24-A, § 1º).


      Se ele for preso em flagrante, só uma autoridade judicial pode conceder fiança (Lei 11.340/2006, art. 24-A, § 2º). Fiança é o valor pago para responder ao processo em liberdade.


      Essa punição não impede outras sanções cabíveis (Lei 11.340/2006, art. 24-A, § 3º).


      A pena aumenta de um terço até a metade se o descumprimento envolver violação de áreas de exclusão monitoradas eletronicamente ou remoção, violação ou alteração do dispositivo de monitoração sem autorização judicial (Lei 11.340/2006, art. 24-A, § 4º).


      Quem decide sobre a pena é o juiz. Eu não posso garantir resultado.


      Se você estiver em perigo agora, ligue 190.


      Isto é orientação e não substitui advogada ou defensora.'
    recusada: false
    citacoes:
    - Lei 11.340/2006, art. 24-A
  sem_rag:
    resposta: 'Se ele descumprir a medida protetiva, isso é crime. A lei prevê pena de detenção de 3 meses a 2 anos (Lei 11.340/2006, art. 24-A).


      Você pode ligar 190 na hora. Também pode avisar o juiz do caso.


      O juiz pode aumentar as medidas de proteção. Pode também decretar a prisão preventiva, que é a prisão antes da sentença (Lei 11.340/2006, art. 20 e art. 313, III, do Código de Processo Penal).


      Quem decide isso é o juiz. A lei prevê essas providências, mas não há resultado garantido.


      Se você estiver em perigo agora, ligue 190.


      Isso é orientação. Não substitui advogada ou defensora.'
- id: dv-009
  tipo: pergunta
  categoria: policia_processo_defensoria
  pergunta: a polícia pode tirar ele de casa na hora se eu estiver correndo perigo?
  rag:
    resposta: 'Em alguns casos, sim. A lei prevê que o agressor seja afastado do lar imediatamente quando houver risco atual ou iminente à sua vida ou à sua integridade física, sexual, psicológica, moral ou patrimonial (Lei 11.340/2006, art. 12-C).


      Quem pode fazer esse afastamento:

      - A autoridade judicial, ou seja, o juiz ou juíza (Lei 11.340/2006, art. 12-C, I).

      - O delegado de polícia, quando o Município não for sede de comarca — comarca é a região onde o juiz atua (Lei 11.340/2006, art. 12-C, II).

      - O policial, quando o Município não for sede de comarca e não houver delegado disponível no momento da denúncia (Lei 11.340/2006, art. 12-C, III).


      Nesses dois últimos casos, o juiz é comunicado em até 24 horas e decide, no mesmo prazo, se mantém ou revoga a medida (Lei 11.340/2006, art. 12-C, § 1º).


      A lei também prevê que o agressor seja submetido à monitoração eletrônica — fiscalização por equipamento, como tornozeleira — quando verificado risco atual ou iminente (Lei 11.340/2006, art. 12-D).


      Ao registrar a ocorrência, a autoridade policial deve ouvir você e lavrar o boletim de ocorrência (Lei 11.340/2006, art. 12, I), e deve enviar ao juiz, em até 48 horas, seu pedido de medidas protetivas de urgência (Lei 11.340/2006, art. 12, III).


      Se você estiver em perigo agora, ligue 190.


      Isso é orientação e não substitui advogada ou defensora.'
    recusada: false
    citacoes:
    - Lei 11.340/2006, art. 12-C
    - Lei 11.340/2006, art. 12-D
    - Lei 11.340/2006, art. 12
  sem_rag:
    resposta: 'Se você está em perigo agora, ligue 190.


      Sobre a sua pergunta: a lei prevê que o juiz pode afastar o agressor do lar. Quem decide é o juiz, não a polícia na hora.


      - O afastamento do agressor do lar é uma medida protetiva que o juiz pode conceder (Lei 11.340/2006, art. 22, inciso II).

      - A polícia pode prender em flagrante quem está cometendo crime, inclusive violência doméstica (Lei 11.340/2006, art. 12, e Código de Processo Penal, art. 301). Prender em flagrante é quando a pessoa é pega no momento do crime ou logo depois.

      - Quando o juiz não está disponível, o delegado pode tomar medidas urgentes de proteção e depois comunicar o juiz em até 24 horas (Lei 11.340/2006, art. 12-C).


      Ou seja: na hora, a polícia pode prender em flagrante. O afastamento do lar por medida protetiva é decidido pelo juiz.


      Isso é orientação e não substitui advogada ou defensora.'
- id: dv-010
  tipo: pergunta
  categoria: policia_processo_defensoria
  pergunta: não tenho dinheiro para advogado, quem pode me ajudar no processo?
  rag:
    resposta: Não consigo responder a essa pergunta com segurança a partir da lei. Para orientação, ligue 180 (gratuito, 24 horas) ou procure a Defensoria Pública do DF, que atende de graça.
    recusada: true
    citacoes: []
  sem_rag:
    resposta: 'Você pode ter ajuda sem pagar. Veja as opções:


      **Defensoria Pública**

      É o órgão do Estado que atende quem não pode pagar advogado. Ela pode entrar com o processo e acompanhar seu caso. (Lei 11.340/2006, art. 28, parágrafo único)


      **Advogado particular gratuito (assistência judiciária)**

      A lei garante assistência judiciária gratuita a quem não tem condições de pagar. Isso inclui isenção de custas do processo. (Lei 11.340/2006, art. 28; Lei 1.060/1950, art. 3º)


      **Núcleos de prática jurídica**

      Faculdades de Direito costumam ter núcleos que atendem de graça. Vale procurar uma perto de você.


      **Delegacia e Juizado de Violência Doméstica**

      Na delegacia, você pode pedir orientação. O juizado da violência doméstica também pode informar onde buscar a Defensoria. (Lei 11.340/2006, art. 14)


      Importante: quem decide se concede a gratuidade é o juiz. A lei prevê esse direito, mas não é automático.


      Se você estiver em perigo agora, ligue 190.


      Quer que eu explique como funciona o pedido de medida protetiva de urgência?'
- id: dv-011
  tipo: pergunta
  categoria: crime
  pergunta: Durante uma briga no mês passado, o ex-companheiro de uma vizinha jogou no chão o computador e a impressora que ela usava para trabalhar até quebrar tudo, deixando um prejuízo alto para ela. Quebrar de propósito os objetos de outra pessoa é crime no Código Penal, e a pena aumenta quando isso causa prejuízo grande ou tem agressão?
  rag:
    resposta: 'Sim. Destruir, inutilizar ou deteriorar coisa alheia é crime, com pena de detenção de um a seis meses, ou multa (Código Penal, art. 163).


      A pena aumenta — detenção de seis meses a três anos, e multa — se o crime é cometido com violência à pessoa ou grave ameaça, ou por motivo egoístico ou com prejuízo considerável para a vítima (Código Penal, art. 163, parágrafo único, incisos I e IV).


      "Coisa alheia" é o objeto que pertence a outra pessoa. "Detenção" é um tipo de pena privativa de liberdade. Quem decide se há crime e qual pena aplicar é o juiz.


      Se houver perigo agora, ligue 190.'
    recusada: false
    citacoes:
    - Código Penal, art. 163
  sem_rag:
    resposta: 'Sim. Quebrar de propósito coisa de outra pessoa é crime de dano (Código Penal, art. 163).


      A pena é maior quando o dano causa prejuízo grande para a vítima (Código Penal, art. 163, parágrafo único, inciso I).


      Também há pena maior quando o dano é feito com violência à pessoa ou grave ameaça (Código Penal, art. 163, parágrafo único, inciso II).


      No caso de violência doméstica contra a mulher, a lei prevê que o dano a bens dela é forma de violência patrimonial (Lei 11.340/2006, art. 7º, inciso IV). Violência patrimonial é quando alguém retém, subtrai ou destrói bens, documentos ou recursos da mulher.


      Quem decide se houve crime e qual pena aplicar é o juiz, após o processo. A lei só prevê as possibilidades.


      Para registrar o caso, ela pode procurar a delegacia, de preferência a Delegacia da Mulher, e guardar provas: fotos dos objetos quebrados, notas fiscais e testemunhas.


      Isso é orientação e não substitui advogada ou defensora.'
- id: dv-012
  tipo: pergunta
  categoria: crime
  pergunta: Em uma reunião de família no ano passado, o cunhado de uma amiga aproveitou que ela estava sozinha na cozinha e passou a mão pelo corpo dela e tentou beijá-la sem permissão, embora não tenha batido nela nem feito ameaças. Que crime comete quem passa a mão ou tenta beijar alguém sem a pessoa deixar, e qual é a pena prevista na lei?
  rag:
    resposta: Não sei responder com segurança. Os trechos enviados não tratam especificamente de toque ou beijo forçado sem violência ou grave ameaça. O art. 213 do Código Penal exige violência ou grave ameaça para o crime de estupro, e o art. 129 trata de lesão corporal, o que não parece ser o caso descrito. Para orientação adequada, é importante procurar uma advogada ou defensora.
    recusada: false
    citacoes:
    - Código Penal, art. 213
    - Código Penal, art. 129
  sem_rag:
    resposta: 'Isso pode ser crime, sim. Passar a mão no corpo de alguém sem consentimento e tentar beijar à força pode se encaixar em **importunação sexual**.


      O que a lei prevê:


      - **Importunação sexual**: praticar contra alguém, sem a anuência dela, ato libidinoso com o objetivo de satisfazer a própria lascívia ou a de terceiro. "Ato libidinoso" é qualquer ato de conteúdo sexual. "Lascívia" é o desejo sexual. (Lei 13.718/2018, que incluiu o art. 215-A no Código Penal)

      - **Pena prevista**: reclusão de 1 a 5 anos, se o ato não constitui crime mais grave (Código Penal, art. 215-A).


      Pontos importantes:


      - Não precisa haver violência física nem ameaça para ser importunação sexual. O que importa é o ato sexual sem o consentimento da pessoa.

      - Se houve violência grave ou ameaça que impediu a pessoa de reagir, pode ser outro crime, como **estupro** (Código Penal, art. 213). Quem decide qual crime se aplica é a autoridade policial e, ao final, o juiz.

      - A Lei Maria da Penha se aplica a violência contra a mulher no âmbito da família ou em relação íntima de afeto, inclusive entre parentes por afinidade, como o cunhado (Lei 11.340/2006, arts. 5º e 7º). Ela traz medidas de proteção, como afastamento do agressor (Lei 11.340/2006, art. 22).

      - O juiz pode conceder medidas protetivas de urgência se entender que há risco (Lei 11.340/2006, arts. 18 e 19). Não é automático.


      O que ela pode fazer:


      - Registrar boletim de ocorrência em delegacia, de preferência especializada em atendimento à mulher.

      - Pedir medidas protetivas de urgência.

      - Guardar provas: mensagens, nomes de testemunhas, relato do que aconteceu.


      Isso é orientação e não substitui advogada ou defensora. Não posso redigir petições.


      Se ela estiver em perigo agora, ligue 190.'
- id: dv-013
  tipo: pergunta
  categoria: crime
  pergunta: O irmão de uma colega pegou escondido uma quantia em dinheiro da bolsa dela sem usar agressão nem intimidação, e o ex-marido de quem ela já estava separada no papel também sumiu com um objeto dela sem violência. Quando um irmão ou um ex-marido separado judicialmente pega bens da pessoa sem usar violência, o processo criminal começa sozinho ou depende de a vítima dar autorização?
  rag:
    resposta: 'Não sei responder com segurança.


      Os trechos enviados não tratam de furto entre irmãos nem de furto de ex-marido separado judicialmente. O trecho do Código Penal, art. 182, que fala em "representação" (autorização da vítima para o processo começar), aparece sem indicar qual crime ele alcança, e os trechos da Lei 11.340/2006, art. 12, tratam apenas dos procedimentos da autoridade policial, não disso.


      Se você estiver em perigo agora, ligue 190.'
    recusada: false
    citacoes:
    - Código Penal, art. 182
    - Lei 11.340/2006, art. 12
  sem_rag:
    resposta: 'Não sei responder com segurança se esses dois casos entram na Lei Maria da Penha. Vou explicar o que sei e o que depende de cada situação.


      **1. Irmão que pegou dinheiro da bolsa**

      - A Lei Maria da Penha trata de violência contra a mulher no âmbito da família e de relação íntima de afeto (Lei 11.340/2006, art. 5º). Ela não cobre todo conflito entre irmãos.

      - Pegar dinheiro alheio sem violência pode ser tratado como furto, se houver subtração para si (Código Penal, art. 155).

      - Em regra, o furto é crime de ação penal pública: o processo não depende de autorização da vítima. Mas há casos em que a lei exige representação, que é a manifestação da vítima querendo que o fato seja investigado (Código Penal, art. 167).

      - Não sei dizer com segurança se o caso do irmão se encaixa nessa exigência.


      **2. Ex-marido separado que sumiu com um objeto**

      - Se a separação já está formalizada e não há mais relação de afeto, pode ser discutido se a Lei Maria da Penha se aplica. Não sei responder com segurança.

      - Sem violência, o fato pode ser tratado como furto ou apropriação indébita, que é ficar com coisa alheia que estava em sua posse (Código Penal, arts. 155 e 168).

      - Também aqui a ação costuma ser pública, mas pode haver exigência de representação em alguns casos (Código Penal, art. 167).


      **O que fazer**

      - Orientar a colega a procurar uma delegacia, de preferência a Delegacia da Mulher, e uma advogada ou a Defensoria Pública.

      - Quem decide se o crime é de ação pública ou depende de representação é a autoridade policial e o juiz, com base no caso concreto.


      Se ela estiver em perigo agora, ligue 190.'
- id: dv-014
  tipo: pergunta
  categoria: guarda
  pergunta: No processo de família de uma conhecida, o juiz viu que a criança não tinha condições seguras de continuar morando nem com o pai nem com a mãe, mas uma avó muito próxima que sempre cuidou do neto pediu para ficar com a guarda. Quando o filho não deve ficar sob a guarda do pai nem da mãe, para quem o juiz transfere a guarda e o que ele leva em conta?
  rag:
    resposta: 'Quando o juiz verifica que o filho não deve permanecer sob a guarda do pai nem da mãe, ele defere a guarda a uma pessoa que mostre compatibilidade com a natureza da medida (Código Civil, art. 1.584, § 5º).


      Nessa escolha, o juiz considera, de preferência, o grau de parentesco e as relações de afinidade e afetividade (Código Civil, art. 1.584, § 5º).


      "Defere" significa que o juiz concede a guarda. Quem decide é o juiz, após analisar o caso.


      Isso é orientação geral e não substitui advogada ou defensora. Se houver perigo agora, ligue 190.'
    recusada: false
    citacoes:
    - Código Civil, art. 1.584
  sem_rag:
    resposta: 'Quando nem o pai nem a mãe têm condições de ficar com a criança, o juiz pode dar a guarda a outra pessoa da família que tenha vínculo próximo com ela. Isso está previsto no Estatuto da Criança e do Adolescente (Lei 8.069/1990, art. 33, § 2º).


      Essa entrega da guarda a um parente próximo se chama "guarda para terceiro" ou "guarda a parente". O juiz analisa o caso concreto e decide.


      O que o juiz leva em conta:

      - O melhor interesse da criança, ou seja, o que protege mais o bem-estar dela (Lei 8.069/1990, art. 3º e art. 6º).

      - Os laços de afeto e de parentesco com quem pede a guarda.

      - Se essa pessoa já cuida da criança e por quanto tempo.

      - Se ela tem condições de criar e educar a criança.

      - Estudos técnicos, como relatório social e avaliação psicológica, quando o juiz determina.


      A avó que sempre cuidou do neto pode pedir a guarda. O juiz pode conceder, mas não é automático: depende da análise do caso.


      Importante: a guarda não tira o dever de sustento dos pais. Ainda pode ser fixada pensão alimentícia (Lei 8.069/1990, art. 33, § 4º).


      Se a criança estiver em perigo agora, ligue 190. Para orientação jurídica, procure uma advogada ou a Defensoria Pública.'
- id: dv-015
  tipo: pergunta
  categoria: auxilio_fonar_trabalho
  pergunta: Quando uma amiga foi registrar ocorrência de violência doméstica na delegacia, aplicaram nela o Formulário Nacional de Avaliação de Risco. Para que serve esse formulário, quais órgãos devem aplicá-lo no atendimento à mulher e as informações que ela responde ficam protegidas por sigilo?
  rag:
    resposta: 'O Formulário Nacional de Avaliação de Risco serve para identificar os fatores que indicam o risco de a mulher vir a sofrer qualquer forma de violência no âmbito das relações domésticas. Ele subsidia a atuação dos órgãos de segurança pública, do Ministério Público, do Poder Judiciário e da rede de proteção na gestão do risco identificado (Lei 14.149/2021, art. 2º, § 1º).


      Sobre quem aplica: o formulário deve ser aplicado preferencialmente pela Polícia Civil no momento de registro da ocorrência. Se não for possível, pelo Ministério Público ou pelo Poder Judiciário, no primeiro atendimento à mulher (Lei 14.149/2021, art. 2º, § 2º). Outros órgãos e entidades públicas ou privadas que atuem nessa área também podem usar o modelo, de forma facultativa (Lei 14.149/2021, art. 2º, § 3º).


      Sobre o sigilo: sim, as informações devem ser preservadas em sigilo em qualquer hipótese (Lei 14.149/2021, art. 2º, § 1º).


      Lembrando: isso é orientação e não substitui advogada ou defensora. Se ela estiver em perigo agora, ligue 190.'
    recusada: false
    citacoes:
    - Lei 14.149/2021, art. 2º
  sem_rag:
    resposta: 'O formulário serve para medir o risco de a mulher voltar a sofrer violência. Ele ajuda a orientar medidas de proteção. A lei prevê esse instrumento na política de atendimento (Lei 11.340/2006, art. 8º, caput e incisos).


      Quem deve aplicar: os órgãos de segurança e de justiça no atendimento à mulher. Isso inclui delegacias, polícia militar, Ministério Público e Defensoria Pública. A norma fala em atendimento policial e pericial especializado (Lei 11.340/2006, art. 10) e em atuação conjunta desses órgãos (Lei 11.340/2006, art. 8º, incisos I a V).


      Sobre sigilo: as informações são protegidas. O atendimento deve preservar a intimidade e a privacidade da mulher (Lei 11.340/2006, art. 10, caput). Os dados pessoais e sensíveis têm proteção na Lei Geral de Proteção de Dados (Lei 13.709/2018, arts. 5º, I e II, e 7º). O formulário integra protocolos de atendimento e seus dados não devem ser divulgados fora das finalidades de proteção.


      Atenção: o formulário não garante resultado. Quem decide sobre medidas protetivas é o juiz, que pode concedê-las (Lei 11.340/2006, arts. 18 e 19).


      Se sua amiga estiver em perigo agora, ligue 190.'
