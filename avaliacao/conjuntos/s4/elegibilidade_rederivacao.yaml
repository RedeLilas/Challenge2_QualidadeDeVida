versao: 1
descricao: 'Re-derivação do gabarito de avaliacao/conjuntos/s4/elegibilidade.yaml a partir do texto das normas,
  feita pelo Claude em 17/11/2026 sem consultar o gabarito do conjunto nem rodar a regra (web/beneficios.js), e
  conferida por Túlio. Ressalva: o Claude já tinha lido o código da regra e sabia que o gabarito original concordava
  com ela; por isso esta não é uma conferência às cegas feita por uma pessoa. Só depois da derivação, um script
  comparou o resultado com o gabarito e com a regra: 79 de 80 pares iguais. A divergência (e-013, aluguel_social_df)
  foi decidida pelo texto da Portaria SMDF 49/2026, art. 2º, I, e o gabarito foi corrigido.'
salario_minimo: 'R$ 1.621,00 (Decreto 12.797/2025, art. 1º, como em regras/beneficios.json): 1/4 = 405,25; 1/2 =
  810,50; 2 SM = 3.242,00'
fundamentos:
  bolsa_familia: Lei 14.601/2023, art. 5º, I e II (CadÚnico e renda per capita de até R$ 218).
  bpc: Lei 8.742/1993 (LOAS), art. 20, caput e § 3º (deficiência ou 65 anos ou mais; per capita de até 1/4 do SM).
  auxilio_aluguel: 'Lei 11.340/2006, art. 23, VI (concedido pelo juiz): sempre depende de decisão judicial.'
  aluguel_social_df: Portaria SMDF 49/2026, art. 2º, I (per capita de até 1/2 SM ou renda familiar total de até
    2 SM, critérios alternativos) e art. 5º, I a IV; Lei Distrital 6.623/2020, art. 1º, § 2º (acesso desde o boletim).
  convencoes: Os status 'faltam_informacoes' e 'nao_aplicavel' por enquanto seguem a spec beneficios.
divergencias:
- caso: e-013
  beneficio: aluguel_social_df
  rederivado: provavel
  gabarito_original: faltam_informacoes
  regra: faltam_informacoes
  decisao: provavel (gabarito corrigido; a regra fica como está para a medição e o erro vai para o relatório)
  fundamento: 'Portaria SMDF 49/2026, art. 2º, I: com a renda total de R$ 400 (<= 2 SM), o critério alternativo
    é cumprido sem o número de pessoas.'
