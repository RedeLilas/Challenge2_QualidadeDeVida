versao: 1
descricao: >-
  Casos fictícios para medir a acurácia de elegibilidade da S4 (Beneficios.avaliar). Não
  representam decisão administrativa. Os perfis e o gabarito foram redigidos por Léo a partir
  das regras e fontes locais. Para o gabarito não depender só da regra medida, os 80 pares
  perfil × benefício foram re-derivados do texto das normas pelo Claude, sem consultar o
  gabarito nem rodar a regra (registro em elegibilidade_rederivacao.yaml), e conferidos por
  Túlio, que não escreveu os casos. A re-derivação concordou em 79 de 80 pares; a divergência
  (e-013, Aluguel Social com o número de pessoas desconhecido) foi decidida pelo texto da
  Portaria SMDF 49/2026, art. 2º, I, e o gabarito foi corrigido para provavel. Os status
  "faltam informações" e "não aplicável por enquanto" seguem as convenções da spec
  beneficios, e o Aluguel Social só com boletim segue a Lei Distrital 6.623/2020, art. 1º, § 2º.
beneficios:
- bolsa_familia
- bpc
- auxilio_aluguel
- aluguel_social_df
