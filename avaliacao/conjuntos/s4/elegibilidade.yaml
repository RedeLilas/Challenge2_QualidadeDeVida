    R$ 218). Lei 8.742/1993 (LOAS), art. 20, §§ 2º e 3º (pessoa idosa/deficiência
    e critério de renda); § 12 quando aplicável CadÚnico. Lei 11.340/2006, art. 23,
    VI (auxílio-aluguel por decisão judicial, conforme vulnerabilidade social e econômica).
    Portaria SMDF 49/2026, arts. 2º e 5º (limites de renda e critérios de concessão).
