      fonte_conferida: "Lei Distrital 5.165/2013, arts. 3º, 18, 19, 21 e 22, I"
      status: conferida

  - id: bd-022
    programa: beneficios_eventuais
    sem_nome_oficial: false
    pergunta: "qual a renda pra pedir beneficio eventual no df?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "No DF, os benefícios eventuais são concedidos a quem tem renda familiar per capita igual ou inferior a meio salário mínimo nacional. Se a pessoa não estiver no Cadastro Único, a inclusão deve ser feita logo depois da concessão, e a falta de documentos não impede o benefício."
    pontos_obrigatorios:
      - "A renda familiar per capita precisa ser de até meio salário mínimo."
      - "Não estar no Cadastro Único não impede: a inclusão é feita depois."
    normas_aceitas:
      - "Lei Distrital 5.165/2013, art. 3º"
      - "Decreto Distrital 35.191/2014, art. 4º"
    fonte: "Lei Distrital 5.165/2013, art. 3º, caput e §§ 2º e 3º; Decreto Distrital 35.191/2014, art. 4º"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Lei Distrital 5.165/2013, art. 3º, caput e §§ 2º e 3º; Decreto Distrital 35.191/2014, art. 4º"
      status: conferida

