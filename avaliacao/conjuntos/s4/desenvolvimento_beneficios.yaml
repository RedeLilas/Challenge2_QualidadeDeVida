versao: 1
descricao: >-
  Perguntas de desenvolvimento do RAG de benefícios (s4-rag-beneficios, tarefa 1.1), usadas só para
  calibrar o limite de similaridade dos eixos beneficios e df. Perguntas fictícias, em linguagem
  leiga, escritas com o Claude; gabarito e normas tirados do texto em dados/leis/ (coleta de
  03/11/2026). Conferido por Léo Alec, que não escreveu as perguntas. Arquivo separado de
  avaliacao/conjuntos/desenvolvimento.yaml (base da S3). Se o RAG de benefícios for medido depois,
  o conjunto da medição tem de ser outro, congelado antes, sem repetir estas perguntas.
programas:
  - bolsa_familia
  - bpc
  - prato_cheio
  - cartao_gas
  - aluguel_social_df
  - beneficios_eventuais

perguntas:
  - id: bd-001
    programa: bolsa_familia
    sem_nome_oficial: false
    pergunta: "quanto a pessoa pode ganhar por mes pra entrar no bolsa familia?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "São elegíveis ao Bolsa Família as famílias inscritas no CadÚnico cuja renda familiar per capita mensal seja igual ou inferior a R$ 218,00."
    pontos_obrigatorios:
      - "A renda considerada é a renda familiar por pessoa (per capita) por mês."
      - "O limite é de R$ 218,00 por pessoa, inclusive."
      - "A família precisa estar inscrita no CadÚnico."
    normas_aceitas:
      - "Lei 14.601/2023, art. 5º"
    fonte: "Lei 14.601/2023, art. 5º, I e II"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Lei 14.601/2023, art. 5º, I e II"
      status: conferida

  - id: bd-002
    programa: bolsa_familia
    sem_nome_oficial: true
    pergunta: "o bolsa paga quanto por pessoa da familia?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "O Bolsa Família paga o Benefício de Renda de Cidadania de R$ 142,00 por integrante da família. Se a soma desses valores ficar abaixo de R$ 600,00, há um Benefício Complementar até chegar a R$ 600,00. Há ainda R$ 150,00 por criança de 0 a 7 anos incompletos (Benefício Primeira Infância) e R$ 50,00 do Benefício Variável Familiar para famílias com gestantes, nutrizes ou crianças e adolescentes nas idades previstas."
    pontos_obrigatorios:
      - "O Benefício de Renda de Cidadania é de R$ 142,00 por integrante."
      - "O Benefício Complementar completa o valor da família até R$ 600,00."
      - "Há R$ 150,00 por criança de 0 a 7 anos incompletos."
    normas_aceitas:
      - "Lei 14.601/2023, art. 7º"
    fonte: "Lei 14.601/2023, art. 7º, § 1º, I a IV"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Lei 14.601/2023, art. 7º, § 1º, I a IV"
      status: conferida

  - id: bd-003
    programa: bolsa_familia
    sem_nome_oficial: false
    pergunta: "precisa levar as crianca na escola pra continuar recebendo o bolsa familia?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "Sim. Para continuar no Bolsa Família, a família precisa cumprir condicionalidades: frequência escolar mínima de 60% para crianças de 4 a 6 anos incompletos e de 75% para quem tem de 6 a 18 anos incompletos e não concluiu a educação básica, além de pré-natal, calendário de vacinação e acompanhamento nutricional das crianças até 7 anos incompletos."
    pontos_obrigatorios:
      - "A permanência no programa depende de condicionalidades."
      - "Há frequência escolar mínima: 60% (4 a 6 anos incompletos) e 75% (6 a 18 anos incompletos)."
      - "Também contam pré-natal, vacinação e acompanhamento nutricional."
    normas_aceitas:
      - "Lei 14.601/2023, art. 10"
    fonte: "Lei 14.601/2023, art. 10, I a IV"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Lei 14.601/2023, art. 10, I a IV"
      status: conferida

  - id: bd-004
    programa: bolsa_familia
    sem_nome_oficial: true
    pergunta: "aquele dinheiro do governo federal pra familia pobre, tem que tar no cadunico?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "Sim. No Bolsa Família, a inscrição no CadÚnico é uma das condições: são elegíveis as famílias inscritas no CadÚnico e com renda familiar per capita mensal de até R$ 218,00."
    pontos_obrigatorios:
      - "A inscrição no CadÚnico é condição para o Bolsa Família."
      - "Também há o limite de renda de R$ 218,00 por pessoa."
    normas_aceitas:
      - "Lei 14.601/2023, art. 5º"
    fonte: "Lei 14.601/2023, art. 5º, I"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Lei 14.601/2023, art. 5º, I"
      status: conferida

  - id: bd-005
    programa: bpc
    sem_nome_oficial: false
    pergunta: "o que é o bpc?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "O Benefício de Prestação Continuada (BPC) é a garantia de um salário mínimo por mês à pessoa com deficiência e à pessoa idosa com 65 anos ou mais que comprovem não ter meios de se manter nem de ser mantidas pela família. A renda familiar por pessoa precisa ser de até 1/4 do salário mínimo."
    pontos_obrigatorios:
      - "O BPC é de um salário mínimo por mês."
      - "É para pessoa com deficiência ou pessoa idosa com 65 anos ou mais."
      - "A renda familiar per capita precisa ser de até 1/4 do salário mínimo."
    normas_aceitas:
      - "Lei 8.742/1993 (LOAS), art. 20"
    fonte: "Lei 8.742/1993 (LOAS), art. 20, caput e § 3º"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Lei 8.742/1993 (LOAS), art. 20, caput e § 3º"
      status: conferida

  - id: bd-006
    programa: bpc
    sem_nome_oficial: true
    pergunta: "minha mae tem 66 anos e nunca contribuiu pro inss, existe algum salario que o governo paga pra idoso nessa situacao?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "Existe o Benefício de Prestação Continuada (BPC), que garante um salário mínimo por mês à pessoa idosa com 65 anos ou mais que não tenha meios de se manter nem de ser mantida pela família, com renda familiar por pessoa de até 1/4 do salário mínimo. Não depende de contribuição, mas exige inscrição no CPF e no Cadastro Único."
    pontos_obrigatorios:
      - "O benefício é o BPC, de um salário mínimo por mês."
      - "A idade mínima é 65 anos."
      - "A renda familiar per capita precisa ser de até 1/4 do salário mínimo."
      - "É exigida a inscrição no Cadastro Único."
    normas_aceitas:
      - "Lei 8.742/1993 (LOAS), art. 20"
    fonte: "Lei 8.742/1993 (LOAS), art. 20, caput, § 3º e § 12"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Lei 8.742/1993 (LOAS), art. 20, caput, § 3º e § 12"
      status: conferida

  - id: bd-007
    programa: bpc
    sem_nome_oficial: true
    pergunta: "o loas pra quem tem deficiencia precisa passar por pericia?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "Sim. No BPC para pessoa com deficiência, a concessão depende da avaliação da deficiência e do grau de impedimento, feita por avaliação médica e avaliação social, com médicos peritos e assistentes sociais do INSS."
    pontos_obrigatorios:
      - "A concessão depende de avaliação da deficiência e do grau de impedimento."
      - "A avaliação é médica e social, feita pelo INSS."
    normas_aceitas:
      - "Lei 8.742/1993 (LOAS), art. 20"
    fonte: "Lei 8.742/1993 (LOAS), art. 20, §§ 2º e 6º"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Lei 8.742/1993 (LOAS), art. 20, §§ 2º e 6º"
      status: conferida

  - id: bd-008
    programa: prato_cheio
    sem_nome_oficial: false
    pergunta: "como funciona o prato cheio?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "O Cartão Prato Cheio é um programa do DF de provimento alimentar direto, em caráter emergencial, para famílias em insegurança alimentar e nutricional. Ele é concedido como crédito de R$ 250,00 para comprar alimentos, e as concessões dependem de disponibilidade orçamentária."
    pontos_obrigatorios:
      - "É um programa emergencial do DF para famílias em insegurança alimentar."
      - "É um crédito de R$ 250,00 para comprar alimentos."
      - "Depende de disponibilidade orçamentária."
    normas_aceitas:
      - "Lei Distrital 7.009/2021, art. 1º"
      - "Lei Distrital 7.009/2021, art. 2º"
      - "Decreto Distrital 42.873/2021, art. 2º"
      - "Decreto Distrital 42.873/2021, art. 3º"
    fonte: "Lei Distrital 7.009/2021, arts. 1º e 2º; Decreto Distrital 42.873/2021, arts. 2º e 3º"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Lei Distrital 7.009/2021, arts. 1º e 2º; Decreto Distrital 42.873/2021, arts. 2º e 3º"
      status: conferida

  - id: bd-009
    programa: prato_cheio
    sem_nome_oficial: true
    pergunta: "quem pode pedir o cartao de comida do df?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "No Cartão Prato Cheio, os critérios são: renda familiar per capita de até meio salário mínimo, estar em situação de insegurança alimentar, estar inscrito no Cadastro Único ou no sistema da Secretaria de Desenvolvimento Social do DF e morar no DF."
    pontos_obrigatorios:
      - "Renda familiar per capita de até meio salário mínimo."
      - "Estar em situação de insegurança alimentar."
      - "Estar no Cadastro Único ou no sistema da Sedes-DF."
      - "Morar no DF."
    normas_aceitas:
      - "Decreto Distrital 42.873/2021, art. 2º"
    fonte: "Decreto Distrital 42.873/2021, art. 2º, § 1º, I a IV"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Decreto Distrital 42.873/2021, art. 2º, § 1º, I a IV"
      status: conferida

  - id: bd-010
    programa: prato_cheio
    sem_nome_oficial: false
    pergunta: "o cartão prato cheio da pra comprar qualquer coisa?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "Não. O crédito do Cartão Prato Cheio é para gêneros alimentícios e só pode ser usado em estabelecimentos que vendem alimentos. O crédito também é intransferível."
    pontos_obrigatorios:
      - "O crédito é para comprar alimentos."
      - "Só vale em estabelecimentos que vendem alimentos."
      - "O crédito é intransferível."
    normas_aceitas:
      - "Lei Distrital 7.009/2021, art. 2º"
      - "Lei Distrital 7.009/2021, art. 3º"
      - "Lei Distrital 7.009/2021, art. 4º"
    fonte: "Lei Distrital 7.009/2021, arts. 2º, 3º e 4º, II"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Lei Distrital 7.009/2021, arts. 2º, 3º e 4º, II"
      status: conferida

  - id: bd-011
    programa: cartao_gas
    sem_nome_oficial: true
    pergunta: "como funciona o auxilio do gas aqui no df?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "O Cartão Gás é um programa do DF que dá um auxílio de R$ 100,00 a cada dois meses para comprar o botijão de gás de cozinha (GLP 13 kg), destinado a famílias com renda per capita de até meio salário mínimo."
    pontos_obrigatorios:
      - "É um programa do DF para comprar o botijão de gás de 13 kg."
      - "O valor é de R$ 100,00 por bimestre."
      - "É para famílias com renda per capita de até meio salário mínimo."
    normas_aceitas:
      - "Lei Distrital 6.938/2021, art. 1º"
      - "Lei Distrital 6.938/2021, art. 2º"
      - "Decreto Distrital 42.376/2021, art. 2º"
      - "Decreto Distrital 42.376/2021, art. 8º"
    fonte: "Lei Distrital 6.938/2021, arts. 1º e 2º; Decreto Distrital 42.376/2021, arts. 2º e 8º"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Lei Distrital 6.938/2021, arts. 1º e 2º; Decreto Distrital 42.376/2021, arts. 2º e 8º"
      status: conferida

  - id: bd-012
    programa: cartao_gas
    sem_nome_oficial: false
    pergunta: "quem pode receber o cartao gas?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "Para o Cartão Gás, é preciso: estar no Cadastro Único, ter renda familiar per capita de até meio salário mínimo, ter declarado no Cadastro Único o gasto com gás de cozinha, morar no DF, não estar em situação de rua nem em acolhimento institucional coletivo e o responsável familiar ter 16 anos ou mais."
    pontos_obrigatorios:
      - "Estar no Cadastro Único, com o gasto com gás declarado."
      - "Renda familiar per capita de até meio salário mínimo."
      - "Morar no DF."
    normas_aceitas:
      - "Lei Distrital 6.938/2021, art. 3º"
      - "Decreto Distrital 42.376/2021, art. 4º"
    fonte: "Lei Distrital 6.938/2021, art. 3º, I a VI; Decreto Distrital 42.376/2021, art. 4º"
