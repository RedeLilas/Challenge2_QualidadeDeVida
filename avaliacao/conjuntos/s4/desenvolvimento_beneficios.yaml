  - id: bd-014
    programa: aluguel_social_df
    sem_nome_oficial: false
    pergunta: "o que é o aluguel social do df?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "O Aluguel Social do DF é uma assistência financeira temporária para custear o aluguel de mulheres vítimas de violência doméstica em situação de extrema vulnerabilidade econômica e social. A Portaria da Secretaria da Mulher fixa o valor em R$ 600,00 por mês, por 6 meses."
    pontos_obrigatorios:
      - "É uma ajuda temporária para pagar aluguel."
      - "É para mulheres vítimas de violência doméstica em extrema vulnerabilidade."
      - "O valor é de R$ 600,00 por mês, por 6 meses."
    normas_aceitas:
      - "Lei Distrital 6.623/2020, art. 1º"
      - "Decreto Distrital 45.989/2024, art. 2º"
      - "Portaria SMDF 49/2026, art. 4º"
    fonte: "Lei Distrital 6.623/2020, art. 1º; Decreto Distrital 45.989/2024, art. 2º; Portaria SMDF 49/2026, art. 4º"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Lei Distrital 6.623/2020, art. 1º; Decreto Distrital 45.989/2024, art. 2º; Portaria SMDF 49/2026, art. 4º"
      status: conferida

  - id: bd-015
    programa: aluguel_social_df
    sem_nome_oficial: false
    pergunta: "quanto tempo dura o aluguel social e qual o valor?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "O Aluguel Social do DF é de R$ 600,00 por mês, concedido por 6 meses. O Decreto permite prorrogar apenas uma vez, por igual período, mediante justificativa técnica da Secretaria de Estado da Mulher."
    pontos_obrigatorios:
      - "O valor é de R$ 600,00 por mês."
      - "A duração é de 6 meses."
      - "Pode ser prorrogado uma única vez, por igual período, com justificativa técnica."
    normas_aceitas:
      - "Portaria SMDF 49/2026, art. 4º"
      - "Decreto Distrital 45.989/2024, art. 3º"
    fonte: "Portaria SMDF 49/2026, art. 4º; Decreto Distrital 45.989/2024, art. 3º"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Portaria SMDF 49/2026, art. 4º; Decreto Distrital 45.989/2024, art. 3º"
      status: conferida

  - id: bd-016
    programa: aluguel_social_df
    sem_nome_oficial: true
    pergunta: "precisa ter medida protetiva pra pedir aquela ajuda de aluguel do governo do df?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "A Portaria da Secretaria da Mulher lista entre os critérios do Aluguel Social ter medida protetiva de urgência vigente, estar em acompanhamento psicossocial, morar no DF e estar em extrema vulnerabilidade, precisando sair de casa ou permanecer no imóvel alugado. A Lei Distrital 6.623/2020, porém, diz que o acesso deve ser garantido às vítimas desde o registro do boletim de ocorrência."
    pontos_obrigatorios:
      - "A Portaria lista a medida protetiva vigente entre os critérios."
      - "A Lei Distrital 6.623/2020 garante o acesso desde o boletim de ocorrência."
      - "Também são critérios o acompanhamento psicossocial, morar no DF e a extrema vulnerabilidade."
    normas_aceitas:
      - "Portaria SMDF 49/2026, art. 5º"
      - "Lei Distrital 6.623/2020, art. 1º"
    fonte: "Portaria SMDF 49/2026, art. 5º, I a IV; Lei Distrital 6.623/2020, art. 1º, § 2º"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Portaria SMDF 49/2026, art. 5º, I a IV; Lei Distrital 6.623/2020, art. 1º, § 2º"
      status: conferida

  - id: bd-017
    programa: aluguel_social_df
    sem_nome_oficial: false
    pergunta: "qual a renda maxima pra conseguir o aluguel social?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "No Aluguel Social do DF, a mulher em extrema vulnerabilidade é aquela com renda per capita mensal de até meio salário mínimo ou renda familiar mensal total de até dois salários mínimos, que não consegue pagar o aluguel sem prejudicar o sustento básico."
    pontos_obrigatorios:
      - "Renda per capita de até meio salário mínimo ou renda familiar total de até dois salários mínimos."
      - "Não conseguir pagar o aluguel sem prejudicar o sustento básico."
    normas_aceitas:
      - "Portaria SMDF 49/2026, art. 2º"
      - "Decreto Distrital 45.989/2024, art. 2º"
    fonte: "Portaria SMDF 49/2026, art. 2º, I; Decreto Distrital 45.989/2024, art. 2º, § 1º"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Portaria SMDF 49/2026, art. 2º, I; Decreto Distrital 45.989/2024, art. 2º, § 1º"
      status: conferida

  - id: bd-018
    programa: beneficios_eventuais
    sem_nome_oficial: false
    pergunta: "o que sao beneficios eventuais?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "Benefícios eventuais são ajudas suplementares e provisórias da assistência social, dadas às pessoas e famílias por causa de nascimento, morte, situações de vulnerabilidade temporária e calamidade pública. No DF, as modalidades são auxílio-natalidade, auxílio por morte, auxílio em situação de vulnerabilidade temporária e auxílio em desastre e calamidade pública."
    pontos_obrigatorios:
      - "São ajudas provisórias da assistência social."
      - "Cobrem nascimento, morte, vulnerabilidade temporária e calamidade pública."
      - "No DF há quatro modalidades."
    normas_aceitas:
      - "Lei 8.742/1993 (LOAS), art. 22"
      - "Lei Distrital 5.165/2013, art. 1º"
      - "Lei Distrital 5.165/2013, art. 5º"
      - "Decreto Distrital 35.191/2014, art. 1º"
      - "Decreto Distrital 35.191/2014, art. 3º"
    fonte: "Lei 8.742/1993 (LOAS), art. 22; Lei Distrital 5.165/2013, arts. 1º e 5º; Decreto Distrital 35.191/2014, arts. 1º e 3º"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Lei 8.742/1993 (LOAS), art. 22; Lei Distrital 5.165/2013, arts. 1º e 5º; Decreto Distrital 35.191/2014, arts. 1º e 3º"
      status: conferida

  - id: bd-019
    programa: beneficios_eventuais
    sem_nome_oficial: true
    pergunta: "o governo do df ajuda quando nasce um bebe?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "Sim, com o auxílio-natalidade, um benefício eventual. Em dinheiro, é uma parcela única de R$ 200,00 por nascimento para a mãe que mora no DF há pelo menos seis meses; também pode ser dado em bens de consumo, como o enxoval do recém-nascido. A renda familiar per capita precisa ser de até meio salário mínimo."
    pontos_obrigatorios:
      - "Existe o auxílio-natalidade."
      - "Em dinheiro, são R$ 200,00 por nascimento, para quem mora no DF há pelo menos seis meses."
      - "Pode ser dado como enxoval."
      - "A renda per capita precisa ser de até meio salário mínimo."
    normas_aceitas:
      - "Lei Distrital 5.165/2013, art. 8º"
      - "Lei Distrital 5.165/2013, art. 10"
      - "Lei Distrital 5.165/2013, art. 6º"
      - "Lei Distrital 5.165/2013, art. 3º"
    fonte: "Lei Distrital 5.165/2013, arts. 3º, 6º, 8º e 10"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Lei Distrital 5.165/2013, arts. 3º, 6º, 8º e 10"
      status: conferida

  - id: bd-020
    programa: beneficios_eventuais
    sem_nome_oficial: true
    pergunta: "tem ajuda pra pagar enterro?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "No DF, existe o auxílio por morte, um benefício eventual. Ele pode ser pago em dinheiro, em parcela única de R$ 415,00, ou como bens de consumo, com urna funerária, velório e sepultamento. A renda familiar per capita precisa ser de até meio salário mínimo."
    pontos_obrigatorios:
      - "Existe o auxílio por morte."
      - "Em dinheiro, é uma parcela única de R$ 415,00."
      - "Também pode cobrir urna, velório e sepultamento."
    normas_aceitas:
      - "Lei Distrital 5.165/2013, art. 13"
      - "Lei Distrital 5.165/2013, art. 14"
      - "Lei Distrital 5.165/2013, art. 16"
      - "Lei Distrital 5.165/2013, art. 17"
    fonte: "Lei Distrital 5.165/2013, arts. 3º, 13, 14, 16 e 17"
    conferencia:
