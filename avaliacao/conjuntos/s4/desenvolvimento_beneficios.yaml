  - id: bd-021
    programa: beneficios_eventuais
    sem_nome_oficial: true
    pergunta: "tem alguma ajuda do df pra quem ta passando por violencia em casa e ficou sem nada?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "O DF tem o auxílio em situação de vulnerabilidade temporária, um benefício eventual em dinheiro ou bens de consumo para reduzir riscos, perdas e danos. Na seleção, a violência por questões de gênero é um dos fatores observados. Ele é concedido em até seis parcelas por ano, para renda familiar per capita de até meio salário mínimo."
    pontos_obrigatorios:
      - "Existe o auxílio em situação de vulnerabilidade temporária."
      - "A violência por questões de gênero é um dos fatores observados na seleção."
      - "É concedido em até seis parcelas por ano."
    normas_aceitas:
      - "Lei Distrital 5.165/2013, art. 18"
      - "Lei Distrital 5.165/2013, art. 19"
      - "Lei Distrital 5.165/2013, art. 21"
      - "Lei Distrital 5.165/2013, art. 22"
    fonte: "Lei Distrital 5.165/2013, arts. 3º, 18, 19, 21 e 22, I"
