  - id: bd-013
    programa: cartao_gas
    sem_nome_oficial: true
    pergunta: "o vale gas cai todo mes?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "Não. O Cartão Gás do DF é pago em parcelas bimestrais, ou seja, a cada dois meses, no valor de R$ 100,00 por família."
    pontos_obrigatorios:
      - "O pagamento é bimestral (a cada dois meses)."
      - "O valor é de R$ 100,00 por família."
    normas_aceitas:
      - "Lei Distrital 6.938/2021, art. 2º"
