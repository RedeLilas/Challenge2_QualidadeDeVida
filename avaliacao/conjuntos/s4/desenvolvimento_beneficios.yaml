# Pergunta do eixo jurídico: confere se o limite de 0,81 do jurídico a recusa (o art. 23 está no eixo juridico).
juridico:
  - id: bd-j01
    eixo_esperado: juridico
    pergunta: "como funciona o aluguel da maria da penha?"
    autor: "Túlio Celeri (com o Claude)"
    resposta_esperada: "O juiz pode conceder à mulher em situação de violência doméstica um auxílio-aluguel, com valor fixado conforme a situação de vulnerabilidade social e econômica dela, por no máximo 6 meses."
    pontos_obrigatorios:
      - "Quem concede é o juiz."
      - "O valor depende da vulnerabilidade social e econômica."
      - "Dura no máximo 6 meses."
    normas_aceitas:
      - "Lei 11.340/2006, art. 23"
    fonte: "Lei 11.340/2006, art. 23, VI (incluído pela Lei 14.674/2023)"
    conferencia:
      revisor: "Léo Alec"
      fonte_conferida: "Lei 11.340/2006, art. 23, VI (incluído pela Lei 14.674/2023)"
      status: conferida
