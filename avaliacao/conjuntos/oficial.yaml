versao: 1

perguntas:
  - id: of-001
    categoria: violencia_e_protecao
    pergunta: "Uma amiga minha namora outra mulher e sofre agressões e humilhações constantes nesse relacionamento, mas elas nunca moraram juntas. A Lei Maria da Penha protege mulheres em relacionamentos homoafetivos e sem morar na mesma casa?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "Sim. A Lei Maria da Penha aplica-se a qualquer relação íntima de afeto na qual a pessoa agressora conviva ou tenha convivido com a ofendida, independentemente de coabitação (morar na mesma casa), e as relações pessoais protegidas pela lei independem de orientação sexual."
    pontos_obrigatorios:
      - "A proteção vale para relação íntima de afeto independentemente de coabitação (morar junto)."
      - "A aplicação da Lei 11.340/2006 independe de orientação sexual."
    normas_aceitas:
      - "Lei 11.340/2006, art. 5º, III"
      - "Lei 11.340/2006, art. 5º, parágrafo único"
    fonte: "Lei 11.340/2006, art. 5º, inciso III e parágrafo único"

  - id: of-002
    categoria: violencia_e_protecao
    pergunta: "O ex-companheiro de uma vizinha proibia que ela visitasse a própria família, vigiava todas as conversas do celular dela e dizia que ela não tinha capacidade de tomar decisões sozinha. Mesmo sem agressão física, esse controle e isolamento entram na Lei Maria da Penha?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "Sim. Essas condutas configuram violência psicológica prevista na Lei Maria da Penha, que abrange qualquer conduta que cause dano emocional, diminuição da autoestima ou que vise controlar ações, comportamentos e decisões da mulher mediante isolamento, vigilância constante, manipulação ou limitação do direito de ir e vir."
    pontos_obrigatorios:
      - "Configura violência psicológica prevista na Lei 11.340/2006."
      - "Abrange condutas de controle, isolamento, vigilância constante ou limitação do direito de ir e vir, mesmo sem agressão física."
    normas_aceitas:
      - "Lei 11.340/2006, art. 7º, II"
    fonte: "Lei 11.340/2006, art. 7º, inciso II"

  - id: of-003
    categoria: violencia_e_protecao
    pergunta: "Se o marido jogar fora o anticoncepcional da esposa e impedi-la de usar métodos contraceptivos para forçá-la a engravidar contra a vontade dela, como a Lei Maria da Penha classifica essa atitude?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "A Lei Maria da Penha classifica essa conduta como violência sexual, pois inclui qualquer ação que impeça a mulher de usar método contraceptivo, que a force à gravidez mediante coação ou manipulação, ou que limite ou anule o exercício de seus direitos sexuais e reprodutivos."
    pontos_obrigatorios:
      - "Classifica a conduta como violência sexual."
      - "Impedir o uso de método contraceptivo ou forçar à gravidez viola os direitos sexuais e reprodutivos protegidos pela lei."
    normas_aceitas:
      - "Lei 11.340/2006, art. 7º, III"
    fonte: "Lei 11.340/2006, art. 7º, inciso III"

  - id: of-004
    categoria: violencia_e_protecao
    pergunta: "Uma mulher trabalha como costureira autônoma e, após uma discussão meses atrás, o companheiro escondeu os documentos pessoais dela e danificou a máquina de costura para ela não conseguir trabalhar. Que tipo de violência doméstica é essa segundo a lei?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "Trata-se de violência patrimonial, definida pela Lei Maria da Penha como qualquer conduta que configure retenção, subtração ou destruição parcial ou total de objetos, instrumentos de trabalho, documentos pessoais, bens, valores e direitos ou recursos econômicos da mulher."
    pontos_obrigatorios:
      - "Configura violência patrimonial nos termos da Lei 11.340/2006."
      - "Inclui a retenção ou destruição de documentos pessoais e de instrumentos de trabalho."
    normas_aceitas:
      - "Lei 11.340/2006, art. 7º, IV"
    fonte: "Lei 11.340/2006, art. 7º, inciso IV"

  - id: of-005
    categoria: violencia_e_protecao
    pergunta: "Quando um ex-companheiro pratica atos de violência contra um parente, dependente ou pessoa da rede de apoio da mulher com o objetivo de fazê-la sofrer e atingi-la indiretamente, a Lei Maria da Penha prevê alguma forma específica de violência para isso?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "Sim. A Lei Maria da Penha prevê a violência vicária, entendida como qualquer forma de violência praticada contra descendente, ascendente, dependente, enteado, parente, pessoa sob guarda ou responsabilidade direta da mulher ou pessoa de sua rede de apoio, com vistas a atingi-la."
    pontos_obrigatorios:
      - "Identifica a conduta como violência vicária prevista na Lei 11.340/2006."
      - "Explica que ocorre quando a violência é praticada contra filhos/descendentes, parentes, dependentes ou rede de apoio com a finalidade de atingir a mulher."
    normas_aceitas:
      - "Lei 11.340/2006, art. 7º, VI"
    fonte: "Lei 11.340/2006, art. 7º, inciso VI"

  - id: of-006
    categoria: medidas_protetivas
    pergunta: "Depois que a mulher faz o pedido de medida protetiva de urgência na delegacia e o pedido chega ao juiz, qual é o prazo legal para o juiz analisar e decidir, e ele precisa marcar audiência para ouvir o agressor antes de conceder a medida?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "Recebido o expediente com o pedido da ofendida, o juiz tem o prazo de 48 horas para conhecer do pedido e decidir sobre as medidas protetivas de urgência. As medidas podem ser concedidas de imediato, independentemente de audiência das partes e de manifestação prévia do Ministério Público, que deve ser prontamente comunicado."
    pontos_obrigatorios:
      - "O juiz tem o prazo de 48 horas para decidir após receber o expediente com o pedido."
      - "As medidas protetivas podem ser concedidas de imediato, sem necessidade de audiência prévia das partes."
    normas_aceitas:
      - "Lei 11.340/2006, art. 18"
      - "Lei 11.340/2006, art. 18, I"
      - "Lei 11.340/2006, art. 19, § 1º"
    fonte: "Lei 11.340/2006, art. 18, inciso I e art. 19, § 1º"

  - id: of-007
    categoria: medidas_protetivas
    pergunta: "Uma mulher precisa necessariamente ter um inquérito policial aberto ou um processo criminal em andamento para conseguir uma medida protetiva de urgência, e por quanto tempo essa medida continua valendo?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "Não é necessário processo criminal nem inquérito policial: as medidas protetivas de urgência são concedidas independentemente da tipificação penal da violência, do ajuizamento de ação penal ou cível, da existência de inquérito policial ou do registro de boletim de ocorrência. Elas permanecem em vigor enquanto persistir o risco à integridade física, psicológica, sexual, patrimonial ou moral da ofendida ou de seus dependentes."
    pontos_obrigatorios:
      - "A concessão independe de ação penal ou cível, de inquérito policial ou de boletim de ocorrência."
      - "As medidas protetivas vigoram enquanto persistir o risco à integridade da ofendida ou de seus dependentes."
    normas_aceitas:
      - "Lei 11.340/2006, art. 19, § 5º"
      - "Lei 11.340/2006, art. 19, § 6º"
    fonte: "Lei 11.340/2006, art. 19, §§ 5º e 6º"

  - id: of-008
    categoria: medidas_protetivas
    pergunta: "Em uma cidade do interior que não é sede de comarca judicial, se for constatado risco à integridade da mulher, o delegado ou o policial pode determinar o afastamento imediato do agressor do lar, e em quanto tempo o juiz precisa ser avisado?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "Sim. Quando o Município não for sede de comarca, o afastamento imediato do agressor do lar pode ser determinado pelo delegado de polícia ou, se não houver delegado disponível no momento da denúncia, pelo próprio policial. Nesses casos, o juiz deve ser comunicado no prazo máximo de 24 horas e decidirá, em igual prazo de 24 horas, sobre a manutenção ou revogação da medida, dando ciência ao Ministério Público."
    pontos_obrigatorios:
      - "Quando o município não é sede de comarca, o delegado (ou o policial, na ausência de delegado disponível) pode afastar imediatamente o agressor do lar."
      - "O juiz deve ser comunicado no prazo máximo de 24 horas e decidir em igual prazo sobre a manutenção ou revogação."
    normas_aceitas:
      - "Lei 11.340/2006, art. 12-C"
    fonte: "Lei 11.340/2006, art. 12-C, incisos I a III e § 1º"

  - id: of-009
    categoria: medidas_protetivas
    pergunta: "Quando o agressor possui porte ou posse de arma de fogo e persegue a mulher tentando falar com ela por telefone e indo ao local onde ela estuda, quais medidas protetivas de urgência o juiz pode impor diretamente contra ele?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "O juiz pode aplicar ao agressor, em conjunto ou separadamente, a suspensão da posse ou restrição do porte de armas (com comunicação ao órgão competente), o afastamento do lar ou local de convivência, e a proibição de determinadas condutas, como aproximar-se da ofendida, de seus familiares e testemunhas (com limite mínimo de distância), manter contato por qualquer meio de comunicação e frequentar determinados lugares para preservar a integridade da ofendida."
    pontos_obrigatorios:
      - "Suspensão da posse ou restrição do porte de armas."
      - "Proibição de aproximação, de contato por qualquer meio de comunicação e de frequentar determinados lugares."
    normas_aceitas:
      - "Lei 11.340/2006, art. 22, I"
      - "Lei 11.340/2006, art. 22, II"
      - "Lei 11.340/2006, art. 22, III"
    fonte: "Lei 11.340/2006, art. 22, incisos I, II e III"

  - id: of-010
    categoria: medidas_protetivas
    pergunta: "O juiz pode determinar, como medida protetiva de urgência na Lei Maria da Penha, que o agressor pague pensão alimentícia provisória e participe obrigatoriamente de grupos de reeducação e acompanhamento psicossocial?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "Sim. O juiz pode aplicar como medidas protetivas de urgência que obrigam o agressor a prestação de alimentos provisionais ou provisórios, o comparecimento a programas de recuperação e reeducação e o acompanhamento psicossocial por meio de atendimento individual e/ou em grupo de apoio."
    pontos_obrigatorios:
      - "O juiz pode fixar prestação de alimentos provisionais ou provisórios."
      - "O juiz pode determinar o comparecimento do agressor a programas de recuperação e reeducação e acompanhamento psicossocial."
    normas_aceitas:
      - "Lei 11.340/2006, art. 22, V"
      - "Lei 11.340/2006, art. 22, VI"
      - "Lei 11.340/2006, art. 22, VII"
      - "Lei 11.340/2006, art. 22, § 10"
    fonte: "Lei 11.340/2006, art. 22, incisos V, VI e VII"

  - id: of-011
    categoria: medidas_protetivas
    pergunta: "Se uma mulher casada assinou no passado uma procuração em nome do marido e receia que ele venda bens do casal ou fique com objetos que ele retirou dela, que medidas protetivas patrimoniais o juiz pode determinar liminarmente?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "Para a proteção patrimonial dos bens da sociedade conjugal ou de propriedade particular da mulher, o juiz pode determinar liminarmente a restituição de bens indevidamente subtraídos pelo agressor, a proibição temporária para celebrar atos e contratos de compra, venda e locação de propriedade em comum (salvo expressa autorização judicial), a suspensão das procurações conferidas pela ofendida ao agressor e a prestação de caução provisória por perdas e danos materiais, oficiando ao cartório competente."
    pontos_obrigatorios:
      - "Restituição de bens indevidamente subtraídos e proibição temporária de compra, venda e locação de propriedade em comum sem autorização judicial."
      - "Suspensão das procurações conferidas pela ofendida ao agressor."
    normas_aceitas:
      - "Lei 11.340/2006, art. 24"
    fonte: "Lei 11.340/2006, art. 24, incisos I a IV e parágrafo único"

  - id: of-012
    categoria: medidas_protetivas
    pergunta: "Quando um agressor é preso em flagrante por descumprir uma medida protetiva de urgência concedida por um juiz cível, qual é a pena prevista na Lei Maria da Penha e o delegado de polícia pode arbitrar fiança na delegacia?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "Descumprir decisão judicial que defere medidas protetivas de urgência é crime previsto na Lei Maria da Penha com pena de reclusão de 2 a 5 anos e multa. O crime se configura independentemente de a medida ter sido deferida por juiz de competência cível ou criminal, e, em caso de prisão em flagrante, o delegado não pode conceder fiança, pois apenas a autoridade judicial pode fazê-lo."
    pontos_obrigatorios:
      - "A pena prevista é de reclusão de 2 a 5 anos e multa."
      - "O crime ocorre independentemente da competência civil ou criminal do juiz que deferiu a medida."
      - "Na prisão em flagrante, apenas a autoridade judicial (juiz) pode conceder fiança."
    normas_aceitas:
      - "Lei 11.340/2006, art. 24-A"
    fonte: "Lei 11.340/2006, art. 24-A, caput, § 1º e § 2º"

  - id: of-013
    categoria: policia_processo_defensoria
    pergunta: "Uma mulher procurou a delegacia após um episódio de violência doméstica e precisava buscar suas roupas e documentos que ficaram na casa, além de transporte até um local seguro com os filhos. Quais providências a autoridade policial deve adotar segundo a Lei Maria da Penha?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "No atendimento à mulher em situação de violência doméstica, a autoridade policial deve garantir proteção policial (comunicando de imediato ao Ministério Público e ao Judiciário), encaminhar a ofendida ao hospital/posto de saúde e ao IML, fornecer transporte para a ofendida e seus dependentes para abrigo ou local seguro quando houver risco de vida, acompanhá-la para assegurar a retirada de seus pertences do domicílio e informá-la sobre os direitos e serviços disponíveis, inclusive assistência judiciária."
    pontos_obrigatorios:
      - "Fornecer transporte para a ofendida e seus dependentes até abrigo ou local seguro quando houver risco de vida."
      - "Acompanhar a ofendida, se necessário, para assegurar a retirada de seus pertences do domicílio familiar."
    normas_aceitas:
      - "Lei 11.340/2006, art. 11"
    fonte: "Lei 11.340/2006, art. 11, incisos I a V"

  - id: of-014
    categoria: policia_processo_defensoria
    pergunta: "Uma mulher que sofreu violência doméstica quer entrar com pedido de divórcio ou dissolução de união estável no próprio Juizado de Violência Doméstica e Familiar contra a Mulher. Ela pode fazer isso lá, inclusive para resolver a partilha dos bens do casal?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "A ofendida tem a opção de propor a ação de divórcio ou de dissolução de união estável no próprio Juizado de Violência Doméstica e Familiar contra a Mulher, mas a pretensão relacionada à partilha de bens é excluída da competência desse Juizado."
    pontos_obrigatorios:
      - "A ofendida pode optar por propor a ação de divórcio ou dissolução de união estável no Juizado de Violência Doméstica e Familiar contra a Mulher."
      - "A partilha de bens fica excluída da competência do Juizado de Violência Doméstica."
    normas_aceitas:
      - "Lei 11.340/2006, art. 14-A"
    fonte: "Lei 11.340/2006, art. 14-A, caput e § 1º"

  - id: of-015
    categoria: policia_processo_defensoria
    pergunta: "Em crimes de violência doméstica em que a ação penal depende de representação da vítima, a mulher pode simplesmente retirar a representação na delegacia a qualquer momento, ou existe uma regra específica na Lei Maria da Penha para essa retratação?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "Não pode ser feita simplesmente na delegacia: nas ações penais públicas condicionadas à representação da ofendida tratadas na Lei Maria da Penha, a renúncia à representação (retratação) só é admitida perante o juiz, em audiência especialmente designada com essa finalidade, antes do recebimento da denúncia e ouvido o Ministério Público, mediante manifestação expressa da vítima."
    pontos_obrigatorios:
      - "A renúncia à representação só é admitida perante o juiz, em audiência especialmente designada para essa finalidade."
      - "Deve ocorrer antes do recebimento da denúncia e ouvido o Ministério Público."
    normas_aceitas:
      - "Lei 11.340/2006, art. 16"
    fonte: "Lei 11.340/2006, art. 16, caput e parágrafo único"

  - id: of-016
    categoria: policia_processo_defensoria
    pergunta: "Nos casos de violência doméstica, a pena do agressor pode ser substituída apenas por pagamento de cesta básica ou multa isolada, e a mulher pode ser encarregada de entregar pessoalmente uma intimação judicial para ele?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "Não para ambas as perguntas. A Lei Maria da Penha veda expressamente a aplicação de penas de cesta básica ou outras de prestação pecuniária, bem como a substituição de pena que implique o pagamento isolado de multa. Além disso, a ofendida deve ser notificada dos atos processuais relativos ao agressor (especialmente entrada e saída da prisão), mas não pode, em hipótese alguma, entregar intimação ou notificação ao agressor."
    pontos_obrigatorios:
      - "É vedada a aplicação de penas de cesta básica ou de prestação pecuniária e o pagamento isolado de multa."
      - "A ofendida não pode entregar intimação ou notificação ao agressor."
    normas_aceitas:
      - "Lei 11.340/2006, art. 17"
      - "Lei 11.340/2006, art. 21"
    fonte: "Lei 11.340/2006, art. 17 e art. 21, parágrafo único"

  - id: of-017
    categoria: auxilio_fonar_trabalho
    pergunta: "Quando uma mulher precisa sair de casa por causa de violência doméstica e está em situação de vulnerabilidade social e econômica, a Lei Maria da Penha prevê a concessão de auxílio-aluguel pelo juiz e qual é o prazo máximo desse benefício?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "Sim. A Lei Maria da Penha prevê que o juiz pode conceder à ofendida auxílio-aluguel, com valor fixado em função de sua situação de vulnerabilidade social e econômica, por período não superior a 6 meses."
    pontos_obrigatorios:
      - "O juiz pode conceder auxílio-aluguel em função da situação de vulnerabilidade social e econômica da ofendida."
      - "O prazo máximo previsto para o auxílio-aluguel é de até 6 meses."
    normas_aceitas:
      - "Lei 11.340/2006, art. 23"
      - "Lei 11.340/2006, art. 23, VI"
    fonte: "Lei 11.340/2006, art. 23, inciso VI"

  - id: of-018
    categoria: auxilio_fonar_trabalho
    pergunta: "Se uma trabalhadora precisar se afastar do local de trabalho para preservar sua integridade física e psicológica diante de violência doméstica, a Lei Maria da Penha garante a manutenção do emprego dela? Por quanto tempo?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "Sim. Para preservar a integridade física e psicológica da mulher em situação de violência doméstica e familiar, o juiz assegurará a manutenção do vínculo trabalhista, quando necessário o afastamento do local de trabalho, por até 6 meses."
    pontos_obrigatorios:
      - "O juiz assegura a manutenção do vínculo trabalhista quando necessário o afastamento do local de trabalho."
      - "O afastamento com manutenção do vínculo trabalhista pode durar até 6 meses."
    normas_aceitas:
      - "Lei 11.340/2006, art. 9º, § 2º"
    fonte: "Lei 11.340/2006, art. 9º, § 2º, inciso II"

  - id: of-019
    categoria: auxilio_fonar_trabalho
    pergunta: "Quando a mulher em situação de violência doméstica é servidora pública e precisa mudar de unidade ou local de exercício para proteger sua integridade física e psicológica, o que a Lei Maria da Penha garante a ela?"
    autor: "Vítor Gonçalves de Andrade"
    resposta_esperada: "Para preservar sua integridade física e psicológica, o juiz assegurará à mulher em situação de violência doméstica e familiar o acesso prioritário à remoção quando ela for servidora pública, integrante da administração direta ou indireta."
    pontos_obrigatorios:
      - "Garante acesso prioritário à remoção para preservar sua integridade física e psicológica."
      - "Aplica-se à servidora pública integrante da administração direta ou indireta."
    normas_aceitas:
      - "Lei 11.340/2006, art. 9º, § 2º"
    fonte: "Lei 11.340/2006, art. 9º, § 2º, inciso I"

