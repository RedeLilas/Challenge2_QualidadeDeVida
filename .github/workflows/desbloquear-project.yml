name: Desbloquear issues no Project

on:
  issues:
    types: [closed, unblocked]
  workflow_dispatch:

jobs:
  desbloquear:
    runs-on: ubuntu-latest
    steps:
      - name: Mover issues desbloqueadas de Bloqueado para A fazer
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import subprocess
          import sys

          owner = os.environ["REPO_OWNER"]
          repo = os.environ["REPO_NAME"]

          def graphql(query, variables=None):
              cmd = ["gh", "api", "graphql", "-f", f"query={query}"]
              for k, v in (variables or {}).items():
                  cmd.extend(["-F", f"{k}={v}"])
              res = subprocess.run(cmd, capture_output=True, text=True, check=True)
              return json.loads(res.stdout)

          # Busca todas as issues abertas do repositório com suas dependências e itens de projeto
          query = """
          query($owner: String!, $repo: String!) {
            repository(owner: $owner, name: $repo) {
              issues(first: 100, states: [OPEN]) {
                nodes {
                  number
                  title
                  blockedBy(first: 30) {
                    nodes {
                      number
                      state
                    }
                  }
                  projectItems(first: 10) {
                    nodes {
                      id
                      project {
                        id
                        title
                        fields(first: 30) {
                          nodes {
                            ... on ProjectV2SingleSelectField {
                              id
                              name
                              options {
                                id
                                name
                              }
                            }
                          }
                        }
                      }
                      fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                          optionId
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          """

          data = graphql(query, {"owner": owner, "repo": repo})
          issues = data["data"]["repository"]["issues"]["nodes"]

          mutation = """
          mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
            updateProjectV2ItemFieldValue(
              input: {
                projectId: $projectId
                itemId: $itemId
                fieldId: $fieldId
                value: { singleSelectOptionId: $optionId }
              }
            ) {
              projectV2Item {
                id
              }
            }
          }
          """

          atualizadas = 0
          for issue in issues:
              bloqueadores_abertos = [
                  b["number"] for b in issue["blockedBy"]["nodes"] if b["state"] == "OPEN"
              ]
              if bloqueadores_abertos:
                  continue

              for item in issue["projectItems"]["nodes"]:
                  status_atual = (item.get("fieldValueByName") or {}).get("name") or ""
                  if status_atual.strip().lower() != "bloqueado":
                      continue

                  project = item["project"]
                  status_field = next(
                      (f for f in project["fields"]["nodes"] if f and f.get("name") == "Status"),
                      None,
                  )
                  if not status_field:
                      continue

                  opcao_a_fazer = next(
                      (
                          opt
                          for opt in status_field.get("options", [])
                          if opt["name"].strip().lower() == "a fazer"
                      ),
                      None,
                  )
                  if not opcao_a_fazer:
                      continue

                  graphql(
                      mutation,
                      {
                          "projectId": project["id"],
                          "itemId": item["id"],
                          "fieldId": status_field["id"],
                          "optionId": opcao_a_fazer["id"],
                      },
                  )
                  print(
                      f"Issue #{issue['number']} ({issue['title']}) movida de '{status_atual}' para '{opcao_a_fazer['name']}' no projeto '{project['title']}'."
                  )
                  atualizadas += 1

          print(f"Total de issues desbloqueadas movidas para 'A fazer': {atualizadas}")
          EOF
